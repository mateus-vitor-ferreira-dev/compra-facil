# Publica a API no Coolify (ADR 0006) depois que as imagens da main saem. O auto-deploy do Coolify fica
# desligado: ele subiria a main sem esperar os testes. Cada serviço tem o próprio pipeline (e só roda
# quando muda), então este dispara ao fim de qualquer um deles, mas só o disparo do último pipeline do
# commit publica, com todos verdes (deploy/coolify/vez-de-publicar.sh): cada publicação recria os
# contêineres, e um merge que mexe em vários serviços derrubava a API uma vez por pipeline. A publicação
# leva a :main de todas as imagens naquele instante, cada uma com a tag fixa deste deploy.
#
# Enquanto a variável COOLIFY_APP_UUID não existir no repositório, nada roda. O token fica no ambiente
# producao, que só aceita a main.
name: deploy

on:
  workflow_run:
    workflows: [catalog, identity, orders, inventory, payments, notifications, fulfillment, backup, stack-images]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # uma publicação por commit: só o disparo do último pipeline a terminar segue (o manual sempre segue)
  vez:
    name: é a vez de publicar?
    # só o push: o filtro de branch do workflow_run olha o nome, e o PR de um fork com uma branch "main" passaria nele
    if: >-
      vars.COOLIFY_APP_UUID != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # os pipelines do commit
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: deploy/coolify
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            deploy/coolify/vez-de-publicar.sh
          fi

  api:
    name: API no Coolify
    needs: vez
    if: needs.vez.outputs.publish == 'true'
    # uma publicação por vez (a do disparo manual e a do merge, por exemplo); a decisão acima não entra na fila,
    # senão o GitHub cancelaria os disparos pendentes, e entre eles o do último pipeline
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: producao
      url: ${{ vars.URL_API }}
    permissions:
      contents: read
      packages: write # a tag deploy-<id> nas imagens
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      URL_API: ${{ vars.URL_API }}
      DEPLOY_TAG: deploy-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: deploy/coolify
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # todas as imagens que os compose de deploy/coolify pedem com IMAGE_TAG ou SIM_IMAGE_TAG: uma que falte
      # aqui não ganha a tag deste deploy, e o pull dela quebra a publicação
      - name: Fixa a versão e publica
        env:
          IMAGES: >-
            ghcr.io/${{ github.repository_owner }}/compra-facil-catalog
            ghcr.io/${{ github.repository_owner }}/compra-facil-catalog-seed
            ghcr.io/${{ github.repository_owner }}/compra-facil-identity
            ghcr.io/${{ github.repository_owner }}/compra-facil-orders
            ghcr.io/${{ github.repository_owner }}/compra-facil-inventory
            ghcr.io/${{ github.repository_owner }}/compra-facil-payments
            ghcr.io/${{ github.repository_owner }}/compra-facil-notifications
            ghcr.io/${{ github.repository_owner }}/compra-facil-fulfillment
            ghcr.io/${{ github.repository_owner }}/compra-facil-pg-backup
            ghcr.io/${{ github.repository_owner }}/compra-facil-supplier-sim
            ghcr.io/${{ github.repository_owner }}/compra-facil-payment-sim
            ghcr.io/${{ github.repository_owner }}/compra-facil-invoice-sim
            ghcr.io/${{ github.repository_owner }}/compra-facil-gateway
            ghcr.io/${{ github.repository_owner }}/compra-facil-postgres-init
            ghcr.io/${{ github.repository_owner }}/compra-facil-redpanda
            ghcr.io/${{ github.repository_owner }}/compra-facil-otel-collector
            ghcr.io/${{ github.repository_owner }}/compra-facil-media
        run: deploy/coolify/deploy.sh

      # de fora, pelo domínio: o caminho do comprador (DNS, certificado, proxy do Coolify, gateway).
      # Os retries cobrem o gateway, que só manda para um serviço depois que o healthcheck dele passa.
      # Só confere os serviços do compose que o recurso usa: o compose.yaml não tem o fulfillment, e o
      # compose.demo.yaml tem (deploy/coolify/servicos.sh)
      - name: Responde de fora
        run: |
          servicos=$(deploy/coolify/servicos.sh)
          echo "Serviços conferidos: $servicos"
          tem() { grep -qw "$1" <<<"$servicos"; }
          check() { # check <caminho> <status esperado>
            for i in $(seq 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL_API$1" || true)
              [ "$code" = "$2" ] && { echo "ok  $1 ($code)"; return 0; }
              sleep 5
            done
            echo "::error title=Não responde de fora::$URL_API$1 deu $code, esperado $2"
            return 1
          }
          fail=0
          for s in catalog identity orders inventory payments; do
            if tem "$s"; then check "/$s/health" 200 || fail=1; fi
          done
          # o notifications e o fulfillment só expõem a operação: 401 sem token é ele de pé (fora, seria 503)
          for s in notifications fulfillment; do
            if tem "$s"; then check "/$s/v1/admin/dead-letters" 401 || fail=1; fi
          done
          check /catalog/v1/categories 200 || fail=1
          exit $fail
