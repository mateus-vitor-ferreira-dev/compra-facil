# Pipeline do inventory (time de compras). Só roda quando algo que afeta o inventory muda: o próprio serviço,
# a lib comum (libs/dotnet), os contratos ou o build .NET. Mudança só no catalog não dispara este.
name: inventory

on:
  push:
    branches: [main, develop]
    paths:
      - services/inventory/**
      - libs/dotnet/**
      - contracts/**
      - services/dotnet.Dockerfile
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - .editorconfig
      - dotnet-tools.json
      - .github/workflows/inventory.yml
      - .github/workflows/_dotnet-service.yml
  pull_request:
    paths:
      - services/inventory/**
      - libs/dotnet/**
      - contracts/**
      - services/dotnet.Dockerfile
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - .editorconfig
      - dotnet-tools.json
      - .github/workflows/inventory.yml
      - .github/workflows/_dotnet-service.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    uses: ./.github/workflows/_dotnet-service.yml
    permissions:
      contents: read
      packages: write
    with:
      service: inventory
      project: CompraFacil.Inventory.Api
      port: "8003"
