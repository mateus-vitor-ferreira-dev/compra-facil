# Pipeline do notifications (time de compras). Só roda quando algo que afeta o notifications muda: o próprio serviço,
# a lib comum (libs/dotnet), os contratos ou o build .NET. Mudança só no catalog não dispara este.
name: notifications

on:
  push:
    branches: [main, develop]
    paths:
      - services/notifications/**
      - libs/dotnet/**
      - contracts/**
      - services/dotnet.Dockerfile
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - .editorconfig
      - dotnet-tools.json
      - .github/workflows/notifications.yml
      - .github/workflows/_dotnet-service.yml
  pull_request:
    paths:
      - services/notifications/**
      - libs/dotnet/**
      - contracts/**
      - services/dotnet.Dockerfile
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - .editorconfig
      - dotnet-tools.json
      - .github/workflows/notifications.yml
      - .github/workflows/_dotnet-service.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notifications:
    uses: ./.github/workflows/_dotnet-service.yml
    permissions:
      contents: read
      packages: write
    with:
      service: notifications
      project: CompraFacil.Notifications.Api
      port: "8005"
