# A imagem do backup do Postgres da produção (deploy/backup): o script passa no shellcheck e a imagem vai
# para o GHCR, multi-arquitetura (o VPS da produção é ARM), com as mesmas tags dos serviços.
name: backup

on:
  pull_request:
    paths:
      - deploy/backup/**
      - .github/workflows/backup.yml
  push:
    branches: [main, develop]
    paths:
      - deploy/backup/**
      - .github/workflows/backup.yml

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      # sh do busybox (a imagem é alpine): o dialeto é POSIX
      - run: shellcheck --shell=sh deploy/backup/*.sh

  image:
    name: imagem no GHCR
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      # o RUN do Dockerfile (apk add) executa na arquitetura do alvo: o arm64 vai por emulação
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/compra-facil-pg-backup
          tags: |
            type=sha,format=long
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: deploy/backup
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pg-backup
          cache-to: type=gha,scope=pg-backup,mode=max
