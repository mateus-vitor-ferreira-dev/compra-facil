# As imagens dos simuladores, para a loja de demonstração no Coolify (deploy/coolify/compose.demo.yaml). Só arm64: é o
# VPS que as usa, e no local e no CI elas são compiladas pelo compose.
name: sim-images

on:
  push:
    branches: [develop]
    paths:
      - backend/services/supplier-sim/**
      - backend/services/payment-sim/**
      - backend/services/invoice-sim/**
      - .github/workflows/sim-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.sim }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      matrix:
        sim: [supplier-sim, payment-sim, invoice-sim]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: backend/services/${{ matrix.sim }}
          platforms: linux/arm64
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ghcr.io/${{ github.repository_owner }}/compra-facil-${{ matrix.sim }}:develop
