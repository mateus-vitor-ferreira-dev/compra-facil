# Pipeline do catalog (time de catálogo, Go). Não depende de nada do .NET: mudanças em backend/libs/dotnet, nos
# serviços de compras ou nos contratos deles não disparam este, e mudar o catalog não dispara os deles.
name: catalog

on:
  push:
    branches: [main, develop]
    paths:
      - backend/services/catalog/**
      # só os contratos que o catalog serve ou valida (o dele e os comuns): mudança no contrato de
      # outro serviço não republica o catalog (#91)
      - contracts/proto/catalog/**
      - contracts/openapi/catalog.v1.yaml
      - contracts/openapi/common/**
      - contracts/asyncapi/catalog.v1.yaml
      - contracts/asyncapi/common/**
      # o seed sorteia as fotos de infra/media/produtos (o teste confere que todas existem)
      - infra/media/produtos/**
      - infra/media/manifest.json
      - contracts/consumer/orders-catalog.json # contrato que o orders espera (ADR 0004)
      - .github/workflows/catalog.yml
  pull_request:
    paths:
      - backend/services/catalog/**
      # só os contratos que o catalog serve ou valida (o dele e os comuns): mudança no contrato de
      # outro serviço não republica o catalog (#91)
      - contracts/proto/catalog/**
      - contracts/openapi/catalog.v1.yaml
      - contracts/openapi/common/**
      - contracts/asyncapi/catalog.v1.yaml
      - contracts/asyncapi/common/**
      # o seed sorteia as fotos de infra/media/produtos (o teste confere que todas existem)
      - infra/media/produtos/**
      - infra/media/manifest.json
      - contracts/consumer/orders-catalog.json # contrato que o orders espera (ADR 0004)
      - .github/workflows/catalog.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend/services/catalog

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/services/catalog/go.mod
          cache-dependency-path: backend/services/catalog/go.sum
      # módulos baixados antes: com o cache frio, carregar os pacotes estourava o prazo do lint
      - run: go mod download
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          working-directory: backend/services/catalog
          args: --timeout=8m

  test:
    name: testes (-race)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/services/catalog/go.mod
          cache-dependency-path: backend/services/catalog/go.sum
      - name: go test (Postgres e Redpanda reais via testcontainers-go)
        # sem o Ryuk (o container que limpa os outros no fim): o runner é descartado depois do job, e os
        # pacotes rodando em paralelo disputavam o mesmo Ryuk e estouravam o prazo de espera dele
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -race -count=1 ./...

  # "can-i-deploy": a imagem só sai depois dos testes, que verificam o contrato do orders
  # (test/contract_orders_test.go contra contracts/consumer/orders-catalog.json, ADR 0004)
  image:
    name: imagem no GHCR
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/compra-facil-catalog
          # o commit inteiro é a tag imutável; a curta é para gente; a da branch (main) é a que a produção segue
          tags: |
            type=sha,format=long
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: backend/services/catalog
          target: api
          # o VPS da produção é ARM; compilação cruzada no Dockerfile, sem QEMU
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=catalog
          cache-to: type=gha,scope=catalog,mode=max
      # o seed (carga do catálogo) também vai para o registro: é o Job de seed do cluster (F9)
      - id: seed-meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/compra-facil-catalog-seed
          tags: |
            type=sha,format=long
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: backend/services/catalog
          target: seed
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.seed-meta.outputs.tags }}
          labels: ${{ steps.seed-meta.outputs.labels }}
          cache-from: type=gha,scope=catalog

  arm64:
    name: imagem roda em ARM
    needs: image
    # runner ARM nativo: a imagem publicada roda como no VPS da produção, sem emulação
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # sem o serviço no ar, o healthcheck responde "healthcheck: ..." e sai com 1: o binário rodou.
      # Imagem da arquitetura errada daria "exec format error"
      - name: O healthcheck da imagem executa em arm64
        run: |
          image=ghcr.io/${{ github.repository_owner }}/compra-facil-catalog:sha-${{ github.sha }}
          docker pull --platform linux/arm64 "$image"
          out=$(docker run --rm --platform linux/arm64 "$image" healthcheck 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q '^healthcheck:'
