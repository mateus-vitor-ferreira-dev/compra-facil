# Teste ponta a ponta da compra (#83): o ambiente inteiro do compose, com as imagens construídas do
# código, e o k6 pelo gateway nos três cenários (confirmada, sem estoque, pagamento recusado).
# Leva ~7 min (build de todas as imagens), então não bloqueia PR: roda a cada merge em develop/main
# e sob demanda ("Run workflow"). Nos PRs, valem os pipelines de cada serviço e o contrato (ADR 0004).
name: e2e

on:
  push:
    branches: [main, develop]
    paths:
      - services/**
      - libs/**
      - contracts/**
      - gateway/**
      - infra/compose/**
      - compose.yaml
      - Directory.Build.props
      - Directory.Packages.props
      - load-tests/k6/e2e-compra.js
      - .github/workflows/e2e.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: compra ponta a ponta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0 # só para emitir os JWT de admin (services/catalog/cmd/token)
        with:
          go-version-file: services/catalog/go.mod
          cache-dependency-path: services/catalog/go.sum

      - name: Constrói as imagens
        run: docker compose build

      # o cache de build das 6 imagens enche o disco do runner (e aí o Redpanda e o pull do k6 falham);
      # as imagens já estão prontas, o cache não serve mais para nada aqui
      - name: Limpa o cache de build
        run: docker builder prune -af && df -h /

      - name: Sobe o ambiente
        run: docker compose up -d --wait --wait-timeout 600

      - name: Popula o catálogo
        run: docker compose run --rm catalog-seed

      - name: Compra ponta a ponta (k6)
        run: |
          CATALOG_TOKEN=$(cd services/catalog && go run ./cmd/token -ttl 15m)
          INVENTORY_TOKEN=$(cd services/catalog && go run ./cmd/token -aud inventory -ttl 15m)
          docker compose run --rm -e CATALOG_TOKEN="$CATALOG_TOKEN" -e INVENTORY_TOKEN="$INVENTORY_TOKEN" \
            k6 run --quiet /scripts/e2e-compra.js

      - name: Estado e logs (em caso de falha)
        if: failure()
        run: |
          docker compose ps -a
          df -h /
          for c in $(docker compose ps -aq); do docker inspect --format '{{.Name}} {{json .State.Health}}' "$c"; done
          docker compose logs --no-color --tail 200

      - name: Derruba o ambiente
        if: always()
        run: docker compose down -v
