# Teste ponta a ponta da compra (#83): o ambiente inteiro do compose, com as imagens construídas do
# código, e o k6 pelo gateway nos três cenários (confirmada, sem estoque, pagamento recusado).
# Leva ~7 min (build de todas as imagens), então não bloqueia PR: roda a cada merge em develop/main
# e sob demanda ("Run workflow"). Nos PRs, valem os pipelines de cada serviço e o contrato (ADR 0004).
name: e2e

on:
  push:
    branches: [main, develop]
    paths:
      - backend/services/**
      - backend/libs/**
      - contracts/**
      - infra/gateway/**
      - infra/compose/**
      - compose.yaml
      - backend/Directory.Build.props
      - backend/Directory.Packages.props
      - load-tests/k6/e2e-compra.js
      - load-tests/k6/gateway-bff.js
      - .github/workflows/e2e.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: compra ponta a ponta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # o gateway com a rota do BFF (#176), para o teste do rate limit por comprador
      BFF_GATEWAY_KEY: chave-do-bff-no-ci
    steps:
      - uses: actions/checkout@v7.0.1
      # o build das 6 imagens enche o disco do runner (e aí o Redpanda e o pull do k6 falham). Apagar os
      # SDKs que o job não usa leva ~4 min, então roda em segundo plano, junto com o build. (O
      # "docker builder prune" travou no runner, por isso não é usado.)
      - name: Libera espaço em segundo plano
        run: |
          sudo nohup rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            > /dev/null 2>&1 &

      - name: Constrói as imagens
        run: docker compose build

      - name: Sobe o ambiente
        run: |
          df -h /
          docker compose up -d --wait --wait-timeout 600

      - name: Popula o catálogo
        run: docker compose run --rm catalog-seed

      # o admin entra pelo identity (operador inicial do compose)
      - name: Compra ponta a ponta (k6)
        run: docker compose run --rm k6 run --quiet /scripts/e2e-compra.js

      - name: Rate limit por comprador com o BFF (k6)
        run: docker compose run --rm k6 run --quiet /scripts/gateway-bff.js

      - name: Estado e logs (em caso de falha)
        if: failure()
        run: |
          docker compose ps -a
          df -h /
          for c in $(docker compose ps -aq); do docker inspect --format '{{.Name}} {{json .State.Health}}' "$c"; done
          docker compose logs --no-color --tail 200

      - name: Derruba o ambiente
        if: always()
        run: docker compose down -v
