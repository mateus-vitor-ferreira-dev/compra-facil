# Pipeline do payments (time de compras). Só roda quando algo que afeta o payments muda: o próprio serviço,
# a lib comum (backend/libs/dotnet), os contratos que ele lê (com os que eles referenciam; o curinga
# contracts/** rodava os testes de todos a cada contrato mexido, #415) ou o build .NET. Mudança só no catalog não dispara este.
name: payments

on:
  push:
    branches: [main, develop]
    paths:
      - backend/services/payments/**
      - backend/libs/dotnet/**
      - contracts/asyncapi/catalog.v1.yaml
      - contracts/asyncapi/common/v1/common.yaml
      - contracts/asyncapi/fulfillment.v1.yaml
      - contracts/asyncapi/inventory.v1.yaml
      - contracts/asyncapi/orders.v1.yaml
      - contracts/asyncapi/payments.v1.yaml
      - contracts/openapi/catalog.v1.yaml
      - contracts/openapi/common/v1/common.yaml
      - contracts/openapi/common/v1/dead-letters.yaml
      - contracts/openapi/orders.v1.yaml
      - contracts/openapi/payments.v1.yaml
      - backend/services/dotnet.Dockerfile
      - backend/Directory.Build.props
      - backend/Directory.Packages.props
      - backend/global.json
      - .editorconfig
      - backend/dotnet-tools.json
      - .github/workflows/payments.yml
      - .github/workflows/_dotnet-service.yml
  pull_request:
    paths:
      - backend/services/payments/**
      - backend/libs/dotnet/**
      - contracts/asyncapi/catalog.v1.yaml
      - contracts/asyncapi/common/v1/common.yaml
      - contracts/asyncapi/fulfillment.v1.yaml
      - contracts/asyncapi/inventory.v1.yaml
      - contracts/asyncapi/orders.v1.yaml
      - contracts/asyncapi/payments.v1.yaml
      - contracts/openapi/catalog.v1.yaml
      - contracts/openapi/common/v1/common.yaml
      - contracts/openapi/common/v1/dead-letters.yaml
      - contracts/openapi/orders.v1.yaml
      - contracts/openapi/payments.v1.yaml
      - backend/services/dotnet.Dockerfile
      - backend/Directory.Build.props
      - backend/Directory.Packages.props
      - backend/global.json
      - .editorconfig
      - backend/dotnet-tools.json
      - .github/workflows/payments.yml
      - .github/workflows/_dotnet-service.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payments:
    uses: ./.github/workflows/_dotnet-service.yml
    permissions:
      contents: read
      packages: write
    with:
      service: payments
      project: CompraFacil.Payments.Api
      port: "8004"
