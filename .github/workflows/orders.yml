# Pipeline do orders (time de compras). Só roda quando algo que afeta o orders muda: o próprio serviço,
# a lib comum (backend/libs/dotnet), os contratos ou o build .NET. Mudança só no catalog não dispara este.
name: orders

on:
  push:
    branches: [main, develop]
    paths:
      - backend/services/orders/**
      - backend/libs/dotnet/**
      - contracts/**
      - backend/services/dotnet.Dockerfile
      - backend/Directory.Build.props
      - backend/Directory.Packages.props
      - backend/global.json
      - .editorconfig
      - backend/dotnet-tools.json
      - .github/workflows/orders.yml
      - .github/workflows/_dotnet-service.yml
  pull_request:
    paths:
      - backend/services/orders/**
      - backend/libs/dotnet/**
      - contracts/**
      - backend/services/dotnet.Dockerfile
      - backend/Directory.Build.props
      - backend/Directory.Packages.props
      - backend/global.json
      - .editorconfig
      - backend/dotnet-tools.json
      - .github/workflows/orders.yml
      - .github/workflows/_dotnet-service.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orders:
    uses: ./.github/workflows/_dotnet-service.yml
    permissions:
      contents: read
      packages: write
    with:
      service: orders
      project: CompraFacil.Orders.Api
      port: "8002"
