# Manifestos do cluster local (infra/k8s, k3d): o chart dos serviços com os values de cada um, validado
# contra os esquemas do Kubernetes e dos CRDs (Traefik) com o kubeconform.
name: k8s

on:
  pull_request:
    paths:
      - infra/k8s/**
      - .github/workflows/k8s.yml
  push:
    branches: [main, develop]
    paths:
      - infra/k8s/**
      - .github/workflows/k8s.yml

permissions:
  contents: read

jobs:
  validate:
    name: chart e esquemas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/k8s
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: helm lint (cada serviço)
        run: for v in helm/values/*.yaml; do helm lint helm/compra-facil-service -f "$v"; done
      - name: Renderiza
        run: |
          {
            for v in helm/values/*.yaml; do
              helm template "$(basename "$v" .yaml)" helm/compra-facil-service -f "$v"
              echo ---
            done
          } > /tmp/render.yaml
      - name: Esquemas (Kubernetes e CRDs)
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/render.yaml
