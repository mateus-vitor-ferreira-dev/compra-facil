# Pipeline de um serviço .NET (reutilizável): formatação, build e testes em todo PR; imagem no GHCR
# em push para develop/main. Chamado por orders.yml, inventory.yml, payments.yml, notifications.yml e identity.yml.
name: dotnet-service

on:
  workflow_call:
    inputs:
      service:
        description: Nome do serviço (pasta em backend/services/ e sufixo da imagem)
        required: true
        type: string
      project:
        description: "Projeto da Api (ex.: CompraFacil.Orders.Api)"
        required: true
        type: string
      port:
        description: Porta HTTP do serviço no container
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: formatação e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # o dotnet acha o backend/global.json (SDK e o runner de testes, Microsoft.Testing.Platform)
    # procurando a partir do diretório atual: os comandos rodam de dentro do backend/
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore (lock files; CI=true trava as versões)
        run: dotnet restore services/${{ inputs.service }}/*.slnx
      - name: Formatação
        run: dotnet format services/${{ inputs.service }}/*.slnx --verify-no-changes --no-restore
      - name: Build (avisos como erro)
        run: dotnet build services/${{ inputs.service }}/*.slnx --no-restore -c Release
      - name: Testes (Postgres, Redpanda e Mailpit reais via Testcontainers)
        # sem o Ryuk: o runner é descartado depois do job (o mesmo do catalog.yml)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: dotnet test --solution "$(ls services/${{ inputs.service }}/*.slnx)" --no-build -c Release

  image:
    name: imagem no GHCR
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/compra-facil-${{ inputs.service }}
          # o commit inteiro é a tag imutável; a curta é para gente; a da branch (main) é a que a produção segue
          tags: |
            type=sha,format=long
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: backend/services/dotnet.Dockerfile
          # o VPS da produção é ARM; compilação cruzada no Dockerfile, sem QEMU
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE=${{ inputs.service }}
            PROJECT=${{ inputs.project }}
            PORT=${{ inputs.port }}
            APP_VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,scope=${{ inputs.service }},mode=max

  arm64:
    name: imagem roda em ARM
    needs: image
    # runner ARM nativo: a imagem publicada roda como no VPS da produção, sem emulação
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # sem o serviço no ar, o healthcheck responde "healthcheck: ..." e sai com 1: o binário rodou.
      # Imagem da arquitetura errada daria "exec format error"
      - name: O healthcheck da imagem executa em arm64
        run: |
          image=ghcr.io/${{ github.repository_owner }}/compra-facil-${{ inputs.service }}:sha-${{ github.sha }}
          docker pull --platform linux/arm64 "$image"
          out=$(docker run --rm --platform linux/arm64 "$image" healthcheck 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q '^healthcheck:'
