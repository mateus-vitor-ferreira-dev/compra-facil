# A API em produção, no Coolify do VPS da Hetzner (ADR 0006). O Coolify sobe este arquivo como um recurso
# Docker Compose; a única entrada de fora é o gateway, com o domínio da API e o HTTPS do proxy do Coolify.
# As imagens são as do GHCR, geradas pelo CI: aqui nada compila. Passo a passo: deploy/README.md.
#
# Tudo fica na rede desta stack (sem "Connect to Predefined Network"): o VPS roda outros projetos, e
# nomes como redis ou postgres se confundiriam no DNS da rede compartilhada.
#
# Memória: o VPS é de 8 GB e dividido. Cada contêiner tem teto, medido com folga sobre o uso real.

x-dotnet: &dotnet
  restart: unless-stopped
  mem_limit: 320m
  depends_on:
    postgres-databases:
      condition: service_completed_successfully
    redpanda:
      condition: service_started

x-dotnet-env: &dotnet-env
  Kafka__BootstrapServers: redpanda:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_METRIC_EXPORT_INTERVAL: "60000"
  # os tokens do identity, validados pelo JWKS dele na rede interna
  Auth__Authority: http://identity:8006
  Auth__RequireHttpsMetadata: "false"

services:
  gateway:
    image: traefik:v3.7.16
    restart: unless-stopped
    mem_limit: 128m
    command: ["--configFile=/etc/traefik/traefik.yml"]
    environment:
      # a loja (o domínio do front); separe por vírgula se houver mais de um
      CORS_ALLOWED_ORIGINS: ${FRONT_URL:?a URL da loja}
      # o mesmo valor no BFF do front (Cloudflare): o rate limit passa a ser por comprador (#176)
      BFF_GATEWAY_KEY: ${BFF_GATEWAY_KEY:?o segredo do BFF}
      # atrás do proxy do Coolify: o IP do cliente é o último do X-Forwarded-For
      CLIENT_IP_DEPTH: "1"
      # as fotos saem do R2, não do gateway
      GATEWAY_MEDIA: "off"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ../../infra/gateway/traefik/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on: [catalog, orders, inventory, payments, notifications, identity]

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    mem_limit: 768m
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=150
      - -c
      - log_min_duration_statement=500ms
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?a senha do superusuário}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # a cada deploy: cria o banco e o usuário de um serviço novo e acerta as senhas (idempotente)
  postgres-databases:
    image: postgres:17.11-alpine
    restart: "no"
    # roda e sai: o Coolify não o conta na saúde da stack
    exclude_from_hc: true
    entrypoint: ["bash", "/init-databases.sh"]
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      SERVICE_DATABASES: catalog,orders,inventory,payments,notifications,identity
      SERVICE_DB_PASSWORD_CATALOG: ${PG_CATALOG_PASSWORD:?}
      SERVICE_DB_PASSWORD_ORDERS: ${PG_ORDERS_PASSWORD:?}
      SERVICE_DB_PASSWORD_INVENTORY: ${PG_INVENTORY_PASSWORD:?}
      SERVICE_DB_PASSWORD_PAYMENTS: ${PG_PAYMENTS_PASSWORD:?}
      SERVICE_DB_PASSWORD_NOTIFICATIONS: ${PG_NOTIFICATIONS_PASSWORD:?}
      SERVICE_DB_PASSWORD_IDENTITY: ${PG_IDENTITY_PASSWORD:?}
    volumes:
      - ../../infra/compose/postgres/init-databases.sh:/init-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  # um pg_dump de cada banco por dia no R2, com retenção (deploy/backup)
  pg-backup:
    image: ghcr.io/mateus-vitor-ferreira-dev/compra-facil-pg-backup:${IMAGE_TAG:-main}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DATABASES: catalog,orders,inventory,payments,notifications,identity
      BACKUP_TIME: "06:00"
      BACKUP_RETENTION_DAYS: "14"
      S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?o endpoint S3 do R2}
      S3_BUCKET: ${BACKUP_S3_BUCKET:-compra-facil-backups}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?}
      OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    mem_limit: 128m
    # só cache do catalog: sem disco, com teto e descarte dos menos usados
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  redpanda:
    image: redpandadata/redpanda:v26.2.5
    restart: unless-stopped
    mem_limit: 768m
    # a configuração de produção (redpanda.yaml) vai para o diretório que o rpk reescreve na partida
    entrypoint: ["bash", "-c"]
    command:
      - cp /config/redpanda.yaml /etc/redpanda/redpanda.yaml
        && cp /config/redpanda.bootstrap.yaml /etc/redpanda/.bootstrap.yaml
        && exec /entrypoint.sh redpanda start --smp=1 --memory=512M --reserve-memory=0M --default-log-level=warn
    volumes:
      - ./redpanda.yaml:/config/redpanda.yaml:ro
      - ./redpanda.bootstrap.yaml:/config/redpanda.bootstrap.yaml:ro
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9644/v1/status/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    mem_limit: 192m
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:?o endpoint OTLP do Grafana Cloud}
      # base64 de "<instance id>:<token>"
      GRAFANA_CLOUD_OTLP_AUTH: ${GRAFANA_CLOUD_OTLP_AUTH:?}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro

  catalog:
    image: ghcr.io/mateus-vitor-ferreira-dev/compra-facil-catalog:${IMAGE_TAG:-main}
    restart: unless-stopped
    mem_limit: 128m
    environment:
      CATALOG_APP_ENV: production
      CATALOG_GRPC_REFLECTION: "false"
      CATALOG_DB_DSN: postgres://catalog:${PG_CATALOG_PASSWORD}@postgres:5432/catalog?sslmode=disable
      CATALOG_CACHE_REDIS_ADDR: redis:6379
      CATALOG_EVENTS_BROKERS: redpanda:9092
      CATALOG_AUTH_AUTHORITY: http://identity:8006
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres-databases:
        condition: service_completed_successfully
      redis:
        condition: service_started
      redpanda:
        condition: service_started

  identity:
    <<: *dotnet
    image: ghcr.io/mateus-vitor-ferreira-dev/compra-facil-identity:${IMAGE_TAG:-main}
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=identity;Username=identity;Password=${PG_IDENTITY_PASSWORD}
      Identity__EmailConfirmation__UrlTemplate: ${FRONT_URL}/conta/confirmar-email?conta={account_id}&token={token}
      Identity__EmailConfirmation__Required: ${EMAIL_CONFIRMATION_REQUIRED:-true}
      # o operador inicial; conta que já existe mantém a senha trocada depois
      Identity__Admin__Email: ${ADMIN_EMAIL:?o e-mail do operador}
      Identity__Admin__Password: ${ADMIN_PASSWORD:?a senha inicial do operador}
      Identity__Google__ClientIds__0: ${GOOGLE_CLIENT_ID:-}

  orders:
    <<: *dotnet
    image: ghcr.io/mateus-vitor-ferreira-dev/compra-facil-orders:${IMAGE_TAG:-main}
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${PG_ORDERS_PASSWORD}
      Catalog__GrpcAddress: http://catalog:9001

  inventory:
    <<: *dotnet
    image: ghcr.io/mateus-vitor-ferreira-dev/compra-facil-inventory:${IMAGE_TAG:-main}
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=inventory;Username=inventory;Password=${PG_INVENTORY_PASSWORD}
      # loja de demonstração: produto novo (inclusive os do seed) nasce com estoque para dar para comprar
      Inventory__InitialOnHandForNewProducts: ${INITIAL_STOCK_FOR_NEW_PRODUCTS:-100}

  payments:
    <<: *dotnet
    image: ghcr.io/mateus-vitor-ferreira-dev/compra-facil-payments:${IMAGE_TAG:-main}
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=payments;Username=payments;Password=${PG_PAYMENTS_PASSWORD}

  notifications:
    <<: *dotnet
    image: ghcr.io/mateus-vitor-ferreira-dev/compra-facil-notifications:${IMAGE_TAG:-main}
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=notifications;Username=notifications;Password=${PG_NOTIFICATIONS_PASSWORD}
      # SMTP de verdade (Resend: smtp.resend.com, 587, usuário "resend", a chave da API como senha)
      Smtp__Host: ${SMTP_HOST:?}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__UseTls: "true"
      Smtp__User: ${SMTP_USER:?}
      Smtp__Password: ${SMTP_PASSWORD:?}
      Smtp__FromAddress: ${SMTP_FROM:?o remetente, de um domínio verificado}

volumes:
  postgres-data:
  redpanda-data:
