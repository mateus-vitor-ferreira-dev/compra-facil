# A API em produção, no Coolify do VPS da Hetzner (ADR 0006). O Coolify sobe este arquivo como um recurso
# Docker Compose; a única entrada de fora é o gateway, com o domínio da API e o HTTPS do proxy do Coolify.
# As imagens são as do GHCR, geradas pelo CI: aqui nada compila. Passo a passo: deploy/README.md.
#
# Nenhum arquivo do repositório é montado: o Coolify resolveria os caminhos no disco do servidor, onde o repositório
# não fica (#278). A configuração do gateway, do Redpanda, do Collector e o script dos bancos vão nas imagens de
# deploy/images.
#
# Tudo fica na rede desta stack (sem "Connect to Predefined Network"): o VPS roda outros projetos, e
# nomes como redis ou postgres se confundiriam no DNS da rede compartilhada.
#
# Memória: o VPS é de 8 GB e dividido. Cada contêiner tem teto, medido com folga sobre o uso real.

x-dotnet: &dotnet
  restart: unless-stopped
  mem_limit: 320m
  depends_on:
    postgres-databases:
      condition: service_completed_successfully
    redpanda:
      condition: service_started

x-dotnet-env: &dotnet-env
  Kafka__BootstrapServers: redpanda:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_METRIC_EXPORT_INTERVAL: "60000"
  # os tokens do identity, validados pelo JWKS dele na rede interna
  Auth__Authority: http://identity:8006
  Auth__RequireHttpsMetadata: "false"

services:
  gateway:
    # o Traefik com o traefik.yml e as rotas de infra/gateway/traefik/dynamic dentro
    image: ghcr.io/mateus-vitor-ferreira-dev/embrulhado-gateway:${IMAGE_TAG:-main}
    restart: unless-stopped
    mem_limit: 128m
    command: ["--configFile=/etc/traefik/traefik.yml"]
    environment:
      # a loja (o domínio do front); separe por vírgula se houver mais de um
      # mais de um endereço da loja (com e sem www): CORS_ALLOWED_ORIGINS com a lista separada por vírgula
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${FRONT_URL:?a URL da loja}}
      # o mesmo valor no BFF do front (Cloudflare): o rate limit passa a ser por comprador (#176)
      BFF_GATEWAY_KEY: ${BFF_GATEWAY_KEY:?o segredo do BFF}
      # atrás do proxy do Coolify: o IP do cliente é o último do X-Forwarded-For
      CLIENT_IP_DEPTH: "1"
      # as fotos saem do R2, não do gateway
      GATEWAY_MEDIA: "off"
      # o fulfillment entra com o fornecedor manual: a planilha e a fila "Pedidos a fazer" no painel
      GATEWAY_FULFILLMENT: "on"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on: [catalog, orders, inventory, payments, notifications, identity, fulfillment]

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    mem_limit: 768m
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=150
      - -c
      - log_min_duration_statement=500ms
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?a senha do superusuário}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # a cada deploy: cria o banco e o usuário de um serviço novo e acerta as senhas (idempotente)
  postgres-databases:
    # o postgres com o infra/compose/postgres/init-databases.sh dentro
    image: ghcr.io/mateus-vitor-ferreira-dev/embrulhado-postgres-init:${IMAGE_TAG:-main}
    restart: "no"
    # roda e sai: o Coolify não o conta na saúde da stack
    exclude_from_hc: true
    entrypoint: ["bash", "/init-databases.sh"]
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      SERVICE_DATABASES: catalog,orders,inventory,payments,notifications,identity,fulfillment
      SERVICE_DB_PASSWORD_CATALOG: ${PG_CATALOG_PASSWORD:?}
      SERVICE_DB_PASSWORD_ORDERS: ${PG_ORDERS_PASSWORD:?}
      SERVICE_DB_PASSWORD_INVENTORY: ${PG_INVENTORY_PASSWORD:?}
      SERVICE_DB_PASSWORD_PAYMENTS: ${PG_PAYMENTS_PASSWORD:?}
      SERVICE_DB_PASSWORD_NOTIFICATIONS: ${PG_NOTIFICATIONS_PASSWORD:?}
      SERVICE_DB_PASSWORD_IDENTITY: ${PG_IDENTITY_PASSWORD:?}
      SERVICE_DB_PASSWORD_FULFILLMENT: ${PG_FULFILLMENT_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy

  # um pg_dump de cada banco por dia no R2, com retenção (deploy/backup)
  pg-backup:
    image: ghcr.io/mateus-vitor-ferreira-dev/embrulhado-pg-backup:${IMAGE_TAG:-main}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DATABASES: catalog,orders,inventory,payments,notifications,identity,fulfillment
      BACKUP_TIME: "06:00"
      BACKUP_RETENTION_DAYS: "14"
      # sem o endpoint, o backup fica parado e avisa no log (o bucket e a chave do R2 ainda não existem)
      S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      S3_BUCKET: ${BACKUP_S3_BUCKET:-embrulhado-backups}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      OTLP_ENDPOINT: http://otel-collector:4318
      # a chave pública do age (não é segredo): os dumps sobem cifrados para ela. A privada fica com o dono
      # (Bitwarden), não no servidor; o restore.sh a recebe pela entrada padrão
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-age1cwkfy2fw6dd9m4rq3eh46y3y77962655m4kvfvk5rkj5a2fgtafqluq0g7}
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    mem_limit: 128m
    # só cache do catalog: sem disco, com teto e descarte dos menos usados
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  redpanda:
    # o Redpanda com o redpanda.yaml e o redpanda.bootstrap.yaml em /config
    image: ghcr.io/mateus-vitor-ferreira-dev/embrulhado-redpanda:${IMAGE_TAG:-main}
    restart: unless-stopped
    mem_limit: 768m
    # a configuração de produção (redpanda.yaml) vai para o diretório que o rpk reescreve na partida
    entrypoint: ["bash", "-c"]
    command:
      - cp /config/redpanda.yaml /etc/redpanda/redpanda.yaml
        && cp /config/redpanda.bootstrap.yaml /etc/redpanda/.bootstrap.yaml
        && exec /entrypoint.sh redpanda start --smp=1 --memory=512M --reserve-memory=0M --default-log-level=warn
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9644/v1/status/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  otel-collector:
    # o Collector com o otel-collector.yaml em /etc/otelcol/config.yaml
    image: ghcr.io/mateus-vitor-ferreira-dev/embrulhado-otel-collector:${IMAGE_TAG:-main}
    restart: unless-stopped
    # a imagem não tem shell nem cliente HTTP para chamar o health_check (:13133). Um contêiner sem healthcheck
    # deixaria a stack inteira como running:unknown no Coolify (#276); o Collector fora do ar só some com a telemetria
    exclude_from_hc: true
    mem_limit: 192m
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      # sem o Grafana Cloud, o Collector manda para um endereço vazio e descarta: os serviços não dependem dele
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:-http://127.0.0.1:1}
      # base64 de "<instance id>:<token>"
      GRAFANA_CLOUD_OTLP_AUTH: ${GRAFANA_CLOUD_OTLP_AUTH:-}

  catalog:
    image: ghcr.io/mateus-vitor-ferreira-dev/embrulhado-catalog:${IMAGE_TAG:-main}
    restart: unless-stopped
    mem_limit: 128m
    environment:
      CATALOG_APP_ENV: production
      CATALOG_GRPC_REFLECTION: "false"
      CATALOG_DB_DSN: postgres://catalog:${PG_CATALOG_PASSWORD}@postgres:5432/catalog?sslmode=disable
      CATALOG_CACHE_REDIS_ADDR: redis:6379
      CATALOG_EVENTS_BROKERS: redpanda:9092
      CATALOG_AUTH_AUTHORITY: http://identity:8006
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres-databases:
        condition: service_completed_successfully
      redis:
        condition: service_started
      redpanda:
        condition: service_started

  identity:
    <<: *dotnet
    image: ghcr.io/mateus-vitor-ferreira-dev/embrulhado-identity:${IMAGE_TAG:-main}
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=identity;Username=identity;Password=${PG_IDENTITY_PASSWORD}
      Identity__EmailConfirmation__UrlTemplate: ${FRONT_URL}/conta/confirmar-email?conta={account_id}&token={token}
      Identity__GuestAccess__UrlTemplate: ${FRONT_URL}/acompanhar/abrir?token={token}
      Identity__PasswordReset__UrlTemplate: ${FRONT_URL}/conta/redefinir-senha?conta={account_id}&token={token}
      Identity__EmailConfirmation__Required: ${EMAIL_CONFIRMATION_REQUIRED:-true}
      # o operador inicial; conta que já existe mantém a senha trocada depois
      Identity__Admin__Email: ${ADMIN_EMAIL:?o e-mail do operador}
      Identity__Admin__Password: ${ADMIN_PASSWORD:?a senha inicial do operador}
      # a conta só de leitura do vigia do agentes-hub (#403); vazia, não é criada
      Identity__Auditor__Email: ${AUDITOR_EMAIL:-}
      Identity__Auditor__Password: ${AUDITOR_PASSWORD:-}
      Identity__Google__ClientIds__0: ${GOOGLE_CLIENT_ID:-}

  orders:
    <<: *dotnet
    image: ghcr.io/mateus-vitor-ferreira-dev/embrulhado-orders:${IMAGE_TAG:-main}
    environment:
      <<: *dotnet-env
      # a cotação de frete (orders) e o estoque do fornecedor (inventory) vêm do fulfillment
      Fulfillment__BaseUrl: http://fulfillment:8007/
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${PG_ORDERS_PASSWORD}
      Catalog__GrpcAddress: http://catalog:9001

  inventory:
    <<: *dotnet
    image: ghcr.io/mateus-vitor-ferreira-dev/embrulhado-inventory:${IMAGE_TAG:-main}
    environment:
      <<: *dotnet-env
      # a cotação de frete (orders) e o estoque do fornecedor (inventory) vêm do fulfillment
      Fulfillment__BaseUrl: http://fulfillment:8007/
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=inventory;Username=inventory;Password=${PG_INVENTORY_PASSWORD}
      # loja de demonstração: produto novo (inclusive os do seed) nasce com estoque para dar para comprar
      Inventory__InitialOnHandForNewProducts: ${INITIAL_STOCK_FOR_NEW_PRODUCTS:-100}

  payments:
    <<: *dotnet
    image: ghcr.io/mateus-vitor-ferreira-dev/embrulhado-payments:${IMAGE_TAG:-main}
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=payments;Username=payments;Password=${PG_PAYMENTS_PASSWORD}
      # a Efí (#379). Sem as credenciais, o payments responde "provedor fora do ar" e nada é cobrado
      Payments__Efi__ChargesBaseUrl: ${EFI_CHARGES_URL:-https://cobrancas.api.efipay.com.br/}
      Payments__Efi__PixBaseUrl: ${EFI_PIX_URL:-https://pix.api.efipay.com.br/}
      Payments__Efi__ClientId: ${EFI_CLIENT_ID:-}
      Payments__Efi__ClientSecret: ${EFI_CLIENT_SECRET:-}
      Payments__Efi__PixCertificateBase64: ${EFI_PIX_CERTIFICATE_BASE64:-}
      Payments__Efi__PixKey: ${EFI_PIX_KEY:-}
      Payments__Efi__PixWebhookSecret: ${EFI_PIX_WEBHOOK_SECRET:-}
      # o nome que o cliente vê no banco ("<nome>, pedido 1A2B3C4D") e o projeto no custom_id do cartão, que separa
      # no extrato da conta Efí o que entrou por esta loja (agentes-hub#183)
      Payments__Efi__StoreName: ${EFI_STORE_NAME:-Embrulhado}
      Payments__Efi__ProjectTag: ${EFI_PROJECT_TAG:-embrulhado}
      # os avisos da Efí, com o domínio da API (deploy/README.md). Vazios: o cartão não recebe a mudança de status e o
      # webhook do PIX não é cadastrado (o PIX pago só é visto quando vence, pelo job)
      Payments__Efi__ChargeNotificationUrl: ${EFI_CHARGE_NOTIFICATION_URL:-}
      Payments__Efi__PixWebhookUrl: ${EFI_PIX_WEBHOOK_URL:-}

  notifications:
    <<: *dotnet
    image: ghcr.io/mateus-vitor-ferreira-dev/embrulhado-notifications:${IMAGE_TAG:-main}
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=notifications;Username=notifications;Password=${PG_NOTIFICATIONS_PASSWORD}
      # SMTP de verdade (Resend: smtp.resend.com, 587, usuário "resend", a chave da API como senha)
      # vazio, o envio falha e é tentado de novo: os e-mails saem quando o SMTP entrar
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__UseTls: "true"
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM:-pedidos@embrulhado.com.br}
      Smtp__FromName: ${SMTP_FROM_NAME:-Embrulhado}
      # a resposta do cliente vai para a caixa da loja (a raiz do domínio não recebe e-mail: null MX)
      Smtp__ReplyTo: ${SMTP_REPLY_TO:-}

  # o fornecedor manual: a equipe compra no fornecedor pela fila "Pedidos a fazer" e sobe a planilha do catálogo
  fulfillment:
    <<: *dotnet
    image: ghcr.io/mateus-vitor-ferreira-dev/embrulhado-fulfillment:${IMAGE_TAG:-main}
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fulfillment;Username=fulfillment;Password=${PG_FULFILLMENT_PASSWORD:?}
      Supplier__Mode: manual
      # só pedidos confirmados a partir daqui vão para a fila (o consumer lê o tópico desde o começo)
      Supplier__AcceptOrdersSince: ${SUPPLIER_ACCEPT_ORDERS_SINCE:?a data a partir da qual os pedidos vão ao fornecedor}
      # os preços da loja para o frete grátis pela margem
      Catalog__GrpcAddress: http://catalog:9001
      # MEI sem certificado A1: o pedido vai ao fornecedor sem nota (deploy/README.md, "Vender sem nota fiscal")
      Invoice__Enabled: "false"

volumes:
  postgres-data:
  redpanda-data:
