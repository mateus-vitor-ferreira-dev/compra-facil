# Os alertas da produção (#162), no Grafana Cloud. Quem publica é o publicar.py (README desta pasta),
# pela API de provisionamento: no painel eles aparecem travados, e a mudança é por aqui.
#
# Cada regra é uma consulta PromQL que só devolve série, e com valor acima de zero, quando há problema:
# a condição é "A > limiar", e o limiar é 0 se a regra não diz outro. Sem série a regra fica normal
# (noData: OK), salvo onde o silêncio é o próprio problema.
# O datasource "prometheus" é trocado pelo do Grafana Cloud na publicação.

pasta: CompraFácil
grupo: producao
intervalo: 1m
contato:
  nome: compra-facil-email
  # ALERT_EMAIL, na publicação

regras:
  - uid: cf-gateway-5xx
    titulo: Gateway respondendo 5xx
    severidade: critica
    para: 2m
    # a partir de 5 erros e 5% das respostas em 5 minutos, por rota do gateway: um 500 isolado não acorda
    # ninguém. A métrica é a do router, que conta também o 503 de um serviço sem contêiner de pé
    expr: |
      (sum by (router) (increase(traefik_router_requests_total{code=~"5.."}[5m])) >= 5)
      and
      (sum by (router) (rate(traefik_router_requests_total{code=~"5.."}[5m]))
        / sum by (router) (rate(traefik_router_requests_total[5m])) > 0.05)
    resumo: "{{ $labels.router }}: 5xx em mais de 5% das respostas"
    descricao: >-
      O gateway devolveu 5xx em mais de 5% das respostas da rota {{ $labels.router }} nos últimos 5
      minutos. Ver o dashboard "Serviços (RED)" e os traces com erro no Tempo.

  - uid: cf-catalog-fora
    titulo: Catálogo fora
    severidade: critica
    para: 2m
    # 502/503/504 do gateway nas rotas do catalog (a da loja e a do BFF), ou o catalog parou de mandar
    # métricas. O max junta os dois num alerta só
    expr: |
      max(
        (sum(increase(traefik_router_requests_total{router=~"catalog(-bff)?@file", code=~"502|503|504"}[5m])) > 0)
        or
        absent(http_server_request_duration_seconds_count{service_name="catalog"})
      )
    resumo: O catálogo não responde
    descricao: >-
      O gateway não alcança o catalog (502/503/504), ou ele parou de mandar telemetria. Sem o catálogo
      a loja não lista produtos, e os pedidos usam o último preço conhecido. Ver o contêiner catalog no
      Coolify.

  - uid: cf-servico-fora
    titulo: Serviço sem telemetria
    severidade: critica
    para: 1m
    # os contadores HTTP vão ao Collector a cada exportação, com ou sem tráfego: sumir é o serviço fora.
    # A série some da consulta 5 minutos depois da última exportação, então o aviso leva uns 7 minutos
    # (o catalog tem a regra dele)
    expr: |
      group by (service_name) (max_over_time(http_server_request_duration_seconds_count{service_name=~"orders|inventory|payments|notifications|identity|gateway"}[6h]))
      unless on (service_name)
      group by (service_name) (http_server_request_duration_seconds_count)
    resumo: "{{ $labels.service_name }} parou de mandar telemetria"
    descricao: >-
      O {{ $labels.service_name }} mandava métricas até há pouco e parou: o contêiner caiu, reinicia em
      laço ou perdeu o Collector. Ver o estado dele no Coolify.

  - uid: cf-consumer-lag
    titulo: Consumer parado
    severidade: alta
    para: 0s
    # com o tráfego de uma loja de demonstração o lag volta a zero em segundos: 15 minutos sem zerar é
    # consumer travado. Os grupos de reprocessamento da DLT só andam à mão e ficam de fora.
    expr: |
      min_over_time((sum by (group) (kafka_consumer_group_lag_sum_ratio{group!~".*\\.dlt-replay"}))[15m:1m]) > 0
    resumo: "O consumer {{ $labels.group }} não zera o lag há 15 minutos"
    descricao: >-
      O grupo {{ $labels.group }} tem mensagens esperando há pelo menos 15 minutos (agora: {{ $values.A }}).
      Ver o dashboard "SAGA de compra" e os logs do serviço.

  - uid: cf-dlt
    titulo: Mensagem na DLT
    severidade: alta
    para: 0s
    # o increase não vê o primeiro valor de um contador que acaba de nascer: a série nova também conta
    expr: |
      (sum by (service_name, topic) (increase(compra_facil_messaging_consumed_total{result="dead_lettered"}[10m])) > 0)
      or
      (count by (service_name, topic) (compra_facil_messaging_consumed_total{result="dead_lettered"})
        unless count by (service_name, topic) (compra_facil_messaging_consumed_total{result="dead_lettered"} offset 10m))
    resumo: "{{ $labels.service_name }} mandou mensagem de {{ $labels.topic }} para a DLT"
    descricao: >-
      Uma mensagem de {{ $labels.topic }} esgotou as tentativas no {{ $labels.service_name }} ou está fora
      do contrato. Ver e reprocessar no painel da loja, em /admin/falhas.

  - uid: cf-backup-atrasado
    titulo: Backup atrasado
    severidade: alta
    para: 0s
    # o pg-backup manda a métrica uma vez por dia: sem o max_over_time ela some da consulta em 5 minutos.
    # Esta consulta sempre devolve a idade do backup, com limiar próprio, porque o silêncio aqui é
    # alarme: nada em 3 dias também é atraso (noData: Alerting)
    expr: |
      time() - max_over_time(compra_facil_backup_last_success_seconds[3d])
    limiar: 93600 # 26 horas
    sem_dados: Alerting
    resumo: O último backup inteiro tem mais de 26 horas
    descricao: >-
      O pg-backup roda às 3h (Brasília). Mais de 26 horas sem um backup inteiro: ver os logs do
      contêiner pg-backup e o bucket no R2. Um backup na hora: deploy/README.md, "Backup e restauração".

  - uid: cf-backup-falhou
    titulo: Backup falhou
    severidade: alta
    para: 0s
    # 1 quando a última rodada falhou (o == bool devolve 0 ou 1, e o limiar é o "> 0" de todas)
    expr: |
      last_over_time(compra_facil_backup_last_run_ok_ratio[2d]) == bool 0
    resumo: A última rodada do backup falhou
    descricao: >-
      A última rodada do pg-backup terminou com erro (o backup do dia anterior continua no bucket). Ver
      os logs do contêiner pg-backup.

  # Pagamentos e segurança (ameaças T1 e T5): ninguém olha o painel da Efí todo dia, então o que foge do
  # caminho feliz do dinheiro e as rajadas contra webhooks e login avisam por e-mail.
  #
  # Os contadores destas regras são raros e nascem no primeiro caso de cada processo, e o increase não vê
  # o primeiro valor de uma série nova: a que nasceu dentro da janela (o "unless ... offset") entra com o
  # valor inteiro, e a que já existia, com o increase. O "* 1" tira o nome da métrica, para o "or" casar as
  # duas metades pelas mesmas labels.

  - uid: cf-pagamento-revertido
    titulo: Cartão aprovado não se confirmou
    severidade: critica
    para: 0s
    # a Efí aprovou o cartão (o pedido já foi confirmado) e depois não pagou (Failed) ou cancelou (Voided)
    expr: |
      sum by (status) (
        ((compra_facil_payments_reversals_total unless compra_facil_payments_reversals_total offset 5m) * 1)
        or increase(compra_facil_payments_reversals_total[5m])
      )
    resumo: "Um cartão aprovado não se confirmou na Efí ({{ $labels.status }})"
    descricao: >-
      A operadora aprovou o cartão de um pedido já confirmado e depois não o pagou (Failed) ou o cancelou
      (Voided): o dinheiro não vem. Achar o pedido nos logs do payments ({service_name="payments"} |=
      "não se confirmou", no Loki), abrir o detalhe dele no painel da loja (/admin/pedidos/<id>), que diz
      se o pedido parou sozinho ou se é preciso cancelar no fornecedor, e conferir a cobrança no painel da
      Efí.

  - uid: cf-pagamento-contestado
    titulo: Pagamento contestado
    severidade: critica
    para: 0s
    # contestação ou chargeback: tem prazo na Efí, e quem não responde perde o valor
    expr: |
      sum(
        ((compra_facil_payments_disputes_total unless compra_facil_payments_disputes_total offset 10m) * 1)
        or increase(compra_facil_payments_disputes_total[10m])
      )
    resumo: "URGENTE: um cliente contestou um pagamento; responda no painel da Efí dentro do prazo"
    descricao: >-
      Um pagamento aprovado foi contestado pelo cliente (reclamação ou chargeback) e está em disputa.
      Responda no painel da Efí dentro do prazo, com a nota fiscal, o rastreio e a confirmação da
      entrega: sem resposta, o valor volta ao cliente. O pedido está nos logs do payments
      ({service_name="payments"} |= "contestado", no Loki), e o detalhe dele no painel da loja
      (/admin/pedidos/<id>) diz se é preciso cancelar no fornecedor. Não estorne pelo painel: a
      contestação já devolve.

  - uid: cf-estorno-falhou
    titulo: Estorno não realizado
    severidade: alta
    para: 0s
    # a Efí aceitou a devolução e depois não a fez (o PIX sem saldo na conta, #396): o cliente não recebeu
    expr: |
      sum(
        ((compra_facil_payments_refunds_failed_total unless compra_facil_payments_refunds_failed_total offset 10m) * 1)
        or increase(compra_facil_payments_refunds_failed_total[10m])
      )
    resumo: Um estorno aceito pela Efí não foi realizado
    descricao: >-
      A Efí aceitou devolver o dinheiro de um pedido e não devolveu (em geral, falta de saldo na conta):
      o pedido voltou a esperar o estorno. Conferir o saldo no painel da Efí e estornar de novo pelo
      painel da loja, no detalhe do pedido (/admin/pedidos/<id>). O pedido está nos logs do payments
      ({service_name="payments"} |= "devolução", no Loki).

  - uid: cf-webhook-recusado
    titulo: Webhook recusado em rajada
    severidade: alta
    para: 0s
    # quem manda de verdade (Efí, fornecedor) não erra o segredo nem a assinatura, e com o fornecedor manual
    # ninguém manda webhook (o 404, manual_mode): 5 recusas em 10 minutos
    # já não são um robô qualquer da internet de passagem, e sim alguém tentando forjar o "pago" ou o
    # "enviado", ou o segredo trocado de um lado só (os avisos verdadeiros se perdendo). O token de cartão
    # desconhecido tem limiar maior (10): a conta da Efí pode ter outros projetos, e cada token custa uma
    # consulta à Efí
    expr: |
      (sum by (service_name, webhook, reason) (
        ((compra_facil_payments_webhooks_rejected_total{reason="secret"} unless compra_facil_payments_webhooks_rejected_total{reason="secret"} offset 10m) * 1)
        or increase(compra_facil_payments_webhooks_rejected_total{reason="secret"}[10m])
      ) >= 5)
      or
      (sum by (service_name, webhook, reason) (
        ((compra_facil_payments_webhooks_rejected_total{reason="unknown_token"} unless compra_facil_payments_webhooks_rejected_total{reason="unknown_token"} offset 10m) * 1)
        or increase(compra_facil_payments_webhooks_rejected_total{reason="unknown_token"}[10m])
      ) >= 10)
      or
      (sum by (service_name, reason) (
        ((compra_facil_fulfillment_webhooks_rejected_total{reason=~"signature|manual_mode"} unless compra_facil_fulfillment_webhooks_rejected_total{reason=~"signature|manual_mode"} offset 10m) * 1)
        or increase(compra_facil_fulfillment_webhooks_rejected_total{reason=~"signature|manual_mode"}[10m])
      ) >= 5)
    resumo: "{{ $labels.service_name }}: {{ $values.A }} avisos recusados ({{ $labels.reason }}) em 10 minutos"
    descricao: >-
      O {{ $labels.service_name }} recusou avisos em rajada, pelo motivo {{ $labels.reason }}: secret é o
      segredo errado no webhook do PIX, unknown_token é o aviso de cartão com um token que a Efí não
      conhece, signature é a assinatura errada no webhook do fornecedor, manual_mode é o webhook do
      fornecedor chamado com o fornecedor manual ligado (ninguém deveria mandar). Ou alguém tenta forjar um
      pagamento ou um envio, ou o segredo mudou de um lado só e os avisos verdadeiros estão se perdendo.
      Ver de onde vêm nos logs do contêiner gateway, no Coolify, e conferir o segredo cadastrado no
      painel da Efí (ou do fornecedor) contra o das variáveis do Coolify.

  - uid: cf-login-em-massa
    titulo: Tentativas de login em massa
    severidade: alta
    para: 0s
    # 30 senhas erradas, 3 contas bloqueadas (5 erros cada) ou 20 respostas 429 do rate limit das rotas de
    # credencial, em 10 minutos. Uma loja pequena erra a senha poucas vezes por hora, e o rate limit (5/s
    # por IP, rajada de 20) não pega quem digita: passar disso é robô testando senhas. O label "sinal" diz
    # qual dos três disparou
    expr: |
      label_replace(sum(
        ((compra_facil_identity_logins_total{result=~"invalid_credentials|locked_out"} unless compra_facil_identity_logins_total{result=~"invalid_credentials|locked_out"} offset 10m) * 1)
        or increase(compra_facil_identity_logins_total{result=~"invalid_credentials|locked_out"}[10m])
      ) >= 30, "sinal", "senhas erradas", "", "")
      or
      label_replace(sum(
        ((compra_facil_identity_logins_total{result="locked_out"} unless compra_facil_identity_logins_total{result="locked_out"} offset 10m) * 1)
        or increase(compra_facil_identity_logins_total{result="locked_out"}[10m])
      ) >= 3, "sinal", "contas bloqueadas", "", "")
      or
      label_replace(sum(
        increase(traefik_router_requests_total{router=~"identity-credentials(-bff)?@file", code="429"}[10m])
      ) >= 20, "sinal", "429 do rate limit", "", "")
    resumo: "Login em massa: {{ $values.A }} ({{ $labels.sinal }}) em 10 minutos"
    descricao: >-
      O login recebeu tentativas demais ({{ $labels.sinal }}): robô testando senhas vazadas (credential
      stuffing) ou forçando uma conta. O bloqueio (5 erros, 15 minutos) e o rate limit do gateway já
      seguram; ver de onde vem nos logs do contêiner gateway, no Coolify (as requisições a
      /identity/v1/sessions, com o IP no X-Forwarded-For), e, se for de poucos IPs, bloqueá-los na
      Cloudflare. A métrica não diz quais contas (sem e-mail nas labels): no banco do identity, as com
      lockout_end no futuro são as bloqueadas, e vale avisar os donos para trocarem a senha.
