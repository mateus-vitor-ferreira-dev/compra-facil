openapi: 3.1.0
info:
  title: CompraFácil — Identity API
  version: 1.0.0
  summary: Contas, login e os tokens que as outras APIs aceitam.
  description: |
    API do serviço **identity** (ASP.NET Core Identity).

    - **Cadastro** (`registerAccount`) cria uma conta de cliente (papel `customer`) e manda o e-mail de
      confirmação (pelo notifications). Com a confirmação exigida (`Identity:EmailConfirmation:Required`),
      o login só funciona depois de `confirmEmail`.
    - **Login** (`createSession`) devolve um **access token** (JWT RS256, 15 min) e um **refresh token**
      (opaco, 30 dias). Cinco senhas erradas seguidas bloqueiam a conta por 15 minutos (`423`).
    - **Refresh** (`refreshSession`) troca o refresh token por um par novo; o antigo deixa de valer.
      Apresentar de novo um refresh token já trocado derruba a sessão inteira (sinal de token copiado),
      menos nos 10 s seguintes à troca (intervalo de reuso), quando ele ainda dá um par novo da mesma
      sessão: são requisições paralelas do mesmo navegador.
    - **Logout** (`revokeSession`) derruba a sessão do refresh token.
    - **Google** (`createGoogleSession`, `linkGoogleSession`): login e cadastro com o ID token do Google;
      a conta é a do `sub` do Google, e um e-mail que já tem conta com senha só é vinculado com a senha.
    - **Esqueci minha senha** (`requestPasswordReset`, `resetPassword`): o link vai por e-mail (pelo
      notifications), vale 1 hora e uma vez só; trocar a senha derruba todas as sessões da conta. A
      autenticação em duas etapas continua ativa depois da troca.
    - **Segundo fator** (TOTP, obrigatório para o papel `admin`): a senha (ou o Google) de uma conta com 2FA
      responde `202` com um `mfa_ticket` (5 min, uso único), nunca tokens; a sessão sai de `verifySessionMfa`,
      com o código do app autenticador ou um código de recuperação. O operador que ainda não tem 2FA recebe
      um tíquete de cadastro (`mfa_setup_required`, 15 min): `startMfaSetup` dá a chave e o QR code,
      `confirmMfaSetup` liga a 2FA com o primeiro código e devolve a sessão e 10 códigos de recuperação,
      mostrados só uma vez. Código errado conta como senha errada (o quinto bloqueia a conta, `423`). O
      papel `auditor` (robô só de leitura) entra só com a senha.

    O access token vai em `Authorization: Bearer <token>` nas outras APIs, que o validam sozinhas com as
    chaves públicas de `/.well-known/jwks.json` (cache de 5 min). Claims: `sub` (id da conta), `email`,
    `name`, `roles` (`customer`, `admin`, `auditor`), `iss` = `compra-facil-identity`, `aud` = `compra-facil`,
    `exp` e, só na sessão que passou pelo segundo fator, `amr` = `["mfa"]` (RFC 8176). As rotas de operador
    dos serviços exigem `amr` com `mfa` junto do papel `admin`; o refresh repete o `amr` só na sessão que
    nasceu do segundo fator.

    A chave de assinatura muda a cada 30 dias; a próxima aparece no JWKS um dia antes de assinar, e a
    anterior fica até o último token dela vencer. O `kid` do header do JWT diz qual chave usar.

    No navegador, o refresh token não deve ficar acessível ao JavaScript: o BFF do front o guarda em
    cookie `HttpOnly`. Refresh paralelos com o mesmo token (instâncias diferentes do BFF) cabem no
    intervalo de reuso e mantêm a sessão.
servers:
  - url: http://localhost:8006
    description: Serviço direto (dev)
  - url: http://localhost/identity
    description: Via gateway Traefik
tags:
  - name: accounts
    description: Cadastro e dados da conta.
  - name: sessions
    description: Login, refresh e logout.
  - name: keys
    description: Chaves públicas para validar os tokens.

paths:
  /v1/accounts:
    post:
      tags: [accounts]
      operationId: registerAccount
      summary: Cadastra um cliente
      description: |
        Cria a conta com o papel `customer`. Não faz login: em seguida, chame `createSession`.
        Senha: de 8 a 128 caracteres, com pelo menos 4 diferentes. Sem regras de composição (NIST SP 800-63B).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Conta criada.
          headers:
            Location:
              $ref: "./common/v1/common.yaml#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "409":
          $ref: "./common/v1/common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/accounts/confirm-email:
    post:
      tags: [accounts]
      operationId: confirmEmail
      summary: Confirma o e-mail pelo link
      description: |
        O link do e-mail leva para a página do front com `conta` e `token` na query; o front os manda aqui.
        Conta já confirmada: `204` também (o link pode ser aberto duas vezes). Conta inexistente, token
        errado ou vencido (1 dia): o mesmo `422`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, token]
              properties:
                account_id:
                  type: string
                  format: uuid
                token:
                  type: string
                  maxLength: 2048
      responses:
        "204":
          description: E-mail confirmado.
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/accounts/confirm-email/resend:
    post:
      tags: [accounts]
      operationId: resendEmailConfirmation
      summary: Manda outro link de confirmação
      description: |
        Sempre `202`, exista a conta ou não, já confirmada ou não: a resposta não revela quem tem conta.
        O link anterior continua valendo até vencer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
      responses:
        "202":
          description: Se a conta existe e não está confirmada, o e-mail sai em instantes.
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/accounts/password-reset:
    post:
      tags: [accounts]
      operationId: requestPasswordReset
      summary: Pede o link para criar uma senha nova
      description: |
        Sempre `202`, exista a conta ou não: a resposta não revela quem tem conta. Se o e-mail é de uma
        conta (com ou sem senha: quem só entrou pelo Google também pode criar uma), o link sai por e-mail
        e vale 1 hora. Compras sem conta não têm senha e não recebem nada. Cada pedido gera outro link; os
        anteriores continuam valendo até vencer ou até a senha ser trocada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
      responses:
        "202":
          description: Se a conta existe, o e-mail sai em instantes.
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/accounts/password-reset/confirm:
    post:
      tags: [accounts]
      operationId: resetPassword
      summary: Cria a senha nova pelo link
      description: |
        O link do e-mail leva para a página do front com `conta` e `token` na query; o front os manda aqui
        com a senha nova (mesmas regras do cadastro). Troca a senha, confirma o e-mail (o link prova que
        a pessoa o lê), desbloqueia a conta e revoga todos os refresh tokens: as sessões abertas caem.
        O token vale uma vez só. Conta inexistente, token errado, já usado ou vencido: o mesmo `422` em
        `token`; senha fora das regras: `422` em `password`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Senha trocada. O front leva o cliente ao login.
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/me:
    get:
      tags: [accounts]
      operationId: getMe
      summary: A conta dona do access token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common/v1/common.yaml#/components/responses/NotFound"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/me/two-factor/recovery-codes:
    post:
      tags: [accounts]
      operationId: regenerateRecoveryCodes
      summary: Gera códigos de recuperação novos
      description: |
        Para a conta com 2FA ativa, numa sessão que passou pelo segundo fator (`amr` com `mfa`; sem ele,
        `403`), com um código atual do app autenticador. Os 10 códigos novos aparecem só nesta resposta e os
        anteriores deixam de valer. Código errado dá `422` e conta como senha errada.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryCodesRequest"
      responses:
        "200":
          description: Os códigos novos.
          headers:
            Cache-Control:
              description: "`no-store`: resposta com credencial não vai para cache."
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          description: A sessão não passou pelo segundo fator.
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "409":
          description: A conta não tem a 2FA ativa.
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "423":
          description: Conta bloqueada temporariamente por tentativas erradas.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Login com e-mail e senha
      description: |
        E-mail inexistente e senha errada dão o mesmo `401` (e o hash de senha roda nos dois casos). Na
        quinta senha errada seguida, a conta fica bloqueada para login por 15 minutos (`423`, com
        `Retry-After`); sessões já abertas continuam valendo. Como o cadastro (`409`), o `423` revela que
        a conta existe: o rate limit do gateway é o que limita quem tenta descobrir.

        Conta com 2FA, ou com o papel `admin`, responde `202` com o tíquete do segundo fator, nunca tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "202":
          $ref: "#/components/responses/MfaChallenge"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          description: Senha certa, mas o e-mail ainda não foi confirmado (só com a confirmação exigida).
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "423":
          description: Conta bloqueada temporariamente por senhas erradas.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/sessions/guest:
    post:
      tags: [sessions]
      operationId: createGuestSession
      summary: Compra sem conta
      description: |
        Cria uma conta própria para esta compra, sem senha e com o papel `customer`, e abre a sessão. A
        mesma `checkout_key` com o mesmo e-mail devolve a mesma conta nos 30 minutos depois de a compra
        começar: o reenvio do formulário não duplica o pedido. Depois, dá `409`, e a compra se abre só pelo
        link enviado ao e-mail. O e-mail digitado não é verificado e não dá acesso a nada que já exista com ele.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestSessionRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "409":
          description: |
            A mesma `checkout_key` já foi usada com outro e-mail, chegou ao mesmo tempo que outra, ou começou
            a compra há mais de 30 minutos (o acesso a ela é pelo link do e-mail).
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/sessions/guest/access:
    post:
      tags: [sessions]
      operationId: accessGuestSession
      summary: Abre a sessão pelo link enviado por e-mail
      description: O link continua valendo até vencer. Link desconhecido e vencido dão o mesmo `401`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestAccessRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/sessions/guest/access/resend:
    post:
      tags: [sessions]
      operationId: resendGuestAccess
      summary: Manda de novo o link das compras sem conta
      description: Sempre `202`, com compra ou sem compra naquele e-mail. O mesmo link não é reenviado em intervalos curtos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestAccessResendRequest"
      responses:
        "202":
          description: Aceito.
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/sessions/google:
    post:
      tags: [sessions]
      operationId: createGoogleSession
      summary: Login (ou cadastro) com a conta Google
      description: |
        Recebe o ID token que o BFF obteve do Google (authorization code com PKCE) e o `nonce` que ele
        gerou para este login. O identity valida a assinatura pelo JWKS do Google, o emissor, o `aud`
        (o client id da loja), a validade, o `nonce` e `email_verified`.

        A conta é achada pelo `sub` do Google, não pelo e-mail: trocar o e-mail no Google não muda a
        conta. Sem conta, cria uma já confirmada (sem senha), com o papel `customer`. Se o e-mail já tem
        conta com senha, responde `409` (título "Conta já existe"): o vínculo é por `linkGoogleSession`,
        com a senha, para que um Google com o mesmo e-mail não entre na conta de outra pessoa.

        O Google é só o primeiro fator: conta com 2FA, ou com o papel `admin`, recebe `202` com o tíquete,
        como no login com senha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSessionRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "202":
          $ref: "#/components/responses/MfaChallenge"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "409":
          description: O e-mail já tem conta com senha; vincule com `linkGoogleSession`.
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/sessions/google/link:
    post:
      tags: [sessions]
      operationId: linkGoogleSession
      summary: Vincula o Google à conta do mesmo e-mail, com a senha dela
      description: |
        Valida o ID token como `createGoogleSession`, confere a senha da conta do mesmo e-mail (com o
        bloqueio por tentativas do login) e liga o `sub` do Google a ela. Daí em diante, o Google sozinho
        entra nela (menos na conta com 2FA ou de operador, que recebe `202` com o tíquete do segundo fator).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLinkRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "202":
          $ref: "#/components/responses/MfaChallenge"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "423":
          description: Conta bloqueada temporariamente por senhas erradas.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/sessions/mfa:
    post:
      tags: [sessions]
      operationId: verifySessionMfa
      summary: Segundo passo do login (código do autenticador ou de recuperação)
      description: |
        Recebe o `mfa_ticket` do `202` do login e **um** dos dois: `code`, os 6 dígitos do app autenticador
        (o passo de 30 s atual, o anterior ou o seguinte; um código já usado não vale de novo), ou
        `recovery_code`, um dos códigos de recuperação (cada um vale uma vez). O código certo gasta o tíquete
        e abre a sessão, com `amr` = `["mfa"]` no access token.

        Tíquete desconhecido, vencido, já usado ou de antes de uma troca de senha dá `401`: volte ao login.
        Código errado dá `422` e conta como senha errada; o quinto erro seguido bloqueia a conta (`423`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "423":
          description: Conta bloqueada temporariamente por códigos (ou senhas) errados.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/sessions/mfa/setup:
    post:
      tags: [sessions]
      operationId: startMfaSetup
      summary: Chave e QR code para cadastrar o app autenticador
      description: |
        Com o tíquete `mfa_setup_required` do login do operador sem 2FA. Cada chamada gera uma chave nova
        (a anterior deixa de servir); ela só passa a valer com o primeiro código certo em `confirmMfaSetup`.
        O tíquete não é gasto aqui.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaTicketRequest"
      responses:
        "200":
          description: A chave e o URI do QR code.
          headers:
            Cache-Control:
              description: "`no-store`: resposta com segredo não vai para cache."
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetup"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "423":
          description: Conta bloqueada temporariamente por tentativas erradas.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/sessions/mfa/setup/confirm:
    post:
      tags: [sessions]
      operationId: confirmMfaSetup
      summary: Liga a 2FA com o primeiro código e abre a sessão
      description: |
        O primeiro código certo do app liga a 2FA, gasta o tíquete e devolve a sessão (com `amr`) e 10
        códigos de recuperação de uso único. Os códigos aparecem só nesta resposta: o identity guarda só o
        hash deles. Código errado dá `422` e conta como senha errada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaConfirmRequest"
      responses:
        "200":
          description: 2FA ativa; a sessão e os códigos de recuperação.
          headers:
            Cache-Control:
              description: "`no-store`: resposta com credencial não vai para cache."
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnabled"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "423":
          description: Conta bloqueada temporariamente por tentativas erradas.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/sessions/refresh:
    post:
      tags: [sessions]
      operationId: refreshSession
      summary: Troca o refresh token por um par novo
      description: |
        O refresh token enviado deixa de valer; guarde o novo. Token inválido, expirado, revogado ou já
        trocado dá `401`. Um token já trocado, apresentado de novo, derruba a sessão inteira, a não ser
        dentro do intervalo de reuso (`Identity:Tokens:RefreshReuseInterval`, 10 s): logo depois da troca,
        ele ainda dá um par novo da mesma sessão (dois refresh simultâneos com o mesmo token passam). A
        próxima troca normal invalida os pares que sobraram.

        A sessão aberta sem o segundo fator de uma conta que agora o exige (2FA ligada depois, ou a conta
        virou operador) não renova: `401`, e a pessoa entra de novo com o código.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/sessions/revoke:
    post:
      tags: [sessions]
      operationId: revokeSession
      summary: Logout
      description: |
        Revoga o refresh token e todos os trocados a partir do mesmo login. Idempotente: token
        desconhecido ou já revogado também dá `204`. O access token já emitido vale até expirar (15 min).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Sessão encerrada.
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /.well-known/jwks.json:
    get:
      tags: [keys]
      operationId: getJwks
      summary: Chaves públicas de assinatura (JWKS, RFC 7517)
      description: A anterior (até os tokens dela vencerem), a atual e a próxima (um dia antes de assinar).
      responses:
        "200":
          description: Chaves.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /.well-known/openid-configuration:
    get:
      tags: [keys]
      operationId: getOpenIdConfiguration
      summary: Descoberta do emissor (subconjunto do OpenID Connect Discovery)
      description: Só o que a validação de JWT usa. Bibliotecas como o JwtBearer do .NET acham o JWKS por aqui.
      responses:
        "200":
          description: Emissor e endereço do JWKS.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenIdConfiguration"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

components:
  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
      examples: ["ana@exemplo.com"]

    PersonName:
      type: string
      minLength: 1
      maxLength: 120
      # o pattern só barra o grosso; a regra inteira (letras, espaço, apóstrofo, hífen e ponto) é do servidor
      pattern: "^[^0-9/:@<>]+$"
      description: |
        Nome de quem compra; vai na saudação dos e-mails da loja. Só letras (com acento), espaços,
        apóstrofo, hífen e ponto. Nada de link, e-mail ou domínio: `://`, `www.`, `@`, `/`, `:` e
        palavras como `exemplo.com` dão 422 ("use só letras, espaços, apóstrofo, hífen e ponto").
        Espaços nas pontas saem e os repetidos viram um só.
      examples: ["Ana Souza", "João d'Ávila", "Maria-Clara", "J. R. Silva"]

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        name:
          $ref: "#/components/schemas/PersonName"

    ResetPasswordRequest:
      type: object
      required: [account_id, token, password]
      properties:
        account_id:
          type: string
          format: uuid
        token:
          type: string
          maxLength: 2048
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true

    GoogleSessionRequest:
      type: object
      required: [id_token, nonce]
      additionalProperties: false
      properties:
        id_token:
          type: string
          maxLength: 4096
          description: O ID token (JWT) que o Google devolveu ao BFF.
        nonce:
          type: string
          maxLength: 128
          description: O nonce que o BFF gerou para este login (vem dentro do ID token).

    GoogleLinkRequest:
      type: object
      required: [id_token, nonce, password]
      additionalProperties: false
      properties:
        id_token:
          type: string
          maxLength: 4096
        nonce:
          type: string
          maxLength: 128
        password:
          type: string
          maxLength: 128

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          maxLength: 128
          writeOnly: true

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          maxLength: 128

    Role:
      type: string
      description: "`customer`: compra · `admin`: rotas `/v1/admin/*` e painel administrativo (com 2FA) · `auditor`: leitura da operação (robô)."
      enum: [customer, admin, auditor]

    Account:
      type: object
      required: [id, email, name, email_confirmed, roles, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: O mesmo valor do claim `sub` do access token.
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
        email_confirmed:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
        is_guest:
          type: boolean
          description: Comprou sem conta; o acesso é pelo link enviado por e-mail, sem senha.
        two_factor_enabled:
          type: boolean
          description: A autenticação em duas etapas (app autenticador) está ativa.
        recovery_codes_left:
          type: ["integer", "null"]
          description: Quantos códigos de recuperação ainda valem; nulo sem 2FA.

    GuestSessionRequest:
      type: object
      required: [email, name, checkout_key]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        name:
          $ref: "#/components/schemas/PersonName"
        checkout_key:
          type: string
          format: uuid
          description: Nasce com o formulário do checkout e é a mesma em cada reenvio dele.

    GuestAccessRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 128

    GuestAccessResendRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"

    Tokens:
      type: object
      description: Resposta no formato do OAuth 2.0 (RFC 6749, seção 5.1).
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_in]
      properties:
        access_token:
          type: string
          description: "JWT RS256; vai em `Authorization: Bearer` nas outras APIs."
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Segundos até o access token vencer.
          examples: [900]
        refresh_token:
          type: string
          description: Opaco. Use uma vez em `refreshSession`; a resposta traz o próximo.
        refresh_expires_in:
          type: integer
          description: Segundos até o refresh token vencer, se não for usado antes.
          examples: [2592000]

    MfaChallenge:
      type: object
      description: A senha (ou o Google) conferiu; a sessão depende do segundo fator.
      required: [status, mfa_ticket, expires_in]
      properties:
        status:
          type: string
          enum: [mfa_required, mfa_setup_required]
          description: |
            `mfa_required`: mande o código em `verifySessionMfa`. `mfa_setup_required`: operador sem 2FA;
            cadastre o app autenticador (`startMfaSetup`, `confirmMfaSetup`).
        mfa_ticket:
          type: string
          description: Opaco, de uso único. Não é token de API nem refresh token.
        expires_in:
          type: integer
          description: Segundos até o tíquete vencer.
          examples: [300]

    MfaTicketRequest:
      type: object
      required: [ticket]
      properties:
        ticket:
          type: string
          maxLength: 128

    MfaVerifyRequest:
      type: object
      required: [ticket]
      description: "`ticket` e um dos dois: `code` ou `recovery_code`."
      properties:
        ticket:
          type: string
          maxLength: 128
        code:
          type: string
          maxLength: 16
          description: Os 6 dígitos do app autenticador.
          examples: ["123456"]
        recovery_code:
          type: string
          maxLength: 32
          examples: ["k7m2p-9xq4r"]

    MfaConfirmRequest:
      type: object
      required: [ticket, code]
      properties:
        ticket:
          type: string
          maxLength: 128
        code:
          type: string
          maxLength: 16

    MfaSetup:
      type: object
      required: [shared_key, authenticator_uri]
      properties:
        shared_key:
          type: string
          description: A chave em Base32, em grupos de 4, para digitar no app sem o QR code.
        authenticator_uri:
          type: string
          description: "O conteúdo do QR code: `otpauth://totp/Embrulhado:<e-mail>?secret=...&issuer=Embrulhado`."

    MfaEnabled:
      allOf:
        - $ref: "#/components/schemas/Tokens"
        - type: object
          required: [recovery_codes]
          properties:
            recovery_codes:
              $ref: "#/components/schemas/RecoveryCodeList"

    RecoveryCodesRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16

    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          $ref: "#/components/schemas/RecoveryCodeList"

    RecoveryCodeList:
      type: array
      description: Códigos de uso único; aparecem só uma vez (o identity guarda só o hash).
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: "^[0-9a-z]{5}-[0-9a-z]{5}$"

    Jwk:
      type: object
      required: [kty, use, alg, kid, n, e]
      properties:
        kty:
          type: string
          const: RSA
        use:
          type: string
          const: sig
        alg:
          type: string
          const: RS256
        kid:
          type: string
          description: Igual ao `kid` do header dos tokens assinados com esta chave.
        n:
          type: string
          description: Módulo, em base64url.
        e:
          type: string
          description: Expoente, em base64url.

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Jwk"

    OpenIdConfiguration:
      type: object
      required: [issuer, jwks_uri, id_token_signing_alg_values_supported]
      properties:
        issuer:
          type: string
          examples: ["compra-facil-identity"]
        jwks_uri:
          type: string
          format: uri
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
            enum: [RS256]

  headers:
    RetryAfter:
      description: Segundos até poder tentar de novo.
      schema:
        type: integer
    CacheControl:
      description: As chaves podem ficar em cache por 5 minutos.
      schema:
        type: string
        examples: ["public, max-age=300"]

  responses:
    Tokens:
      description: Access token e refresh token.
      headers:
        Cache-Control:
          description: "`no-store`: resposta com credencial não vai para cache."
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Tokens"

    MfaChallenge:
      description: Falta o segundo fator; nenhum token.
      headers:
        Cache-Control:
          description: "`no-store`: resposta com credencial não vai para cache."
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MfaChallenge"

  securitySchemes:
    bearerAuth:
      $ref: "./common/v1/common.yaml#/components/securitySchemes/bearerAuth"
