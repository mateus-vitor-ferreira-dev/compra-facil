openapi: 3.1.0
info:
  title: CompraFácil — Fulfillment API
  version: 1.0.0
  summary: Webhook do fornecedor e operação.
  description: |
    API do serviço **fulfillment** (time de Processamento de compras, ASP.NET Core). Dono da integração
    com o fornecedor de dropshipping (ADR 0007).

    O pedido **não** vai ao fornecedor por HTTP desta API: o fulfillment consome `OrderConfirmed`, envia
    o pedido ao fornecedor e publica o que acontece (`SupplierOrderPlaced`, `SupplierOrderShipped`,
    `SupplierOrderDelivered`, `SupplierOrderFailed`). Esta API recebe as atualizações do fornecedor
    (webhook) e serve à operação.
servers:
  - url: http://localhost:8007
    description: Serviço direto (dev)
  - url: http://localhost/fulfillment
    description: Via gateway Traefik
tags:
  - name: webhooks
    description: Chamadas do fornecedor.
  - name: internal
    description: Chamadas entre serviços, fora do gateway.
  - name: admin
    description: "Operação (role `admin`): pedidos parados no fornecedor; dead letter topic em todos os serviços."
  - name: me
    description: O que o cliente logado vê das notas dos pedidos dele.
  - name: shipping
    description: Frete e prazo por CEP (#222).

paths:
  /v1/webhooks/supplier:
    post:
      tags: [webhooks]
      operationId: receiveSupplierWebhook
      summary: Atualização de um pedido no fornecedor
      description: |
        O fornecedor avisa cada mudança de status de um pedido (aceito, enviado com o rastreio, entregue,
        cancelado). A assinatura é um HMAC-SHA256 do corpo com o segredo combinado, no cabeçalho
        `X-Sim-Signature` (`sha256=<hex>`; o nome do cabeçalho é configurável por fornecedor).

        Idempotente por `messageId`: a mesma mensagem de novo responde 200 sem repetir o efeito. Uma
        atualização atrasada não faz o pedido voltar (entregue não volta a enviado). Pedido desconhecido
        também responde 200, para o fornecedor não insistir; fica no log.
      parameters:
        - name: X-Sim-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^sha256=[0-9a-f]{64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierWebhook"
      responses:
        "200":
          description: Recebida (aplicada, repetida, ignorada ou de pedido desconhecido).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierWebhookAck"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
  /v1/internal/supplier-stock/check:
    post:
      tags: [internal]
      operationId: checkSupplierStock
      summary: Confere no fornecedor, agora, a disponibilidade das variantes de um pedido
      description: |
        Usada pelo inventory antes de reservar e cobrar um pedido com produtos de fornecedor (#218). A
        leitura também atualiza o espelho (`SupplierStockChanged`). **Interna**: o gateway não a expõe, só
        a rede dos serviços chega nela.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [vid, quantity]
                    properties:
                      vid:
                        type: string
                        minLength: 1
                      quantity:
                        type: integer
                        minimum: 1
      responses:
        "200":
          description: A disponibilidade de cada variante.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [vid, available, known]
                      properties:
                        vid:
                          type: string
                        available:
                          type: integer
                          minimum: 0
                        known:
                          type: boolean
                          description: Falso se a variante não está no feed do fornecedor.
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
        "503":
          description: O fornecedor não respondeu; o inventory decide pelo espelho.
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"

  /v1/me/invoices/{order_id}/danfe:
    get:
      tags: [me]
      operationId: getInvoiceDanfe
      summary: O DANFE da nota do pedido, em PDF
      description: |
        A nota fiscal do pedido (#221) para o cliente baixar, como o emissor a gera. Só o dono do pedido (o
        `sub` do token) ou a equipe (role `admin`); a nota de outro cliente, a pendente e a rejeitada dão
        404. A nota cancelada continua baixável (o DANFE dela mostra o cancelamento no emissor de verdade).
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: O DANFE.
          headers:
            Content-Disposition:
              description: '`attachment; filename=nfe-<número>.pdf`.'
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common/v1/common.yaml#/components/responses/NotFound"
        "503":
          description: O emissor da nota não respondeu; vem com `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"


  /v1/me/invoices/{order_id}/return-danfe:
    get:
      tags: [me]
      operationId: getReturnInvoiceDanfe
      summary: O DANFE da nota de devolução do pedido, em PDF
      description: |
        A NF-e de devolução (#223), quando o cliente desiste da compra. Só o dono do pedido (o `sub` do token) ou
        a equipe (role `admin`); a nota de outro cliente, e a que ainda não saiu, dão 404.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: O DANFE.
          headers:
            Content-Disposition:
              description: '`attachment; filename=nfe-<número>.pdf`.'
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common/v1/common.yaml#/components/responses/NotFound"
        "503":
          description: O emissor da nota não respondeu; vem com `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
  /v1/shipping/quote:
    post:
      tags: [shipping]
      operationId: quoteShipping
      summary: Frete e prazo por CEP
      description: |
        As opções de envio para o CEP (#222, Decreto 7.962: o cliente vê frete e prazo antes de pagar), da
        mais barata para a mais cara. O fornecedor cota em dólar; a loja converte pelo câmbio do catálogo
        (`Shipping:UsdToBrl`) e soma o processamento dela (`Shipping:ProcessingDays`) ao prazo, em dias
        úteis. Pública: a página do produto e o carrinho cotam sem login. O orders confere por aqui o frete
        do pedido.

        **Frete grátis (#323).** A loja nunca sai no prejuízo: uma opção sai de graça (`price_cents` 0, com o preço
        normal em `regular_price_cents`) quando a margem dos produtos paga o frete inteiro. A margem é o preço da
        loja, buscado no catalog pelo `product_id` (nunca o do navegador), menos o custo no fornecedor e a taxa de
        pagamento do pior caso (`Shipping:WorstPaymentFeePercent`, o cartão em 6x). Sem o `product_id` em todos os
        itens, com produto sem custo conhecido ou com o catalog fora do ar, não há frete grátis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingQuoteRequest"
      responses:
        "200":
          description: As opções de envio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingQuote"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "429":
          $ref: "./common/v1/common.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
        "503":
          description: O fornecedor não cotou; vem com `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"

  /v1/admin/supplier/status:
    get:
      tags: [admin]
      operationId: getSupplierStatus
      summary: Como está a integração com o fornecedor
      description: |
        Pergunta ao fornecedor agora, com até 3 s de espera, e conta o que a loja sabe dele. As credenciais ficam
        nos segredos do ambiente e nunca saem daqui: `own_credentials` só diz se não são as do simulador.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: O status. Fornecedor fora do ar também é 200, com `reachable` falso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierStatus"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/admin/order-margins:
    get:
      tags: [admin]
      operationId: listOrderMargins
      summary: A margem real dos pedidos mais recentes, de um período e com a soma dele
      description: |
        O que o cliente pagou, menos o custo dos produtos no câmbio da compra, o frete repassado ao fornecedor e a
        taxa do pagamento. Em centavos de real. A margem é nula no pedido estornado, e se faltar um dos valores
        (produto que não veio do fornecedor, ou pedido de antes desta conta).

        Com `from` e `to`, ficam só os pedidos criados em [from, to) (#282). A soma (`totals`) cobre todos os
        pedidos do período, sem o `limit` da lista; sem período, todos os pedidos.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: from
          in: query
          description: Início do período, incluído.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Fim do período, excluído. Depois de `from`.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Pedidos, dos mais recentes aos mais antigos, e a soma do período.
          content:
            application/json:
              schema:
                type: object
                required: [data, totals]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderMargin"
                  totals:
                    $ref: "#/components/schemas/OrderMarginTotals"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/admin/supplier-orders/failed:
    get:
      tags: [admin]
      operationId: listFailedSupplierOrders
      summary: Pedidos que não chegaram ao fornecedor
      description: |
        Os recusados, cancelados ou sem resposta do fornecedor, e os de nota rejeitada, dos últimos 30 dias, os
        mais recentes primeiro. O cliente já foi estornado: não há reenvio, porque o pedido sairia sem pagamento.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Pedidos que falharam.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FailedSupplierOrder"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/admin/supplier-orders/{order_id}/retry:
    post:
      tags: [admin]
      operationId: retrySupplierOrder
      summary: Tenta agora o pedido que espera a próxima tentativa
      description: Só o pedido na fila depois de um erro passageiro; o resto dá 409.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Volta para a fila agora.
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common/v1/common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common/v1/common.yaml#/components/responses/Conflict"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/admin/supplier-orders/to-place:
    get:
      tags: [admin]
      operationId: listSupplierOrdersToPlace
      summary: A fila "Pedidos a fazer" do fornecedor manual
      description: |
        Os pedidos pagos esperando a equipe fazer no fornecedor (`awaiting_staff`, #412), os mais antigos primeiro,
        com o custo esperado. Também para o papel `auditor` (o Balcão do agentes-hub), mas sem `customer_email` e
        `ship_to`, que só o operador vê: é com eles que a equipe preenche o pedido no fornecedor.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A fila.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SupplierOrderToPlace"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
  /v1/admin/supplier-orders/manual:
    get:
      tags: [admin]
      operationId: listManualSupplierOrders
      summary: Os pedidos do fornecedor manual em andamento
      description: |
        Depois da fila "Pedidos a fazer": `placed`, os feitos no fornecedor esperando o rastreio, e `shipped`, os
        em transporte esperando a entrega, os mais antigos primeiro (#412). Como a fila, também para o `auditor`,
        sem `customer_email` e `ship_to`.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [placed, shipped]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Os pedidos da etapa.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SupplierOrderToPlace"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
  /v1/admin/supplier-orders/{order_id}/placed:
    post:
      tags: [admin]
      operationId: markSupplierOrderPlaced
      summary: A equipe fez o pedido no fornecedor manual
      description: |
        Da fila `awaiting_staff` para `placed`, com o número do pedido no fornecedor e, se a equipe informar, o que
        pagou pelos produtos e pelo frete (a margem passa a usar esses valores). Sai o `SupplierOrderPlaced`, como
        na API de um fornecedor. Fora da fila, 409. Só o papel `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacedRequest"
      responses:
        "204":
          description: Feito.
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common/v1/common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common/v1/common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
  /v1/admin/supplier-orders/{order_id}/out-of-stock:
    post:
      tags: [admin]
      operationId: markSupplierOrderOutOfStock
      summary: O fornecedor manual não tinha o produto
      description: |
        O pedido da fila falha com `out_of_stock` (`SupplierOrderFailed`): o orders cancela e o payments estorna. O
        corpo é opcional, com o detalhe para o painel. Fora da fila, 409. Só o papel `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutOfStockRequest"
      responses:
        "204":
          description: Feito.
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common/v1/common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common/v1/common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
  /v1/admin/supplier-orders/{order_id}/tracking:
    post:
      tags: [admin]
      operationId: markSupplierOrderShipped
      summary: O rastreio do pedido no fornecedor manual
      description: |
        De `placed` para `shipped`, com o código, a transportadora e o link: sai o `SupplierOrderShipped`, e o
        cliente recebe o rastreio. Antes de o pedido ser feito no fornecedor, ou depois de despachado, 409. Só o papel `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingRequest"
      responses:
        "204":
          description: Feito.
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common/v1/common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common/v1/common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
  /v1/admin/supplier-orders/{order_id}/delivered:
    post:
      tags: [admin]
      operationId: markSupplierOrderDelivered
      summary: O pedido do fornecedor manual foi entregue
      description: |
        De `shipped` para `delivered` (`SupplierOrderDelivered`), quando o rastreio mostra a entrega. Fora do
        transporte, 409. Só o papel `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Feito.
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common/v1/common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common/v1/common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
  /v1/admin/supplier-orders/{order_id}/cancel:
    post:
      tags: [admin]
      operationId: cancelSupplierOrder
      summary: Cancela o pedido que não foi despachado e estorna o cliente
      description: |
        Cancela no fornecedor, se ele já tem o pedido, e publica `SupplierOrderFailed` com `store_cancelled`: o
        orders cancela e o payments estorna. Despachado ou sendo enviado agora dá 409. Fornecedor fora do ar dá
        503, e nada muda. Repetir é seguro. No fornecedor manual (#412), um pedido já feito pela equipe só cancela
        com `cancelled_at_supplier: true`, a confirmação de que ela cancelou no site do fornecedor; sem isso, 409.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cancelled_at_supplier:
                  type: boolean
                  description: Fornecedor manual - a equipe já cancelou o pedido no fornecedor.
      responses:
        "204":
          description: Cancelado.
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common/v1/common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common/v1/common.yaml#/components/responses/Conflict"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
        "503":
          description: O fornecedor não respondeu, e nada mudou; vem com `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"

  /v1/admin/supplier-returns/{order_id}/customer-instruction:
    post:
      tags: [admin]
      operationId: instructSupplierReturnCustomer
      summary: Diz ao cliente o que fazer quando o fornecedor recusou a devolução na abertura
      description: |
        O fornecedor recusou a devolução já ao abri-la, e o cliente ficou sem o código e o endereço dele (#281).
        A loja é a responsável pela devolução (CDC, art. 49) e registra o que combinou: `keep`, o cliente fica
        com o produto; `send`, o cliente manda para o endereço da loja, com o código dela. Sai
        `CustomerReturnInstructed`, e o notifications avisa o cliente.

        Vale uma vez por devolução. Repetir a mesma instrução dá 204 sem novo aviso; outra instrução, ou uma
        devolução que não foi recusada na abertura, dá 409.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInstructionRequest"
      responses:
        "204":
          description: Registrada; o cliente é avisado.
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common/v1/common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common/v1/common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/admin/supplier-returns:
    get:
      tags: [admin]
      operationId: listSupplierReturns
      summary: Devoluções ao fornecedor que pedem atenção
      description: |
        As devoluções que o cliente pediu ao desistir da compra (#223) e o fornecedor ainda não resolveu. Primeiro
        as recusadas na abertura que esperam a instrução ao cliente (`awaiting_customer_instruction`, #281),
        depois as paradas além do prazo (`Supplier:Deadlines:ReturnWithin`, padrão 15 dias, contado do pedido).
        As que o fornecedor recusou ficam por 30 dias, e a que espera a instrução fica até ela. A nota de
        devolução rejeitada vem em `invoice_error`.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Devoluções.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SupplierReturn"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/admin/supplier-orders/overdue:
    get:
      tags: [admin]
      operationId: listOverdueSupplierOrders
      summary: Pedidos parados além do prazo do fornecedor
      description: |
        Os pedidos pagos que o fornecedor não despachou dentro do prazo de separação
        (`Supplier:Deadlines:ShipWithin`, padrão 3 dias, contado do pedido pago) e os enviados que não
        chegaram dentro do prazo de transporte (`Supplier:Deadlines:DeliverWithin`, padrão 15 dias,
        contado do envio). Os mais atrasados primeiro. Para a equipe cobrar o fornecedor e avisar o
        cliente: a loja responde pelo prazo que prometeu.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Pedidos atrasados.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OverdueSupplierOrder"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
  /v1/admin/supplier-catalog/sync:
    post:
      tags: [admin]
      operationId: syncSupplierCatalog
      summary: Lê o feed do fornecedor agora
      description: |
        A mesma leitura que o fulfillment faz de tempos em tempos (`Supplier:CatalogSyncInterval`): o que
        mudou desde a anterior vira `SupplierProductUpdated` ou `SupplierProductRemoved`, e o catalog
        atualiza a loja. Feed vazio ou com erro não tira nada de venda (503).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: O que a leitura encontrou.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSyncResult"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "409":
          description: Outra leitura do feed está rodando (o job ou outro operador).
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
        "503":
          description: O fornecedor não respondeu, ou devolveu o feed vazio; nada mudou.
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
  /v1/admin/supplier-catalog/sheet:
    get:
      tags: [admin]
      operationId: getSupplierSheet
      summary: A planilha do fornecedor manual
      description: Se o modo manual (`Supplier:Mode=manual`, #412) está ligado, quantos produtos a última planilha tem e quando foi subida. Também para o papel `auditor`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: O resumo da planilha.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualSheetSummary"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
    post:
      tags: [admin]
      operationId: importSupplierSheet
      summary: Sobe a planilha do fornecedor manual
      description: |
        O CSV do fornecedor (separado por `;` ou `,`, UTF-8 ou Latin-1), no corpo (`text/csv`) ou como o arquivo
        `file` de um formulário. Colunas: `sku`, `nome`, `categoria` (o slug da categoria da loja), `custo` (em
        reais, "12,90"), `estoque`, e as opcionais `peso_g` e `foto` (https). Tudo é conferido antes: uma linha
        com erro e nada muda (422, com os erros por linha). Sem erro, a planilha substitui a anterior e passa pela
        mesma sincronização do feed: o que é novo, mudou ou saiu chega à loja pelos eventos de sempre. Até 5 MB e
        5000 produtos. Só com o papel `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: A planilha entrou, e o que a sincronização fez na loja.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualImportResult"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "409":
          description: O fornecedor não está no modo manual, ou outra sincronização está rodando.
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "413":
          description: O arquivo passa do limite.
        "422":
          description: Linhas com erro; nada mudou.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SheetProblem"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
  /v1/admin/supplier-catalog/sheet/template:
    get:
      tags: [admin]
      operationId: getSupplierSheetTemplate
      summary: O modelo da planilha
      description: O CSV com o cabeçalho e uma linha de exemplo, para a equipe preencher.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: O modelo.
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
  /v1/admin/dead-letters:
    get:
      tags: [admin]
      operationId: listDeadLetters
      summary: Mensagens pendentes na dead letter topic
      description: |
        Mensagens em `fulfillment.dlt` que chegaram depois do último reprocessamento: as que falharam em
        todas as tentativas (no lugar e nos tópicos de retry) e as envenenadas (fora do contrato),
        que vão direto para lá. Ver docs/adr/0003-retries-e-dead-letter-topics.md.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "./common/v1/dead-letters.yaml#/components/parameters/DeadLetterLimit"
      responses:
        "200":
          description: Mensagens pendentes.
          content:
            application/json:
              schema:
                $ref: "./common/v1/dead-letters.yaml#/components/schemas/DeadLetterList"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common/v1/dead-letters.yaml#/components/responses/KafkaUnavailable"
  /v1/admin/dead-letters/replay:
    post:
      tags: [admin]
      operationId: replayDeadLetters
      summary: Reprocessa as mensagens pendentes na dead letter topic
      description: |
        Devolve as pendentes para `fulfillment.retry-1`: só o fulfillment as consome de novo. Falhando outra
        vez, voltam para a DLT. Evento já processado não repete o efeito (inbox). Use depois de
        corrigir a causa.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Quantas mensagens foram devolvidas.
          content:
            application/json:
              schema:
                $ref: "./common/v1/dead-letters.yaml#/components/schemas/DeadLetterReplay"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common/v1/dead-letters.yaml#/components/responses/KafkaUnavailable"

components:
  schemas:
    ShippingQuoteRequest:
      type: object
      required: [zip_code, items]
      additionalProperties: false
      properties:
        zip_code:
          type: string
          description: O CEP, com ou sem hífen.
          examples: ["01310-100"]
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [sku, quantity]
            additionalProperties: false
            properties:
              sku:
                type: string
                minLength: 1
                description: O SKU da loja (o vid no fornecedor).
              product_id:
                type: string
                format: uuid
                description: O produto da loja. Com ele em todos os itens, o frete grátis é avaliado (#323).
              quantity:
                type: integer
                minimum: 1
                maximum: 99

    ShippingQuote:
      type: object
      required: [zip_code, options]
      properties:
        zip_code:
          type: string
          pattern: "^[0-9]{8}$"
        options:
          type: array
          items:
            $ref: "#/components/schemas/ShippingOption"

    ShippingOption:
      type: object
      required: [id, name, price_cents, min_days, max_days]
      properties:
        id:
          type: string
          description: "O serviço (ex.: `economico`, `expresso`), o que o pedido escolhe."
        name:
          type: string
          description: O nome que o cliente vê.
        price_cents:
          type: integer
          format: int64
          minimum: 0
          description: O que o cliente paga pelo frete; 0 no frete grátis.
        regular_price_cents:
          type: [integer, "null"]
          format: int64
          description: No frete grátis, o preço normal do frete, para a loja mostrar riscado; nulo nos outros.
        min_days:
          type: integer
          minimum: 1
          description: Dias úteis, já com o processamento da loja.
        max_days:
          type: integer
          minimum: 1

    CatalogSyncResult:
      type: object
      required: [created, updated, removed, unchanged]
      properties:
        created:
          type: integer
          minimum: 0
          description: Produtos novos no feed.
        updated:
          type: integer
          minimum: 0
          description: Alterados ou de volta ao feed.
        removed:
          type: integer
          minimum: 0
          description: Saíram do feed.
        unchanged:
          type: integer
          minimum: 0

    PlacedRequest:
      type: object
      required: [supplier_order_id]
      additionalProperties: false
      properties:
        supplier_order_id:
          type: string
          minLength: 1
          maxLength: 100
          description: O número do pedido no site do fornecedor.
        paid_product_cost_cents:
          type: integer
          minimum: 1
          description: O que a equipe pagou pelos produtos, em centavos de real.
        paid_freight_cost_cents:
          type: integer
          minimum: 0
          description: O que a equipe pagou pelo frete, em centavos de real.

    OutOfStockRequest:
      type: object
      additionalProperties: false
      properties:
        detail:
          type: string
          maxLength: 500

    TrackingRequest:
      type: object
      required: [number]
      additionalProperties: false
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 64
        carrier:
          type: string
          maxLength: 64
          examples: ["Correios"]
        url:
          type: string
          format: uri
          maxLength: 500
          description: O link de rastreio (https).

    SupplierOrderToPlace:
      type: object
      description: Um pedido do fornecedor manual, na fila ou em andamento.
      required: [order_id, awaiting_since, items, status]
      properties:
        status:
          type: string
          enum: [awaiting_staff, placed, shipped]
        supplier_order_id:
          type: [string, "null"]
          description: O número do pedido no fornecedor, depois de feito.
        paid_product_cost_cents:
          type: [integer, "null"]
        paid_freight_cost_cents:
          type: [integer, "null"]
        tracking:
          oneOf:
            - $ref: "./orders.v1.yaml#/components/schemas/Tracking"
            - type: "null"
        placed_at:
          type: [string, "null"]
          format: date-time
        shipped_at:
          type: [string, "null"]
          format: date-time
        order_id:
          type: string
          format: uuid
        awaiting_since:
          type: string
          format: date-time
          description: Quando entrou na fila.
        promised_by:
          type: [string, "null"]
          format: date
          description: A data de entrega prometida ao cliente.
        items:
          type: array
          items:
            type: object
            required: [sku, name, quantity]
            properties:
              sku:
                type: string
                description: O SKU da loja, que é o da planilha do fornecedor.
              name:
                type: string
              quantity:
                type: integer
                minimum: 1
        revenue_cents:
          type: [integer, "null"]
          description: O que o cliente pagou, com o frete.
        freight_charged_cents:
          type: [integer, "null"]
          description: O frete cobrado do cliente (zero no frete grátis).
        shipping_service:
          type: [string, "null"]
          examples: ["economico"]
        expected_product_cost_cents:
          type: [integer, "null"]
          description: O custo dos produtos pela planilha.
        expected_freight_cost_cents:
          type: [integer, "null"]
          description: O custo do frete pela tabela.
        customer_email:
          type: [string, "null"]
          description: Só para o papel `admin`.
        ship_to:
          description: Para quem e para onde o fornecedor manda; só para o papel `admin`.
          oneOf:
            - $ref: "#/components/schemas/ToPlaceShipTo"
            - type: "null"

    ToPlaceShipTo:
      type: object
      required: [name, cpf, phone, zip_code, street, number, district, city, state]
      properties:
        name:
          type: string
        cpf:
          type: string
        phone:
          type: string
        zip_code:
          type: string
        street:
          type: string
        number:
          type: string
        complement:
          type: [string, "null"]
        district:
          type: string
        city:
          type: string
        state:
          type: string

    ManualSheetSummary:
      type: object
      required: [enabled, products]
      properties:
        enabled:
          type: boolean
          description: Se o fornecedor está no modo manual.
        products:
          type: integer
          minimum: 0
          description: Produtos na última planilha.
        imported_at:
          type: [string, "null"]
          format: date-time
          description: Quando a última planilha foi subida.

    SheetError:
      type: object
      required: [line, message]
      properties:
        line:
          type: integer
          minimum: 1
          description: A linha da planilha (o cabeçalho é a 1).
        message:
          type: string

    ManualImportResult:
      type: object
      required: [products, sync]
      properties:
        products:
          type: integer
          minimum: 1
          description: Produtos na planilha que entrou.
        sync:
          $ref: "#/components/schemas/CatalogSyncResult"

    SheetProblem:
      description: A planilha teve erro (HTTP 422), com um item por linha; nada mudou.
      allOf:
        - $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        - type: object
          required: [sheet_errors]
          properties:
            sheet_errors:
              type: array
              items:
                $ref: "#/components/schemas/SheetError"

    OverdueSupplierOrder:
      type: object
      required: [order_id, status, stage, due_at, supplier, customer_email, attempts, created_at]
      properties:
        order_id:
          type: string
          format: uuid
          description: O pedido da loja (o mesmo `order_id` do orders).
        status:
          type: string
          description: |
            `pending`: na fila para o fornecedor (ou esperando nova tentativa) · `placing`: sendo enviado ·
            `awaiting_staff`: fornecedor manual, na fila "Pedidos a fazer" da equipe (#412) ·
            `placed`: aceito e não despachado · `shipped`: despachado e não entregue.
          enum: [pending, placing, awaiting_staff, placed, shipped]
        stage:
          type: string
          description: "`shipping`: o fornecedor não despachou no prazo · `delivery`: o envio não chegou no prazo."
          enum: [shipping, delivery]
        due_at:
          type: string
          format: date-time
          description: Quando o prazo da etapa venceu.
        supplier:
          type: string
        supplier_order_id:
          type: [string, "null"]
          description: O pedido no fornecedor, depois de aceito.
        customer_email:
          type: string
          format: email
        attempts:
          type: integer
          minimum: 0
          description: Tentativas de envio ao fornecedor que falharam (fornecedor fora, timeout).
        last_error:
          type: [string, "null"]
          description: O erro da última tentativa.
        tracking:
          description: Rastreio, no `shipped`.
          oneOf:
            - $ref: "./orders.v1.yaml#/components/schemas/Tracking"
            - type: "null"
        created_at:
          type: string
          format: date-time
          description: Quando o pedido pago chegou ao fulfillment.
        placed_at:
          type: [string, "null"]
          format: date-time
        shipped_at:
          type: [string, "null"]
          format: date-time

    SupplierStatus:
      type: object
      required: [name, host, reachable, own_credentials, webhook_secret_configured, products_in_feed, ship_within_hours, deliver_within_hours, return_within_hours]
      properties:
        name:
          type: string
        host:
          type: string
          description: O endereço da API do fornecedor.
        reachable:
          type: boolean
        latency_ms:
          type: [integer, "null"]
          format: int64
        error:
          type: [string, "null"]
        own_credentials:
          type: boolean
          description: Falso enquanto usa as credenciais do simulador.
        webhook_secret_configured:
          type: boolean
        products_in_feed:
          type: integer
          minimum: 0
        last_stock_read_at:
          type: [string, "null"]
          format: date-time
        last_webhook_at:
          type: [string, "null"]
          format: date-time
        ship_within_hours:
          type: number
          description: O prazo de despacho (`Supplier:Deadlines:ShipWithin`).
        deliver_within_hours:
          type: number
          description: O prazo de transporte (`Supplier:Deadlines:DeliverWithin`).
        return_within_hours:
          type: number
          description: O prazo de resposta a uma devolução (`Supplier:Deadlines:ReturnWithin`).

    OrderMargin:
      type: object
      description: A conta de um pedido, em centavos de real.
      required: [order_id, outcome, customer_email, created_at]
      properties:
        order_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [in_progress, delivered, cancelled, returned]
        revenue_cents:
          type: [integer, "null"]
          format: int64
          description: O que o cliente pagou, com o frete.
        product_cost_cents:
          type: [integer, "null"]
          format: int64
          description: O custo dos produtos, no câmbio da compra. Nulo se algum não veio do fornecedor.
        freight_cents:
          type: [integer, "null"]
          format: int64
          description: |
            O custo do frete para a loja, cotado no fornecedor quando o pedido foi a ele (#323); nos pedidos de
            antes disso, o cobrado, que era igual. Nulo se a cotação falhou.
        freight_charged_cents:
          type: [integer, "null"]
          format: int64
          description: O que o cliente pagou pelo frete; 0 no frete grátis, que entra como custo da loja.
        fee_cents:
          type: [integer, "null"]
          format: int64
          description: A taxa do provedor de pagamento.
        margin_cents:
          type: [integer, "null"]
          format: int64
          description: Pode ser negativa. Nula se faltar um dos valores, ou se o cliente foi estornado.
        customer_email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    OrderMarginTotals:
      type: object
      description: |
        A soma do período, só dos pedidos com a margem conhecida (`counted`): receita, custos e margem fecham
        entre si. Os estornados (`refunded`: cancelados ou devolvidos) e os que não têm algum valor
        (`incomplete`) ficam fora da soma.
      required: [orders, counted, refunded, incomplete, revenue_cents, product_cost_cents, freight_cents, fee_cents, margin_cents]
      properties:
        orders:
          type: integer
          minimum: 0
          description: Pedidos do período.
        counted:
          type: integer
          minimum: 0
        refunded:
          type: integer
          minimum: 0
        incomplete:
          type: integer
          minimum: 0
        revenue_cents:
          type: integer
          format: int64
        product_cost_cents:
          type: integer
          format: int64
        freight_cents:
          type: integer
          format: int64
        fee_cents:
          type: integer
          format: int64
        margin_cents:
          type: integer
          format: int64
          description: Pode ser negativa.

    FailedSupplierOrder:
      type: object
      description: |
        Um pedido que não chegou ao fornecedor. O cliente já foi estornado; no `order_cancelled` (o pagamento aprovado
        deixou de valer), não havia o que estornar.
      required: [order_id, reason, supplier, customer_email, attempts, created_at, failed_at]
      properties:
        order_id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [out_of_stock, rejected, supplier_cancelled, supplier_unavailable, invoice_rejected, store_cancelled, order_cancelled]
        detail:
          type: [string, "null"]
        supplier:
          type: string
        supplier_order_id:
          type: [string, "null"]
        customer_email:
          type: string
          format: email
        attempts:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time

    SupplierReturn:
      type: object
      description: A devolução de um pedido ao fornecedor. O cliente já foi estornado; isto é a pendência da loja.
      required: [order_id, status, overdue, due_at, supplier, customer_email, items, attempts, requested_at]
      properties:
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, open, approved, rejected]
          description: "`pending`: na fila para abrir. `open`: esperando a resposta do fornecedor. `rejected`: ele recusou."
        overdue:
          type: boolean
          description: Passou do prazo sem resposta do fornecedor.
        due_at:
          type: string
          format: date-time
        supplier:
          type: string
        supplier_order_id:
          type: [string, "null"]
        dispute_id:
          type: [string, "null"]
        return_code:
          type: [string, "null"]
          description: O código que o cliente escreve no pacote (do fornecedor, ou da loja no `send`).
        return_address:
          type: [string, "null"]
          description: Para onde o cliente manda o produto (do fornecedor, ou da loja no `send`).
        customer_email:
          type: string
          format: email
        items:
          type: array
          items:
            type: object
            required: [sku, name, quantity]
            properties:
              sku:
                type: string
              name:
                type: string
              quantity:
                type: integer
                minimum: 1
        attempts:
          type: integer
          minimum: 0
          description: Tentativas de abrir com o fornecedor fora do ar.
        last_error:
          type: [string, "null"]
        resolution_reason:
          type: [string, "null"]
          description: Por que o fornecedor recusou.
        invoice_error:
          type: [string, "null"]
          description: Por que a SEFAZ rejeitou a nota de devolução.
        requested_at:
          type: string
          format: date-time
        opened_at:
          type: [string, "null"]
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        awaiting_customer_instruction:
          type: boolean
          description: |
            O fornecedor recusou na abertura e a loja ainda não disse ao cliente o que fazer (#281): pede a
            equipe (`instructSupplierReturnCustomer`).
        customer_instruction:
          type: [string, "null"]
          enum: [keep, send, null]
          description: O que a loja combinou depois da recusa na abertura.
        instructed_at:
          type: [string, "null"]
          format: date-time

    CustomerInstructionRequest:
      type: object
      description: "`keep`: o cliente fica com o produto. `send`: manda para o endereço da loja, com o código dela."
      required: [instruction]
      properties:
        instruction:
          type: string
          enum: [keep, send]
        return_code:
          type: string
          minLength: 1
          maxLength: 64
          description: Só no `send`.
        return_address:
          type: string
          minLength: 1
          maxLength: 500
          description: Só no `send`.

    SupplierWebhook:
      type: object
      description: |
        Formato do CJ Dropshipping, `messageType` UPDATE: `ORDER` (o andamento de um pedido), `STOCK` (a
        disponibilidade de uma variante, #218) ou `DISPUTE` (a resposta a uma devolução, #223).
      required: [messageId, type, messageType, params]
      properties:
        messageId:
          type: string
          minLength: 1
          maxLength: 64
        type:
          type: string
          description: "`ORDER`, `STOCK` ou `DISPUTE`; outros tipos são ignorados."
        messageType:
          type: string
          description: "`UPDATE`."
        params:
          type: object
          description: "`ORDER`: `orderNumber` e `orderStatus` obrigatórios. `STOCK`: `vid` e `storageNum` obrigatórios. `DISPUTE`: `orderNumber` e `disputeStatus` obrigatórios."
          properties:
            disputeStatus:
              type: string
              description: "`DISPUTE`: `PROCESSING`, `APPROVED` ou `REJECTED`."
            vid:
              type: string
              description: "`STOCK`: a variante."
            storageNum:
              type: integer
              minimum: 0
              description: "`STOCK`: unidades disponíveis agora."
            orderId:
              type: [string, "null"]
              description: Id do pedido no fornecedor.
            orderNumber:
              type: string
              format: uuid
              description: Número do pedido na loja (order_id).
            orderStatus:
              type: string
              description: "`CREATED`, `UNSHIPPED`, `SHIPPED`, `DELIVERED` ou `CANCELLED`."
            subStatus:
              type: [string, "null"]
            trackNumber:
              type: [string, "null"]
            trackingProvider:
              type: [string, "null"]
            trackingUrl:
              type: [string, "null"]
            reason:
              type: [string, "null"]
            updateDate:
              type: [string, "null"]
              format: date-time
    SupplierWebhookAck:
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [applied, duplicate, ignored, unknown_order]
          description: |
            `applied`: o pedido mudou · `duplicate`: mensagem já recebida · `ignored`: nada a mudar
            (atrasada ou repetida em outra mensagem) · `unknown_order`: não é pedido desta loja.

  securitySchemes:
    bearerAuth:
      $ref: "./common/v1/common.yaml#/components/securitySchemes/bearerAuth"
