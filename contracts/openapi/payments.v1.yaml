openapi: 3.1.0
info:
  title: CompraFácil — Payments API
  version: 1.0.0
  summary: Consulta de pagamentos, notificações do provedor e estornos.
  description: |
    API do serviço **payments** (time de Processamento de compras, ASP.NET Core).

    A cobrança **não** é iniciada por HTTP: o payments consome `OrderPlaced` (com o meio de pagamento) e
    `StockReserved` e cobra no provedor (ADR 0007, #220: o Mercado Pago; em dev e no CI, o `payment-sim`).
    PIX gera o QR e espera o cliente pagar; cartão é autorizado e capturado quando o fornecedor aceita o
    pedido. Ver `contracts/asyncapi/payments.v1.yaml`. Cada pedido é cobrado no máximo uma vez.

    Esta API serve para consulta, para as notificações do provedor e para o estorno pelo painel.
servers:
  - url: http://localhost:8004
    description: Serviço direto (dev)
  - url: http://localhost/payments
    description: Via gateway Traefik
tags:
  - name: payments
    description: Pagamentos de pedidos.
  - name: webhooks
    description: Chamadas do provedor de pagamento.
  - name: admin
    description: "Operação (role `admin`): estorno; dead letter topic em todos os serviços."

paths:
  /v1/payments:
    get:
      tags: [payments]
      operationId: listPayments
      summary: Pagamentos de um pedido
      description: Normalmente um por pedido; mais de um só se houver nova tentativa após falha.
      parameters:
        - name: order_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pagamentos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Payment"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/payments/{payment_id}:
    get:
      tags: [payments]
      operationId: getPayment
      summary: Detalhe de um pagamento
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pagamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          $ref: "./common/v1/common.yaml#/components/responses/NotFound"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/webhooks/payments:
    post:
      tags: [webhooks]
      operationId: receivePaymentNotification
      summary: Notificação do provedor (uma cobrança mudou)
      description: |
        No formato do Mercado Pago: `?data.id=<id>&type=payment` e os headers `x-request-id` e
        `x-signature: ts=<ts>,v1=<hex>`, com `v1 = HMAC-SHA256(segredo, "id:<data.id>;request-id:<x-request-id>;ts:<ts>;")`.
        O corpo não é usado: a cobrança é consultada no provedor. Cobrança desconhecida também responde
        200, para o provedor não insistir.
      parameters:
        - name: data.id
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
        - name: x-request-id
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Recebida.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: string
                    enum: [applied, ignored, unknown_payment]
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/admin/payments/{payment_id}/refunds:
    post:
      tags: [admin]
      operationId: refundPayment
      summary: Estorna parte ou o resto de um pagamento aprovado
      description: |
        Devolução parcial (um item devolvido, #223) ou do que falta. Idempotente pelo `Idempotency-Key`:
        a mesma chave não estorna duas vezes. Publica `PaymentRefunded`.
      security:
        - bearerAuth: []
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "./common/v1/common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_cents:
                  type: [integer, "null"]
                  format: int64
                  minimum: 1
                  description: Nulo estorna o que falta.
      responses:
        "200":
          description: O pagamento depois do estorno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common/v1/common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common/v1/common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
        "503":
          description: O provedor não respondeu; nada foi estornado, tente de novo com a mesma chave.
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"

  /v1/admin/dead-letters:
    get:
      tags: [admin]
      operationId: listDeadLetters
      summary: Mensagens pendentes na dead letter topic
      description: |
        Mensagens em `payments.dlt` que chegaram depois do último reprocessamento: as que falharam em
        todas as tentativas (no lugar e nos tópicos de retry) e as envenenadas (fora do contrato),
        que vão direto para lá. Ver docs/adr/0003-retries-e-dead-letter-topics.md.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "./common/v1/dead-letters.yaml#/components/parameters/DeadLetterLimit"
      responses:
        "200":
          description: Mensagens pendentes.
          content:
            application/json:
              schema:
                $ref: "./common/v1/dead-letters.yaml#/components/schemas/DeadLetterList"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common/v1/dead-letters.yaml#/components/responses/KafkaUnavailable"
  /v1/admin/dead-letters/replay:
    post:
      tags: [admin]
      operationId: replayDeadLetters
      summary: Reprocessa as mensagens pendentes na dead letter topic
      description: |
        Devolve as pendentes para `payments.retry-1`: só o payments as consome de novo. Falhando outra
        vez, voltam para a DLT. Evento já processado não repete o efeito (inbox). Use depois de
        corrigir a causa.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Quantas mensagens foram devolvidas.
          content:
            application/json:
              schema:
                $ref: "./common/v1/dead-letters.yaml#/components/schemas/DeadLetterReplay"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common/v1/dead-letters.yaml#/components/responses/KafkaUnavailable"

components:
  schemas:
    PaymentStatus:
      type: string
      description: |
        `processing`: enviado ao provedor (ou o cartão em análise) · `pending`: PIX esperando o pagamento ·
        `authorized`: cartão com o valor garantido, a captura vem quando o fornecedor aceita · `approved`:
        pago ou capturado (pode ter estorno parcial, `refunded_cents`) · `failed` · `voided`: autorização
        cancelada, nada cobrado · `refunded`: tudo devolvido.
      enum: [processing, pending, authorized, approved, failed, voided, refunded]

    PaymentMethod:
      type: string
      enum: [pix, card]

    FailureReason:
      type: string
      description: "`pix_expired`: o PIX não foi pago até a validade."
      enum: [card_declined, insufficient_funds, fraud_suspected, gateway_error, pix_expired]

    Pix:
      type: object
      required: [qr_code, qr_code_base64, expires_at]
      properties:
        qr_code:
          type: string
          description: O "copia e cola" (BR Code).
        qr_code_base64:
          type: string
          description: O QR em PNG, em base64.
        ticket_url:
          type: [string, "null"]
          format: uri
          description: A página de pagamento do provedor.
        expires_at:
          type: string
          format: date-time

    Payment:
      type: object
      required: [id, order_id, amount, status, method, installments, provider, fee_cents, refunded_cents, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        amount:
          $ref: "./common/v1/common.yaml#/components/schemas/Money"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        failure_reason:
          oneOf:
            - $ref: "#/components/schemas/FailureReason"
            - type: "null"
        method:
          $ref: "#/components/schemas/PaymentMethod"
        installments:
          type: integer
          minimum: 1
          maximum: 12
        provider:
          type: string
          enum: [mercadopago]
        provider_reference:
          type: [string, "null"]
          description: ID da cobrança no provedor.
        card_last_four:
          type: [string, "null"]
        pix:
          oneOf:
            - $ref: "#/components/schemas/Pix"
            - type: "null"
        fee_cents:
          type: integer
          format: int64
          minimum: 0
          description: A taxa do provedor (Payments:Fees), para a margem real do pedido.
        refunded_cents:
          type: integer
          format: int64
          minimum: 0
        captured_at:
          type: [string, "null"]
          format: date-time
        refunded_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

  securitySchemes:
    bearerAuth:
      $ref: "./common/v1/common.yaml#/components/securitySchemes/bearerAuth"
