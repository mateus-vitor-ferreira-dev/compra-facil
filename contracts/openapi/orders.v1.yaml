openapi: 3.1.0
info:
  title: CompraFácil — Orders API
  version: 1.0.0
  summary: Criação e consulta de pedidos.
  description: |
    API do serviço **orders** (time de Processamento de compras, ASP.NET Core).

    Criar um pedido **inicia a SAGA de compra** e responde `202 Accepted` com o pedido em `pending`.
    O resultado chega de forma assíncrona:

    `pending` → `confirmed` (estoque reservado e pagamento aprovado) **ou** `cancelled`
    (`cancellation_reason`: `out_of_stock` ou `payment_failed`). Enquanto `pending`, o
    `stock_reserved_at` diz a etapa: nulo, reservando o estoque; preenchido, cobrando o pagamento.

    Acompanhe ao vivo por `GET /v1/orders/{order_id}/events` (Server-Sent Events), por
    `GET /v1/orders/{order_id}` (polling) ou pelo e-mail do `notifications`.
    Itens e preços são validados no catálogo via gRPC na criação; o preço fica congelado no pedido.

    **Quem compra vem do token**: o access token do identity (`Authorization: Bearer`, papel `customer`)
    dá o cliente (`sub`) e o e-mail dos avisos (`email`). Cada cliente vê só os próprios pedidos
    (`/v1/me/orders`); o operador (`admin`) consulta qualquer pedido pelo id.
servers:
  - url: http://localhost:8002
    description: Serviço direto (dev)
  - url: http://localhost/orders
    description: Via gateway Traefik
tags:
  - name: orders
    description: Pedidos de compra.
  - name: admin
    description: Operação (role `admin`); dead letter topic em todos os serviços.

paths:
  /v1/orders:
    post:
      tags: [orders]
      operationId: placeOrder
      summary: Cria um pedido e inicia a SAGA de compra
      description: |
        Valida os itens no catálogo (existem, estão ativos, preço vigente) e grava o pedido como
        `pending` junto com o evento `OrderPlaced` (outbox). Requisições repetidas com o mesmo
        `Idempotency-Key` devolvem o pedido já criado.

        Com o catálogo fora ou lento (prazo, novas tentativas e circuit breaker), a validação e o
        preço saem da cópia local do catálogo que o orders mantém pelos eventos, com as mesmas
        regras (campanha vigente de maior desconto).

        O cliente e o e-mail dos avisos são os do token (claims `sub` e `email`), não do corpo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "./common/v1/common.yaml#/components/parameters/RequestId"
        - $ref: "./common/v1/common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
      responses:
        "202":
          description: Pedido aceito e em processamento.
          headers:
            Location:
              $ref: "./common/v1/common.yaml#/components/headers/Location"
            X-Request-ID:
              $ref: "./common/v1/common.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          description: O token não é de cliente (papel `customer`).
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "409":
          description: |
            Itens recusados pelo catálogo (produto inexistente/inativo ou preço alterado desde a
            exibição). O `detail` lista os itens.
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "503":
          description: Catálogo indisponível e sem snapshot local para validar os itens.
          headers:
            Retry-After:
              description: Segundos sugeridos até nova tentativa.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "./common/v1/common.yaml#/components/schemas/Problem"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/me/orders:
    get:
      tags: [orders]
      operationId: listMyOrders
      summary: Os pedidos do cliente do token ("Meus pedidos")
      description: Do mais recente para o mais antigo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "./common/v1/common.yaml#/components/parameters/RequestId"
        - $ref: "./common/v1/common.yaml#/components/parameters/Cursor"
        - $ref: "./common/v1/common.yaml#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: Página de pedidos.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  page:
                    $ref: "./common/v1/common.yaml#/components/schemas/PageInfo"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "./common/v1/common.yaml#/components/responses/UnprocessableEntity"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/orders/{order_id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Detalhe e situação de um pedido
      description: |
        Do dono do pedido (o cliente do token) ou do operador (`admin`). Pedido de outro cliente dá
        `404`, como se não existisse: o id não revela que o pedido existe.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "./common/v1/common.yaml#/components/parameters/RequestId"
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pedido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common/v1/common.yaml#/components/responses/NotFound"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/orders/{order_id}/events:
    get:
      tags: [orders]
      operationId: streamOrderEvents
      summary: O pedido ao vivo (Server-Sent Events)
      description: |
        Stream `text/event-stream` com o estado atual do pedido e cada mudança da SAGA, até o estado final
        (`delivered`, ou `cancelled` sem estorno pendente), quando a conexão fecha. Mesmas regras de acesso do `getOrder`.

        - Cada evento é `event: order`, com `id` (muda a cada transição) e `data` com o `Order` em JSON.
        - Linhas `: keep-alive` a cada 15 s, sem dado: mantêm a conexão aberta no gateway e em proxies.
        - O stream fecha depois de 5 min; reconecte mandando o último `id` em `Last-Event-ID` (o
          `EventSource` do navegador faz isso sozinho, com o `retry: 3000` que o stream informa). Com
          `Last-Event-ID` igual ao estado atual, ele não é reenviado.
        - Pedido já no estado final e `Last-Event-ID` igual a ele: `204`, que faz o `EventSource` parar.

        No navegador, o `EventSource` não manda `Authorization`: o front assina pelo BFF, que repassa o
        stream com o token.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "./common/v1/common.yaml#/components/parameters/RequestId"
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          required: false
          description: O `id` do último evento recebido (reconexão).
          schema:
            type: string
      responses:
        "200":
          description: Stream de eventos `order` (o `data` de cada um segue o schema `Order`).
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                confirmado:
                  value: |
                    retry: 3000

                    id: 639283847000000000
                    event: order
                    data: {"id":"0199f6a0-...","status":"pending",...}

                    id: 639283847120000000
                    event: order
                    data: {"id":"0199f6a0-...","status":"confirmed",...}
        "204":
          description: O pedido já está no estado final que o cliente recebeu; não há mais o que enviar.
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common/v1/common.yaml#/components/responses/NotFound"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"

  /v1/admin/dead-letters:
    get:
      tags: [admin]
      operationId: listDeadLetters
      summary: Mensagens pendentes na dead letter topic
      description: |
        Mensagens em `orders.dlt` que chegaram depois do último reprocessamento: as que falharam em
        todas as tentativas (no lugar e nos tópicos de retry) e as envenenadas (fora do contrato),
        que vão direto para lá. Ver docs/adr/0003-retries-e-dead-letter-topics.md.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "./common/v1/dead-letters.yaml#/components/parameters/DeadLetterLimit"
      responses:
        "200":
          description: Mensagens pendentes.
          content:
            application/json:
              schema:
                $ref: "./common/v1/dead-letters.yaml#/components/schemas/DeadLetterList"
        "400":
          $ref: "./common/v1/common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common/v1/dead-letters.yaml#/components/responses/KafkaUnavailable"
  /v1/admin/dead-letters/replay:
    post:
      tags: [admin]
      operationId: replayDeadLetters
      summary: Reprocessa as mensagens pendentes na dead letter topic
      description: |
        Devolve as pendentes para `orders.retry-1`: só o orders as consome de novo. Falhando outra
        vez, voltam para a DLT. Evento já processado não repete o efeito (inbox). Use depois de
        corrigir a causa.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Quantas mensagens foram devolvidas.
          content:
            application/json:
              schema:
                $ref: "./common/v1/dead-letters.yaml#/components/schemas/DeadLetterReplay"
        "401":
          $ref: "./common/v1/common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common/v1/common.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./common/v1/common.yaml#/components/responses/InternalError"
        "503":
          $ref: "./common/v1/dead-letters.yaml#/components/responses/KafkaUnavailable"

components:
  schemas:
    OrderStatus:
      type: string
      description: |
        `pending`: reservando o estoque e cobrando · `confirmed`: pago, com o fornecedor ·
        `shipped`: despachado, com o rastreio · `delivered`: entregue · `cancelled`: não concluído
        (ver `cancellation_reason`).
      enum: [pending, confirmed, shipped, delivered, cancelled]

    CancellationReason:
      type: string
      description: |
        `out_of_stock`: inventory recusou a reserva · `payment_failed`: payments recusou a cobrança ·
        `supplier_failed`: depois de pago, o fornecedor não atendeu, e o cliente é estornado
        (`refunded_at`).
      enum: [out_of_stock, payment_failed, supplier_failed]

    Tracking:
      type: object
      required: [number]
      properties:
        number:
          type: string
          description: Código de rastreio.
        provider:
          type: [string, "null"]
          description: Transportadora.
        url:
          type: [string, "null"]
          format: uri
          description: Onde acompanhar a entrega.

    PlaceOrderRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        payment:
          $ref: "#/components/schemas/PlaceOrderPayment"
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: Um item por produto (sem repetir `product_id`).
          items:
            $ref: "#/components/schemas/PlaceOrderItem"

    PlaceOrderPayment:
      type: object
      description: |
        Como pagar (#220). Ausente, o pedido é pago por PIX (o QR aparece no pedido). Cartão: o
        `card_token` do provedor (o cartão é tokenizado no checkout; os dados dele não passam pela loja),
        a bandeira e as parcelas.
      required: [method]
      additionalProperties: false
      properties:
        method:
          $ref: "./payments.v1.yaml#/components/schemas/PaymentMethod"
        card_token:
          type: string
          maxLength: 128
          description: Obrigatório no cartão; de uso único.
        card_brand:
          type: string
          maxLength: 16
          description: "Bandeira, como o provedor devolveu na tokenização (ex.: `visa`)."
        installments:
          type: integer
          minimum: 1
          maximum: 12
          default: 1
          description: Parcelas no cartão; PIX é à vista.

    OrderPayment:
      type: object
      required: [method, installments, pix]
      properties:
        method:
          $ref: "./payments.v1.yaml#/components/schemas/PaymentMethod"
        installments:
          type: integer
          minimum: 1
          maximum: 12
        pix:
          description: O PIX a pagar, depois que o payments o gera; nulo no cartão e antes disso.
          oneOf:
            - $ref: "./payments.v1.yaml#/components/schemas/Pix"
            - type: "null"

    PlaceOrderItem:
      type: object
      required: [product_id, quantity]
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        expected_unit_price_cents:
          type: integer
          format: int64
          minimum: 1
          description: |
            Preço que o cliente viu. Se informado e diferente do vigente no catálogo, o pedido é
            recusado com 409 (evita cobrar um preço que mudou no meio da campanha).

    Order:
      type: object
      required: [id, customer_id, status, items, total, payment, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatus"
        cancellation_reason:
          oneOf:
            - $ref: "#/components/schemas/CancellationReason"
            - type: "null"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total:
          $ref: "./common/v1/common.yaml#/components/schemas/Money"
        payment_id:
          type: [string, "null"]
          format: uuid
          description: Preenchido quando o payments processa a cobrança.
        payment:
          $ref: "#/components/schemas/OrderPayment"
        stock_reserved_at:
          type: [string, "null"]
          format: date-time
          description: |
            Quando o inventory reservou o estoque. Com o pedido `pending`, nulo é a etapa da reserva e
            preenchido é a da cobrança. Nulo também no pedido cancelado por `out_of_stock`.
        sent_to_supplier_at:
          type: [string, "null"]
          format: date-time
          description: Quando o fornecedor aceitou o pedido pago (`confirmed`, antes de `shipped`).
        tracking:
          description: Rastreio do envio; nulo antes de `shipped`.
          oneOf:
            - $ref: "#/components/schemas/Tracking"
            - type: "null"
        shipped_at:
          type: [string, "null"]
          format: date-time
        delivered_at:
          type: [string, "null"]
          format: date-time
        refunded_at:
          type: [string, "null"]
          format: date-time
          description: |
            Quando o valor voltou ao cliente, no pedido cancelado por `supplier_failed`. Nulo nesse
            pedido é o estorno em andamento.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderItem:
      type: object
      required: [product_id, sku, name, quantity, unit_price, line_total]
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
          description: Nome no momento da compra.
        quantity:
          type: integer
          minimum: 1
        unit_price:
          description: Preço efetivo (com campanha) congelado na criação do pedido.
          $ref: "./common/v1/common.yaml#/components/schemas/Money"
        line_total:
          $ref: "./common/v1/common.yaml#/components/schemas/Money"
        campaign_id:
          type: [string, "null"]
          format: uuid

  securitySchemes:
    bearerAuth:
      $ref: "./common/v1/common.yaml#/components/securitySchemes/bearerAuth"
