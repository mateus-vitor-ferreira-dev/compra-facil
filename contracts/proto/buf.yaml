# Módulo Buf dos contratos gRPC. Rodar a partir de contracts/proto (ou via task lint:proto).
version: v2
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  except:
    # o namespace C# é só o do código gerado no orders (não vai no fio); mudou com a troca do nome da loja
    - FILE_SAME_CSHARP_NAMESPACE
