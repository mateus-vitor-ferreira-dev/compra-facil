asyncapi: 3.1.0
info:
  title: CompraFácil — Orders Events
  version: 1.0.0
  description: |
    Eventos do serviço **orders** (time de Processamento de compras, ASP.NET Core), que abre e fecha a
    SAGA de compra:

    1. `POST /v1/orders` grava o pedido `pending` e o `OrderPlaced` na mesma transação (outbox);
    2. `StockReserved` → o pedido segue `pending`, agora na etapa da cobrança (`stock_reserved_at`, para
       o acompanhamento ao vivo); não publica nada;
    3. `PaymentPending` (PIX gerado) → o pedido mostra o QR, ainda `pending`; `PaymentApproved` (PIX
       pago, ou cartão autorizado) → pedido `confirmed` → `OrderConfirmed`;
    4. `StockReservationFailed` → `cancelled` (`out_of_stock`) → `OrderCancelled`;
    5. `PaymentFailed` → `cancelled` (`payment_failed`) → `OrderCancelled`, que faz o inventory
       liberar a reserva (compensação).

    Depois de pago, o pedido segue o fornecedor (fulfillment, ADR 0007):

    6. `SupplierOrderPlaced` → segue `confirmed`, com `sent_to_supplier_at`; não publica nada;
    7. `SupplierOrderShipped` → `shipped`, com o rastreio → `OrderShipped`;
    8. `SupplierOrderDelivered` → `delivered` → `OrderDelivered`;
    9. `SupplierOrderFailed` → `cancelled` (`supplier_failed`, ou `invoice_failed` quando a SEFAZ
       rejeitou a nota) → `OrderCancelled`, que faz o payments estornar o cliente (compensação);
       `PaymentRefunded` → `refunded_at`.

    A nota fiscal (`fulfillment.invoice.v1`, #221): `InvoiceIssued` grava a nota no pedido e
    `InvoiceCancelled`, o cancelamento dela; nenhum dos dois publica.

    Também consome `catalog.product.v1` e `catalog.campaign.v1` para manter o snapshot local de
    produtos e campanhas, usado só quando o gRPC do catálogo está fora.
defaultContentType: application/json

servers:
  dev:
    $ref: "./common/v1/common.yaml#/components/servers/dev"
  dev-internal:
    $ref: "./common/v1/common.yaml#/components/servers/dev-internal"

channels:
  orderEvents:
    address: orders.order.v1
    title: Pedidos
    description: Ciclo de vida do pedido. Chave = `order_id`.
    messages:
      OrderPlaced:
        $ref: "#/components/messages/OrderPlaced"
      OrderConfirmed:
        $ref: "#/components/messages/OrderConfirmed"
      OrderCancelled:
        $ref: "#/components/messages/OrderCancelled"
      OrderShipped:
        $ref: "#/components/messages/OrderShipped"
      OrderDelivered:
        $ref: "#/components/messages/OrderDelivered"
    bindings:
      kafka:
        bindingVersion: 0.5.0
        topic: orders.order.v1
        partitions: 3
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 604800000
  # Canais de outros serviços que o orders consome (definidos no contrato do dono)
  reservationEvents:
    $ref: "./inventory.v1.yaml#/channels/reservationEvents"
  paymentEvents:
    $ref: "./payments.v1.yaml#/channels/paymentEvents"
  supplierOrderEvents:
    $ref: "./fulfillment.v1.yaml#/channels/supplierOrderEvents"
  invoiceEvents:
    $ref: "./fulfillment.v1.yaml#/channels/invoiceEvents"
  productEvents:
    $ref: "./catalog.v1.yaml#/channels/productEvents"
  campaignEvents:
    $ref: "./catalog.v1.yaml#/channels/campaignEvents"

operations:
  publishOrderEvents:
    action: send
    channel:
      $ref: "#/channels/orderEvents"
    summary: Publica as mudanças de estado do pedido (outbox).
    messages:
      - $ref: "#/channels/orderEvents/messages/OrderPlaced"
      - $ref: "#/channels/orderEvents/messages/OrderConfirmed"
      - $ref: "#/channels/orderEvents/messages/OrderCancelled"
      - $ref: "#/channels/orderEvents/messages/OrderShipped"
      - $ref: "#/channels/orderEvents/messages/OrderDelivered"

  onReservationResult:
    action: receive
    channel:
      $ref: "#/channels/reservationEvents"
    summary: Marca a etapa da cobrança (reservado) ou cancela o pedido por falta de estoque.
    messages:
      - $ref: "#/channels/reservationEvents/messages/StockReserved"
      - $ref: "#/channels/reservationEvents/messages/StockReservationFailed"
    bindings:
      $ref: "#/components/operationBindings/OrdersGroup"

  onPaymentResult:
    action: receive
    channel:
      $ref: "#/channels/paymentEvents"
    summary: Confirma (aprovado) ou cancela (recusado) o pedido; marca o estorno do cancelado depois de pago.
    messages:
      - $ref: "#/channels/paymentEvents/messages/PaymentPending"
      - $ref: "#/channels/paymentEvents/messages/PaymentApproved"
      - $ref: "#/channels/paymentEvents/messages/PaymentFailed"
      - $ref: "#/channels/paymentEvents/messages/PaymentRefunded"
    bindings:
      $ref: "#/components/operationBindings/OrdersGroup"

  onSupplierOrderEvents:
    action: receive
    channel:
      $ref: "#/channels/supplierOrderEvents"
    summary: Leva o pedido pago pelo fornecedor (aceito, enviado, entregue) ou o cancela, se ele não atender.
    messages:
      - $ref: "#/channels/supplierOrderEvents/messages/SupplierOrderPlaced"
      - $ref: "#/channels/supplierOrderEvents/messages/SupplierOrderShipped"
      - $ref: "#/channels/supplierOrderEvents/messages/SupplierOrderDelivered"
      - $ref: "#/channels/supplierOrderEvents/messages/SupplierOrderFailed"
    bindings:
      $ref: "#/components/operationBindings/OrdersGroup"

  onInvoiceEvents:
    action: receive
    channel:
      $ref: "#/channels/invoiceEvents"
    summary: Grava a nota fiscal no pedido e, depois do estorno, o cancelamento dela.
    messages:
      - $ref: "#/channels/invoiceEvents/messages/InvoiceIssued"
      - $ref: "#/channels/invoiceEvents/messages/InvoiceCancelled"
    bindings:
      $ref: "#/components/operationBindings/OrdersGroup"

  onProductChanged:
    action: receive
    channel:
      $ref: "#/channels/productEvents"
    summary: Atualiza o snapshot local de produtos (fallback quando o gRPC do catálogo está fora).
    messages:
      - $ref: "#/channels/productEvents/messages/ProductCreated"
      - $ref: "#/channels/productEvents/messages/ProductUpdated"
      - $ref: "#/channels/productEvents/messages/ProductDeleted"
    bindings:
      $ref: "#/components/operationBindings/OrdersGroup"

  onCampaignChanged:
    action: receive
    channel:
      $ref: "#/channels/campaignEvents"
    summary: Atualiza as campanhas do snapshot, para o fallback calcular o preço com desconto.
    messages:
      - $ref: "#/channels/campaignEvents/messages/CampaignCreated"
      - $ref: "#/channels/campaignEvents/messages/CampaignUpdated"
      - $ref: "#/channels/campaignEvents/messages/CampaignDeleted"
    bindings:
      $ref: "#/components/operationBindings/OrdersGroup"

components:
  operationBindings:
    OrdersGroup:
      kafka:
        bindingVersion: 0.5.0
        groupId:
          type: string
          const: orders

  messages:
    OrderPlaced:
      name: OrderPlaced
      title: Pedido criado
      summary: Início da SAGA. O inventory tenta reservar os itens; o payments guarda o valor a cobrar.
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/OrderKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: OrderPlaced
              event_version:
                const: 1
              producer:
                const: orders
              data:
                type: object
                required: [order_id, customer_id, customer_email, items, total, payment]
                properties:
                  order_id:
                    $ref: "#/components/schemas/OrderId"
                  customer_id:
                    $ref: "#/components/schemas/CustomerId"
                  customer_email:
                    $ref: "#/components/schemas/CustomerEmail"
                  payment:
                    type: object
                    description: Como o payments cobra. O `card_token` é de uso único e não fica no pedido.
                    required: [method, installments]
                    properties:
                      method:
                        $ref: "../openapi/payments.v1.yaml#/components/schemas/PaymentMethod"
                      installments:
                        type: integer
                        minimum: 1
                        maximum: 12
                      card_token:
                        type: [string, "null"]
                      card_brand:
                        type: [string, "null"]
                  items:
                    type: array
                    minItems: 1
                    maxItems: 50
                    items:
                      $ref: "../openapi/orders.v1.yaml#/components/schemas/OrderItem"
                  total:
                    description: Soma dos `line_total`, com os preços congelados na criação.
                    $ref: "../openapi/common/v1/common.yaml#/components/schemas/Money"

    OrderConfirmed:
      name: OrderConfirmed
      title: Pedido confirmado
      summary: |
        Pago. O inventory efetiva a reserva, o notifications envia o e-mail e o fulfillment leva o pedido
        ao fornecedor, com quem recebe e o endereço (que também vão na nota fiscal, #221).
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/OrderKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: OrderConfirmed
              event_version:
                const: 1
              producer:
                const: orders
              data:
                type: object
                required: [order_id, customer_id, customer_email, payment_id, items, total]
                properties:
                  order_id:
                    $ref: "#/components/schemas/OrderId"
                  customer_id:
                    $ref: "#/components/schemas/CustomerId"
                  customer_email:
                    $ref: "#/components/schemas/CustomerEmail"
                  payment_id:
                    type: string
                    format: uuid
                  items:
                    type: array
                    items:
                      $ref: "../openapi/orders.v1.yaml#/components/schemas/OrderItem"
                  total:
                    $ref: "../openapi/common/v1/common.yaml#/components/schemas/Money"
                  payment_method:
                    $ref: "../openapi/payments.v1.yaml#/components/schemas/PaymentMethod"
                    description: Como o cliente pagou (vai na nota fiscal).
                  recipient:
                    description: Nulo só nos pedidos de antes do #221.
                    oneOf:
                      - $ref: "../openapi/orders.v1.yaml#/components/schemas/Recipient"
                      - type: "null"
                  shipping_address:
                    oneOf:
                      - $ref: "../openapi/orders.v1.yaml#/components/schemas/ShippingAddress"
                      - type: "null"

    OrderCancelled:
      name: OrderCancelled
      title: Pedido cancelado
      summary: |
        Fim da SAGA com compensação. O inventory libera a reserva, se houver (com `out_of_stock` não
        há; com `supplier_failed` ou `invoice_failed` ela já virou baixa), o payments descarta a cobrança
        pendente ou estorna o que foi pago, e o notifications avisa o cliente.
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/OrderKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: OrderCancelled
              event_version:
                const: 1
              producer:
                const: orders
              data:
                type: object
                required: [order_id, customer_id, customer_email, reason]
                properties:
                  order_id:
                    $ref: "#/components/schemas/OrderId"
                  customer_id:
                    $ref: "#/components/schemas/CustomerId"
                  customer_email:
                    $ref: "#/components/schemas/CustomerEmail"
                  reason:
                    $ref: "../openapi/orders.v1.yaml#/components/schemas/CancellationReason"
                  payment_failure_reason:
                    description: Repassado do `PaymentFailed`; `null` nos outros motivos.
                    oneOf:
                      - $ref: "../openapi/payments.v1.yaml#/components/schemas/FailureReason"
                      - type: "null"

    OrderShipped:
      name: OrderShipped
      title: Pedido enviado
      summary: O fornecedor despachou o pedido; o cliente acompanha pelo rastreio.
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/OrderKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: OrderShipped
              event_version:
                const: 1
              producer:
                const: orders
              data:
                type: object
                required: [order_id, customer_id, customer_email, tracking, shipped_at]
                properties:
                  order_id:
                    $ref: "#/components/schemas/OrderId"
                  customer_id:
                    $ref: "#/components/schemas/CustomerId"
                  customer_email:
                    $ref: "#/components/schemas/CustomerEmail"
                  tracking:
                    $ref: "../openapi/orders.v1.yaml#/components/schemas/Tracking"
                  shipped_at:
                    type: string
                    format: date-time

    OrderDelivered:
      name: OrderDelivered
      title: Pedido entregue
      summary: Fim feliz da SAGA com o fornecedor.
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/OrderKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: OrderDelivered
              event_version:
                const: 1
              producer:
                const: orders
              data:
                type: object
                required: [order_id, customer_id, customer_email, delivered_at]
                properties:
                  order_id:
                    $ref: "#/components/schemas/OrderId"
                  customer_id:
                    $ref: "#/components/schemas/CustomerId"
                  customer_email:
                    $ref: "#/components/schemas/CustomerEmail"
                  delivered_at:
                    type: string
                    format: date-time

  schemas:
    OrderId:
      type: string
      format: uuid
    CustomerId:
      type: string
      format: uuid
    CustomerEmail:
      type: string
      format: email
      description: Destino dos e-mails do notifications.
