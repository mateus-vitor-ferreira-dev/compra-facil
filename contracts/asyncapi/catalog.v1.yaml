asyncapi: 3.1.0
info:
  title: CompraFácil — Catalog Events
  version: 1.0.0
  description: |
    Eventos publicados pelo serviço **catalog** (time de Catálogo e campanhas, Go) a partir do outbox.

    Mudanças de produto viram eventos para que os outros serviços mantenham uma cópia local do que
    precisam, sem chamar o catálogo a cada leitura:

    - **orders** guarda um snapshot (SKU, nome, preço, status) para validar pedidos quando o gRPC
      do catálogo está fora (ver `503` em `POST /v1/orders`);
    - **inventory** cria o saldo zerado do produto novo e bloqueia reservas de produto removido.

    Toda alteração publica `ProductUpdated` com o estado completo (é ele que mantém as cópias).
    Quando o preço de tabela muda, sai também `ProductPriceChanged`, com o antes e o depois, para quem
    só se interessa por preço.

    **Campanhas** (ADR 0002) publicam o próprio estado em `catalog.campaign.v1`, só quando o admin as
    altera. Início e fim não geram evento: o consumidor guarda a campanha e calcula o preço efetivo na
    hora da leitura, com a regra de `CampaignSnapshot`. O preço cobrado de verdade continua vindo do
    gRPC `ValidateItems`; a cópia local é para quando ele está fora.

    **Catálogo do fornecedor** (#217, ADR 0007): o catalog consome o feed que o fulfillment publica.
    Produto novo entra (rascunho, ou à venda se `supplier.publish_new`) com o preço pela regra de margem;
    custo novo reprecifica (`ProductUpdated` + `ProductPriceChanged`); produto fora do feed fica inativo.
    O consumo segue o ADR 0003 (inbox, retry em `catalog.retry-N`, DLT em `catalog.dlt`).
defaultContentType: application/json

servers:
  dev:
    $ref: "./common/v1/common.yaml#/components/servers/dev"
  dev-internal:
    $ref: "./common/v1/common.yaml#/components/servers/dev-internal"

channels:
  productEvents:
    address: catalog.product.v1
    title: Produtos do catálogo
    description: Ciclo de vida dos produtos. Chave = `product_id`.
    messages:
      ProductCreated:
        $ref: "#/components/messages/ProductCreated"
      ProductUpdated:
        $ref: "#/components/messages/ProductUpdated"
      ProductPriceChanged:
        $ref: "#/components/messages/ProductPriceChanged"
      ProductDeleted:
        $ref: "#/components/messages/ProductDeleted"
    bindings:
      kafka:
        bindingVersion: 0.5.0
        topic: catalog.product.v1
        partitions: 3
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 604800000

  campaignEvents:
    address: catalog.campaign.v1
    title: Campanhas promocionais
    description: Estado das campanhas, publicado a cada alteração do admin. Chave = `campaign_id`.
    messages:
      CampaignCreated:
        $ref: "#/components/messages/CampaignCreated"
      CampaignUpdated:
        $ref: "#/components/messages/CampaignUpdated"
      CampaignDeleted:
        $ref: "#/components/messages/CampaignDeleted"
    bindings:
      kafka:
        bindingVersion: 0.5.0
        topic: catalog.campaign.v1
        partitions: 3
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 604800000
  # Canal de outro serviço que o catalog consome (definido no contrato do dono)
  supplierProductEvents:
    $ref: "./fulfillment.v1.yaml#/channels/supplierProductEvents"

operations:
  publishProductEvents:
    action: send
    channel:
      $ref: "#/channels/productEvents"
    summary: Publica as mudanças de produto (outbox + franz-go).
    messages:
      - $ref: "#/channels/productEvents/messages/ProductCreated"
      - $ref: "#/channels/productEvents/messages/ProductUpdated"
      - $ref: "#/channels/productEvents/messages/ProductPriceChanged"
      - $ref: "#/channels/productEvents/messages/ProductDeleted"

  publishCampaignEvents:
    action: send
    channel:
      $ref: "#/channels/campaignEvents"
    summary: Publica as alterações de campanha (outbox), inclusive a troca de produtos.
    messages:
      - $ref: "#/channels/campaignEvents/messages/CampaignCreated"
      - $ref: "#/channels/campaignEvents/messages/CampaignUpdated"
      - $ref: "#/channels/campaignEvents/messages/CampaignDeleted"

  onSupplierProductEvents:
    action: receive
    channel:
      $ref: "#/channels/supplierProductEvents"
    summary: Cria, reprecifica ou tira de venda o produto do fornecedor.
    messages:
      - $ref: "#/channels/supplierProductEvents/messages/SupplierProductUpdated"
      - $ref: "#/channels/supplierProductEvents/messages/SupplierProductRemoved"
    bindings:
      kafka:
        bindingVersion: 0.5.0
        groupId:
          type: string
          const: catalog

components:
  messages:
    ProductCreated:
      name: ProductCreated
      title: Produto criado
      summary: Produto cadastrado pelo admin (`POST /v1/admin/products`).
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/ProductKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: ProductCreated
              event_version:
                const: 1
              producer:
                const: catalog
              data:
                $ref: "#/components/schemas/ProductSnapshot"

    ProductUpdated:
      name: ProductUpdated
      title: Produto alterado
      summary: Qualquer alteração (dados, preço ou status). Traz o estado completo após a mudança.
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/ProductKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: ProductUpdated
              event_version:
                const: 1
              producer:
                const: catalog
              data:
                $ref: "#/components/schemas/ProductSnapshot"

    ProductPriceChanged:
      name: ProductPriceChanged
      title: Preço de tabela alterado
      summary: Publicado junto com o `ProductUpdated` da mesma alteração, quando `price` muda.
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/ProductKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: ProductPriceChanged
              event_version:
                const: 1
              producer:
                const: catalog
              data:
                type: object
                required: [product_id, sku, old_price, new_price, version]
                properties:
                  product_id:
                    $ref: "#/components/schemas/ProductId"
                  sku:
                    type: string
                  old_price:
                    $ref: "../openapi/common/v1/common.yaml#/components/schemas/Money"
                  new_price:
                    $ref: "../openapi/common/v1/common.yaml#/components/schemas/Money"
                  version:
                    $ref: "#/components/schemas/ProductVersion"

    ProductDeleted:
      name: ProductDeleted
      title: Produto removido
      summary: Soft delete pelo admin. O SKU fica livre para recadastro (com outro `product_id`).
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/ProductKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: ProductDeleted
              event_version:
                const: 1
              producer:
                const: catalog
              data:
                type: object
                required: [product_id, sku, version]
                properties:
                  product_id:
                    $ref: "#/components/schemas/ProductId"
                  sku:
                    type: string
                  version:
                    $ref: "#/components/schemas/ProductVersion"

    CampaignCreated:
      name: CampaignCreated
      title: Campanha criada
      summary: Campanha cadastrada (`POST /v1/admin/campaigns`). Nasce sem produtos.
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/CampaignKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: CampaignCreated
              event_version:
                const: 1
              producer:
                const: catalog
              data:
                $ref: "#/components/schemas/CampaignSnapshot"

    CampaignUpdated:
      name: CampaignUpdated
      title: Campanha alterada
      summary: |
        Qualquer alteração: nome, desconto, período ou a lista de produtos
        (`PUT /v1/admin/campaigns/{campaign_id}/products`). Traz o estado completo após a mudança.
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/CampaignKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: CampaignUpdated
              event_version:
                const: 1
              producer:
                const: catalog
              data:
                $ref: "#/components/schemas/CampaignSnapshot"

    CampaignDeleted:
      name: CampaignDeleted
      title: Campanha removida
      summary: Removida pelo admin. Se estava vigente, os produtos voltam ao preço de tabela na hora.
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/CampaignKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: CampaignDeleted
              event_version:
                const: 1
              producer:
                const: catalog
              data:
                type: object
                required: [campaign_id, version]
                properties:
                  campaign_id:
                    $ref: "#/components/schemas/CampaignId"
                  version:
                    $ref: "#/components/schemas/CampaignVersion"

  schemas:
    CampaignId:
      type: string
      format: uuid

    CampaignVersion:
      type: integer
      minimum: 1
      description: |
        Incrementa a cada alteração da campanha, inclusive troca de produtos. O consumidor descarta
        evento com versão menor ou igual à que já aplicou.

    CampaignSnapshot:
      type: object
      description: |
        Estado da campanha após a mudança. O consumidor calcula o preço efetivo de um produto no
        instante `t` exatamente como o catálogo (`domain.Product.EffectivePriceCents`):

        1. campanhas do produto vigentes em `t`: `starts_at <= t < ends_at`;
        2. se houver mais de uma, vale a de maior `discount_percent` e, empatando, a que acaba antes;
        3. `preço efetivo = floor(price.amount_cents * (100 - discount_percent) / 100)`, em inteiros
           (arredonda a favor do cliente). Sem campanha vigente, é o preço de tabela.
      required: [campaign_id, slug, name, discount_percent, starts_at, ends_at, product_ids, version]
      properties:
        campaign_id:
          $ref: "#/components/schemas/CampaignId"
        slug:
          type: string
          examples: ["black-friday-2026"]
        name:
          type: string
        discount_percent:
          type: integer
          minimum: 1
          maximum: 90
        starts_at:
          type: string
          format: date-time
          description: Início, inclusivo (UTC).
        ends_at:
          type: string
          format: date-time
          description: Fim, exclusivo (UTC).
        product_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          description: Lista completa de produtos da campanha (substitui a anterior).
          items:
            $ref: "#/components/schemas/ProductId"
        version:
          $ref: "#/components/schemas/CampaignVersion"

    ProductId:
      type: string
      format: uuid

    ProductVersion:
      type: integer
      minimum: 1
      description: |
        Mesmo `version` do REST/gRPC. O consumidor descarta evento com versão menor ou igual à que já
        aplicou (chegada fora de ordem após retry).

    ProductSnapshot:
      type: object
      description: Estado do produto após a mudança. Só o que os consumidores usam; detalhe completo no REST.
      required: [product_id, sku, name, category_id, price, status, version, updated_at]
      properties:
        product_id:
          $ref: "#/components/schemas/ProductId"
        sku:
          type: string
          examples: ["CF-000123"]
        name:
          type: string
        category_id:
          type: string
          format: uuid
        price:
          description: Preço de tabela (sem campanha).
          $ref: "../openapi/common/v1/common.yaml#/components/schemas/Money"
        status:
          $ref: "../openapi/catalog.v1.yaml#/components/schemas/ProductStatus"
        version:
          $ref: "#/components/schemas/ProductVersion"
        updated_at:
          type: string
          format: date-time
