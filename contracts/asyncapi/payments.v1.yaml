asyncapi: 3.1.0
info:
  title: Embrulhado — Payments Events
  version: 1.0.0
  description: |
    Eventos do serviço **payments** (time de Processamento de compras, ASP.NET Core).

    Junta dois eventos do mesmo pedido antes de cobrar:

    - `OrderPlaced` → grava a cobrança pendente com `customer_id`, `total` e o meio de pagamento (`payment`);
    - `StockReserved` → marca o estoque como garantido.

    Quando os dois chegaram, **em qualquer ordem** (são tópicos diferentes), cobra no provedor de pagamento
    (ADR 0007, #379: a Efí; em dev e no CI, o `payment-sim`):

    - **PIX**: gera o QR e publica `PaymentPending`; o cliente paga, o provedor avisa (webhook) e sai
      `PaymentApproved`; se o PIX vence sem pagamento (o payments confere, porque a Efí não avisa),
      `PaymentFailed` (`pix_expired`), e a reserva é liberada.
    - **Cartão**: cobrado no checkout, em dois passos (abrir a cobrança, gravar a referência, pagar), porque
      a Efí não tem chave de idempotência. Aprovado pela operadora, publica `PaymentApproved`
      (`captured: false`: o valor está garantido e o pedido segue); a liquidação chega depois pela
      notificação. Recusado, `PaymentFailed`.
    - **Cartão que não se confirma**: o aprovado pela operadora ainda pode não ser pago (na Efí, `unpaid`) ou ser
      cancelado antes de liquidar (`canceled`), e o aprovado ou liquidado pode ser contestado pelo cliente
      (`contested`, o chargeback). O pedido já foi confirmado, então sai `PaymentReversed`: o orders o para se
      ainda não foi ao fornecedor, ou o marca para a equipe. Se o pedido já tinha sido cancelado e a devolução
      esperava a liquidação, não há mais o que devolver: sai `PaymentRefunded` com `kind: void`.

    `OrderCancelled` antes da cobrança descarta a pendência. Depois (o fornecedor não atendeu, a nota foi
    rejeitada ou a equipe cancelou), o dinheiro volta: o PIX não pago e o cartão em análise são cancelados
    (nada chega a ser cobrado); o pago é estornado, e sai `PaymentRefunded`. O cartão aprovado e ainda não
    liquidado não se estorna na Efí: a devolução espera a liquidação e sai nela. O painel também estorna
    parte de um pagamento.

    Cada pedido é cobrado no máximo uma vez, e cada estorno acontece uma vez: o PIX tem o txid do pedido, a
    devolução do PIX o id saído da chave, e o cartão não se paga duas vezes.
defaultContentType: application/json

servers:
  dev:
    $ref: "./common/v1/common.yaml#/components/servers/dev"
  dev-internal:
    $ref: "./common/v1/common.yaml#/components/servers/dev-internal"

channels:
  paymentEvents:
    address: payments.payment.v1
    title: Pagamentos
    description: Resultado da cobrança de cada pedido. Chave = `order_id`.
    messages:
      PaymentPending:
        $ref: "#/components/messages/PaymentPending"
      PaymentApproved:
        $ref: "#/components/messages/PaymentApproved"
      PaymentFailed:
        $ref: "#/components/messages/PaymentFailed"
      PaymentRefunded:
        $ref: "#/components/messages/PaymentRefunded"
      PaymentRefundFailed:
        $ref: "#/components/messages/PaymentRefundFailed"
      PaymentReversed:
        $ref: "#/components/messages/PaymentReversed"
    bindings:
      kafka:
        bindingVersion: 0.5.0
        topic: payments.payment.v1
        partitions: 3
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 604800000
  # Canais de outros serviços que o payments consome (definidos no contrato do dono)
  orderEvents:
    $ref: "./orders.v1.yaml#/channels/orderEvents"
  reservationEvents:
    $ref: "./inventory.v1.yaml#/channels/reservationEvents"

operations:
  publishPaymentEvents:
    action: send
    channel:
      $ref: "#/channels/paymentEvents"
    summary: Publica o andamento da cobrança (outbox).
    messages:
      - $ref: "#/channels/paymentEvents/messages/PaymentPending"
      - $ref: "#/channels/paymentEvents/messages/PaymentApproved"
      - $ref: "#/channels/paymentEvents/messages/PaymentFailed"
      - $ref: "#/channels/paymentEvents/messages/PaymentRefunded"
      - $ref: "#/channels/paymentEvents/messages/PaymentRefundFailed"
      - $ref: "#/channels/paymentEvents/messages/PaymentReversed"

  onOrderEvents:
    action: receive
    channel:
      $ref: "#/channels/orderEvents"
    summary: |
      Grava a cobrança pendente (placed); no cancelled, a descarta se ainda não foi feita, ou devolve o
      dinheiro (cancela o que não pagou ou estorna); no returned, estorna o que foi pago (#223).
    messages:
      - $ref: "#/channels/orderEvents/messages/OrderPlaced"
      - $ref: "#/channels/orderEvents/messages/OrderCancelled"
      - $ref: "#/channels/orderEvents/messages/OrderReturned"
    bindings:
      $ref: "#/components/operationBindings/PaymentsGroup"

  onStockReserved:
    action: receive
    channel:
      $ref: "#/channels/reservationEvents"
    summary: Marca o estoque como garantido; cobra se o `OrderPlaced` já chegou.
    messages:
      - $ref: "#/channels/reservationEvents/messages/StockReserved"
    bindings:
      $ref: "#/components/operationBindings/PaymentsGroup"

components:
  operationBindings:
    PaymentsGroup:
      kafka:
        bindingVersion: 0.5.0
        groupId:
          type: string
          const: payments

  messages:
    PaymentPending:
      name: PaymentPending
      title: PIX gerado
      summary: O PIX do pedido está pronto; o cliente paga pelo QR até `expires_at`. O orders o mostra no pedido.
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/OrderKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: PaymentPending
              event_version:
                const: 1
              producer:
                const: payments
              data:
                type: object
                required: [order_id, payment_id, amount, provider, method, pix]
                properties:
                  order_id:
                    type: string
                    format: uuid
                  payment_id:
                    type: string
                    format: uuid
                  amount:
                    $ref: "../openapi/common/v1/common.yaml#/components/schemas/Money"
                  provider:
                    $ref: "#/components/schemas/Provider"
                  method:
                    const: pix
                  pix:
                    $ref: "../openapi/payments.v1.yaml#/components/schemas/Pix"

    PaymentApproved:
      name: PaymentApproved
      title: Pagamento aprovado
      summary: |
        PIX pago, ou cartão aprovado pela operadora (`captured: false`, o valor garantido; a liquidação
        chega depois, pela notificação da Efí). O orders confirma o pedido.
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/OrderKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: PaymentApproved
              event_version:
                const: 1
              producer:
                const: payments
              data:
                type: object
                required: [order_id, payment_id, amount, provider, method, installments, captured]
                properties:
                  order_id:
                    type: string
                    format: uuid
                  payment_id:
                    type: string
                    format: uuid
                  amount:
                    $ref: "../openapi/common/v1/common.yaml#/components/schemas/Money"
                  provider:
                    $ref: "#/components/schemas/Provider"
                  provider_reference:
                    type: [string, "null"]
                    description: ID da cobrança no provedor.
                  method:
                    $ref: "../openapi/payments.v1.yaml#/components/schemas/PaymentMethod"
                  installments:
                    type: integer
                    minimum: 1
                    maximum: 12
                  fee_cents:
                    type: integer
                    format: int64
                    minimum: 0
                    description: A taxa do provedor neste pagamento, para a margem real do pedido (#225).
                  captured:
                    type: boolean
                    description: Falso no cartão aprovado e ainda não liquidado.

    PaymentFailed:
      name: PaymentFailed
      title: Pagamento recusado
      summary: Cartão recusado ou PIX expirado. O orders cancela o pedido, o que libera a reserva de estoque.
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/OrderKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: PaymentFailed
              event_version:
                const: 1
              producer:
                const: payments
              data:
                type: object
                required: [order_id, payment_id, amount, provider, failure_reason]
                properties:
                  order_id:
                    type: string
                    format: uuid
                  payment_id:
                    type: string
                    format: uuid
                  amount:
                    $ref: "../openapi/common/v1/common.yaml#/components/schemas/Money"
                  provider:
                    $ref: "#/components/schemas/Provider"
                  failure_reason:
                    $ref: "../openapi/payments.v1.yaml#/components/schemas/FailureReason"

    PaymentRefunded:
      name: PaymentRefunded
      title: Dinheiro devolvido
      summary: |
        `kind: void`: a autorização do cartão foi cancelada (nada chegou a ser cobrado). `kind: refund`: um
        estorno do que foi pago, total ou parte (o painel). `full`: o pedido inteiro voltou ao cliente; o
        orders marca o estorno.
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/OrderKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: PaymentRefunded
              event_version:
                const: 1
              producer:
                const: payments
              data:
                type: object
                required: [order_id, payment_id, amount, total_refunded_cents, provider, refunded_at, kind, full]
                properties:
                  order_id:
                    type: string
                    format: uuid
                  payment_id:
                    type: string
                    format: uuid
                  amount:
                    description: O que voltou nesta vez.
                    $ref: "../openapi/common/v1/common.yaml#/components/schemas/Money"
                  total_refunded_cents:
                    type: integer
                    format: int64
                    minimum: 0
                    description: O estornado até agora (no void, zero).
                  provider:
                    $ref: "#/components/schemas/Provider"
                  refund_reference:
                    type: [string, "null"]
                    description: ID do estorno no provedor (nulo no void).
                  refunded_at:
                    type: string
                    format: date-time
                  kind:
                    type: string
                    enum: [refund, void]
                  full:
                    type: boolean
                  reason:
                    type: [string, "null"]
                    description: |
                      Por que o dinheiro voltou; nulo no estorno pelo painel. `return`: o cliente desistiu da compra
                      (#223), e o fulfillment emite a nota de devolução em vez de cancelar a de venda.

    PaymentRefundFailed:
      name: PaymentRefundFailed
      title: Estorno não realizado
      summary: |
        O provedor aceitou o estorno e depois não o realizou (#396). Na Efí, a devolução do PIX termina
        `NAO_REALIZADO`, por exemplo quando a conta não tem saldo: a tarifa já saiu do valor recebido. O
        estorno sai das contas do pagamento (`total_refunded_cents` volta a ser o que de fato foi
        devolvido), o painel pode estornar de novo, e o orders volta o pedido a "estorno pendente".
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/OrderKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: PaymentRefundFailed
              event_version:
                const: 1
              producer:
                const: payments
              data:
                type: object
                required: [order_id, payment_id, amount, total_refunded_cents, provider, refund_reference, failed_at]
                properties:
                  order_id:
                    type: string
                    format: uuid
                  payment_id:
                    type: string
                    format: uuid
                  amount:
                    description: O que não voltou ao cliente.
                    $ref: "../openapi/common/v1/common.yaml#/components/schemas/Money"
                  total_refunded_cents:
                    type: integer
                    format: int64
                    minimum: 0
                    description: O de fato estornado, sem o que falhou.
                  provider:
                    $ref: "#/components/schemas/Provider"
                  refund_reference:
                    type: string
                    description: ID do estorno no provedor.
                  failed_at:
                    type: string
                    format: date-time

    PaymentReversed:
      name: PaymentReversed
      title: Pagamento aprovado que não vale mais
      summary: |
        O cartão já aprovado (o pedido confirmado) não se confirmou: a operadora não o pagou (`status: failed`, com
        o motivo), o cancelou antes de liquidar (`voided`), ou o cliente o contestou (`disputed`, o chargeback). O
        dinheiro não vem, ou volta ao cliente pela contestação: a loja não estorna. O orders cancela o pedido que
        ainda não foi ao fornecedor (`payment_failed`) e marca o que já foi, para a equipe cancelar lá ou responder
        a contestação no painel do provedor. Sai uma vez por pagamento: a notificação repetida não muda nada.
      traits:
        - $ref: "./common/v1/common.yaml#/components/messageTraits/KafkaEvent"
      bindings:
        $ref: "./common/v1/common.yaml#/components/messageBindings/OrderKey"
      payload:
        allOf:
          - $ref: "./common/v1/common.yaml#/components/schemas/EventEnvelope"
          - type: object
            properties:
              event_type:
                const: PaymentReversed
              event_version:
                const: 1
              producer:
                const: payments
              data:
                type: object
                required: [order_id, payment_id, amount, provider, status, reversed_at]
                properties:
                  order_id:
                    type: string
                    format: uuid
                  payment_id:
                    type: string
                    format: uuid
                  amount:
                    $ref: "../openapi/common/v1/common.yaml#/components/schemas/Money"
                  provider:
                    $ref: "#/components/schemas/Provider"
                  provider_reference:
                    type: [string, "null"]
                    description: ID da cobrança no provedor.
                  status:
                    type: string
                    enum: [failed, voided, disputed]
                    description: O status do pagamento agora.
                  failure_reason:
                    description: O motivo, no `failed`; nulo nos outros.
                    oneOf:
                      - $ref: "../openapi/payments.v1.yaml#/components/schemas/FailureReason"
                      - type: "null"
                  reversed_at:
                    type: string
                    format: date-time

  schemas:
    Provider:
      type: string
      description: O provedor (`mercadopago` só nos pagamentos de antes do #379).
      enum: [efi, mercadopago]
