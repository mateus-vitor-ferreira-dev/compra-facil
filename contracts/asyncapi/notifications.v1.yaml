asyncapi: 3.1.0
info:
  title: CompraFácil — Notifications Events
  version: 1.0.0
  description: |
    O serviço **notifications** (time de Processamento de compras, ASP.NET Core) só consome eventos:
    envia o e-mail de pedido confirmado ou cancelado e o de confirmação de e-mail da conta (Mailpit em
    dev). Não publica nada.

    O e-mail de um mesmo `event_id` sai no máximo uma vez.
defaultContentType: application/json

servers:
  dev:
    $ref: "./common/v1/common.yaml#/components/servers/dev"
  dev-internal:
    $ref: "./common/v1/common.yaml#/components/servers/dev-internal"

channels:
  orderEvents:
    $ref: "./orders.v1.yaml#/channels/orderEvents"
  accountEvents:
    $ref: "./identity.v1.yaml#/channels/accountEvents"

operations:
  onOrderOutcome:
    action: receive
    channel:
      $ref: "#/channels/orderEvents"
    summary: Avisa o cliente do resultado do pedido.
    messages:
      - $ref: "#/channels/orderEvents/messages/OrderConfirmed"
      - $ref: "#/channels/orderEvents/messages/OrderCancelled"
    bindings:
      kafka:
        bindingVersion: 0.5.0
        groupId:
          type: string
          const: notifications

  onEmailConfirmationRequested:
    action: receive
    channel:
      $ref: "#/channels/accountEvents"
    summary: Manda o e-mail com o link de confirmação.
    messages:
      - $ref: "#/channels/accountEvents/messages/EmailConfirmationRequested"
    bindings:
      kafka:
        bindingVersion: 0.5.0
        groupId:
          type: string
          const: notifications
