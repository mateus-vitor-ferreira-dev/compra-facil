asyncapi: 3.1.0
info:
  title: CompraFácil — Notifications Events
  version: 1.0.0
  description: |
    O serviço **notifications** (time de Processamento de compras, ASP.NET Core) só consome eventos:
    envia o e-mail de pedido confirmado ou cancelado, o de enviado (com o rastreio) e o de entregue (com o
    prazo de arrependimento), o da devolução e o do estorno, o da nota fiscal emitida (com o link do pedido, onde
    fica o DANFE), o das instruções para devolver o produto e o de confirmação de e-mail da conta (Mailpit em dev). Não publica nada.

    O e-mail de um mesmo `event_id` sai no máximo uma vez.
defaultContentType: application/json

servers:
  dev:
    $ref: "./common/v1/common.yaml#/components/servers/dev"
  dev-internal:
    $ref: "./common/v1/common.yaml#/components/servers/dev-internal"

channels:
  orderEvents:
    $ref: "./orders.v1.yaml#/channels/orderEvents"
  accountEvents:
    $ref: "./identity.v1.yaml#/channels/accountEvents"
  invoiceEvents:
    $ref: "./fulfillment.v1.yaml#/channels/invoiceEvents"
  supplierOrderEvents:
    $ref: "./fulfillment.v1.yaml#/channels/supplierOrderEvents"

operations:
  onOrderOutcome:
    action: receive
    channel:
      $ref: "#/channels/orderEvents"
    summary: Avisa o cliente do resultado do pedido.
    messages:
      - $ref: "#/channels/orderEvents/messages/OrderConfirmed"
      - $ref: "#/channels/orderEvents/messages/OrderCancelled"
      - $ref: "#/channels/orderEvents/messages/OrderReturned"
      - $ref: "#/channels/orderEvents/messages/OrderRefunded"
      - $ref: "#/channels/orderEvents/messages/OrderShipped"
      - $ref: "#/channels/orderEvents/messages/OrderDelivered"
    bindings:
      kafka:
        bindingVersion: 0.5.0
        groupId:
          type: string
          const: notifications

  onSupplierReturnOpened:
    action: receive
    channel:
      $ref: "#/channels/supplierOrderEvents"
    summary: Manda ao cliente o código da devolução e o endereço para onde mandar o produto.
    messages:
      - $ref: "#/channels/supplierOrderEvents/messages/SupplierReturnOpened"
    bindings:
      kafka:
        bindingVersion: 0.5.0
        groupId:
          type: string
          const: notifications

  onInvoiceIssued:
    action: receive
    channel:
      $ref: "#/channels/invoiceEvents"
    summary: Manda ao cliente a nota fiscal emitida, com o link do pedido.
    messages:
      - $ref: "#/channels/invoiceEvents/messages/InvoiceIssued"
    bindings:
      kafka:
        bindingVersion: 0.5.0
        groupId:
          type: string
          const: notifications

  onEmailConfirmationRequested:
    action: receive
    channel:
      $ref: "#/channels/accountEvents"
    summary: Manda o e-mail com o link de confirmação.
    messages:
      - $ref: "#/channels/accountEvents/messages/EmailConfirmationRequested"
    bindings:
      kafka:
        bindingVersion: 0.5.0
        groupId:
          type: string
          const: notifications
