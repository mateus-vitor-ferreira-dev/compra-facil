# Middlewares do gateway. Este arquivo passa pelo template do Traefik (Go template + Sprig):
# as origens do CORS vêm da variável CORS_ALLOWED_ORIGINS (lista separada por vírgula).
http:
  middlewares:
    strip-service-prefix:
      stripPrefixRegex:
        regex: ["^/(catalog|orders|inventory|payments)"]

    cors:
      headers:
        accessControlAllowOriginList:
{{- range $origin := splitList "," (env "CORS_ALLOWED_ORIGINS") }}
          - {{ trim $origin | quote }}
{{- end }}
        accessControlAllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        # os headers que os contratos usam
        accessControlAllowHeaders: [Content-Type, Authorization, Idempotency-Key, If-Match, X-Request-ID]
        # o que o front precisa ler da resposta
        accessControlExposeHeaders: [Location, ETag, X-Request-ID, X-Trace-Id, Retry-After, X-Cache]
        accessControlAllowCredentials: false
        accessControlMaxAge: 600
        addVaryHeader: true

    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          Server: ""

    # por IP do cliente: média de 50 req/s com rajada de 100 (o k6 de campanha mede o efeito)
    catalog-rate-limit:
      rateLimit:
        average: 50
        period: 1s
        burst: 100

    # o contrato exige 429 em application/problem+json; o Traefik responde texto puro, então o corpo
    # vem do próprio catalog (GET /problems/429), mantendo o status do rate limit
    catalog-problem-429:
      errors:
        status: ["429"]
        service: catalog
        query: /problems/{status}
