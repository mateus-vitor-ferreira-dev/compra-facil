version: "2"

run:
  timeout: 3m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - noctx
    - revive
    - sloglint
    - testifylint
    - unconvert
    - wrapcheck
  settings:
    revive:
      rules:
        - name: exported
          disabled: true # tipos exportados internos não precisam de doc obrigatória
    wrapcheck:
      # erros do GORM são traduzidos por repository.mapError na borda do pacote
      ignore-package-globs:
        - gorm.io/*
        # erros de domínio (ValidationError, ErrNotFound...) sobem de propósito sem embrulho
        - github.com/mateus-vitor-ferreira-dev/compra-facil/*
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - .JSON(
    sloglint:
      kv-only: false
      attr-only: false
      no-global: default
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, wrapcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mateus-vitor-ferreira-dev/compra-facil
