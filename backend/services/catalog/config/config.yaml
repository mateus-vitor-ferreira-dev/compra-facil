# Defaults locais. Qualquer chave pode ser sobrescrita por env: http.port -> CATALOG_HTTP_PORT.
app:
  name: catalog
  env: local

http:
  port: 8001
  read_timeout: 5s
  write_timeout: 10s
  shutdown_timeout: 15s

grpc:
  port: 9001
  # reflexão permite usar grpcurl sem o .proto; desligue em produção (CATALOG_GRPC_REFLECTION=false)
  reflection: true

log:
  level: info

db:
  # compose local (task up); em container use CATALOG_DB_DSN apontando para postgres:5432
  dsn: postgres://catalog:compra-facil@localhost:55432/catalog?sslmode=disable
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m
  slow_query: 200ms
  migrate_on_start: true

auth:
  # JWT RS256 emitidos pelo identity (role admin libera /v1/admin/*), validados pelo JWKS em
  # <authority>/.well-known/jwks.json. Token local de operador: `task token`.
  authority: http://localhost:8006
  issuer: compra-facil-identity
  audience: compra-facil
  leeway: 30s

cache:
  # cache-aside das leituras públicas (detalhe, listagens, categorias, campanhas). Escrita admin
  # invalida tudo; o TTL também não passa do fim da campanha que dá o desconto nem do início da
  # próxima campanha (o preço efetivo muda nesses instantes).
  enabled: true
  product_ttl: 5m
  list_ttl: 1m
  redis:
    # compose local; em container use CATALOG_CACHE_REDIS_ADDR=redis:6379
    addr: localhost:6379
    password: ""
    db: 0
    # timeout curto: se o Redis travar, a leitura cai no banco em vez de esperar
    timeout: 100ms

events:
  # Os eventos (contracts/asyncapi/catalog.v1.yaml) são gravados no outbox junto com cada escrita;
  # o relay os publica no Kafka. Kafka fora não afeta as escritas: o relay tenta de novo com backoff.
  relay_enabled: true
  # compose local; em container use CATALOG_EVENTS_BROKERS=redpanda:9092 (lista separada por vírgula)
  brokers: [localhost:19092]
  poll_interval: 500ms
  batch_size: 100
  # tempo para o broker confirmar um lote; estourou, o lote volta para o outbox
  publish_timeout: 10s
  max_backoff: 10s
