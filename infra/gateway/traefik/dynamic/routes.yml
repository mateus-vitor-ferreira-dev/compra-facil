# Rotas do gateway: /<serviço>/... -> serviço, sem o prefixo. Ex.: /orders/v1/orders -> orders:8002/v1/orders.
# O Swagger de cada serviço usa URL relativa, então /orders/docs também funciona por aqui.
http:
  routers:
    catalog:
      rule: PathPrefix(`/catalog`)
      entryPoints: [web]
      service: catalog
      # vitrine: recebe o pico das campanhas, por isso o rate limit
      # catalog-problem-429 antes do rate limit: o errors só enxerga respostas de quem vem depois dele
      middlewares: [cors, security-headers, strip-bff-key, catalog-problem-429, catalog-rate-limit, strip-service-prefix]
    orders:
      rule: PathPrefix(`/orders`)
      entryPoints: [web]
      service: orders
      middlewares: [cors, security-headers, strip-bff-key, strip-service-prefix]
    inventory:
      rule: PathPrefix(`/inventory`)
      entryPoints: [web]
      service: inventory
      middlewares: [cors, security-headers, strip-bff-key, strip-service-prefix]
    payments:
      rule: PathPrefix(`/payments`)
      entryPoints: [web]
      service: payments
      middlewares: [cors, security-headers, strip-bff-key, strip-service-prefix]
    identity:
      rule: PathPrefix(`/identity`)
      entryPoints: [web]
      service: identity
      middlewares: [cors, security-headers, strip-bff-key, strip-service-prefix]
    # dos avisos, só a operação (dead letter topic); o resto do notifications não sai do cluster
    notifications-admin:
      rule: PathPrefix(`/notifications/v1/admin`)
      entryPoints: [web]
      service: notifications
      middlewares: [cors, security-headers, strip-bff-key, strip-service-prefix]
{{- if ne (env "GATEWAY_FULFILLMENT") "off" }}
    # do fulfillment (ADR 0007), só o webhook do fornecedor (assinado) e a operação; a produção liga
    # quando houver fornecedor de verdade
    fulfillment-webhooks:
      rule: PathPrefix(`/fulfillment/v1/webhooks`)
      entryPoints: [web]
      service: fulfillment
      middlewares: [security-headers, strip-bff-key, strip-service-prefix]
    fulfillment-admin:
      rule: PathPrefix(`/fulfillment/v1/admin`)
      entryPoints: [web]
      service: fulfillment
      middlewares: [cors, security-headers, strip-bff-key, strip-service-prefix]
    # a cotação de frete (#222): pública, então com o mesmo limite das leituras do catálogo
    fulfillment-shipping:
      rule: PathPrefix(`/fulfillment/v1/shipping`)
      entryPoints: [web]
      service: fulfillment
      middlewares: [cors, security-headers, strip-bff-key, catalog-problem-429, catalog-rate-limit, strip-service-prefix]
{{- if env "BFF_GATEWAY_KEY" }}
    fulfillment-shipping-bff:
      rule: PathPrefix(`/fulfillment/v1/shipping`) && Header(`X-Bff-Key`, `{{ env "BFF_GATEWAY_KEY" }}`)
      entryPoints: [web]
      service: fulfillment
      middlewares: [cors, security-headers, strip-bff-key, catalog-problem-429, catalog-rate-limit-bff, strip-service-prefix]
{{- end }}
    # o DANFE das notas do cliente logado (#221)
    fulfillment-me:
      rule: PathPrefix(`/fulfillment/v1/me`)
      entryPoints: [web]
      service: fulfillment
      middlewares: [cors, security-headers, strip-bff-key, strip-service-prefix]
{{- end }}
{{- if ne (env "GATEWAY_MEDIA") "off" }}
    # as fotos dos produtos no ambiente local; em produção elas saem do R2, com domínio próprio
    media:
      rule: PathPrefix(`/media`)
      entryPoints: [web]
      service: media
      middlewares: [security-headers, strip-service-prefix]
{{- end }}
    # login, refresh, logout, cadastro e confirmação de e-mail: as rotas que aceitam senha ou token, com rate limit
    identity-credentials:
      rule: PathPrefix(`/identity/v1/sessions`) || PathPrefix(`/identity/v1/accounts`)
      entryPoints: [web]
      service: identity
      middlewares: [cors, security-headers, strip-bff-key, identity-problem-429, identity-rate-limit, strip-service-prefix]
{{- if env "BFF_GATEWAY_KEY" }}
    # O BFF do front chama as APIs pelo servidor: sem isto, o limite por IP valeria para a loja inteira
    # somada. Com o segredo do BFF (X-Bff-Key), o limite passa a ser pelo IP do comprador, que o BFF manda
    # em X-Client-IP. Sem o segredo (ou com outro), a requisição cai nas rotas de cima, limitadas pelo IP
    # de origem: um X-Client-IP forjado não escapa do limite. A regra mais longa tem prioridade (#176).
    catalog-bff:
      rule: PathPrefix(`/catalog`) && Header(`X-Bff-Key`, `{{ env "BFF_GATEWAY_KEY" }}`)
      entryPoints: [web]
      service: catalog
      middlewares: [cors, security-headers, strip-bff-key, catalog-problem-429, catalog-rate-limit-bff, strip-service-prefix]
    identity-credentials-bff:
      rule: (PathPrefix(`/identity/v1/sessions`) || PathPrefix(`/identity/v1/accounts`)) && Header(`X-Bff-Key`, `{{ env "BFF_GATEWAY_KEY" }}`)
      entryPoints: [web]
      service: identity
      middlewares: [cors, security-headers, strip-bff-key, identity-problem-429, identity-rate-limit-bff, strip-service-prefix]
{{- end }}

  services:
    catalog:
      loadBalancer:
        servers: [{ url: "http://catalog:8001" }]
        healthCheck: { path: /ready, interval: 5s, timeout: 2s }
    orders:
      loadBalancer:
        servers: [{ url: "http://orders:8002" }]
        healthCheck: { path: /ready, interval: 5s, timeout: 2s }
    inventory:
      loadBalancer:
        servers: [{ url: "http://inventory:8003" }]
        healthCheck: { path: /ready, interval: 5s, timeout: 2s }
    payments:
      loadBalancer:
        servers: [{ url: "http://payments:8004" }]
        healthCheck: { path: /ready, interval: 5s, timeout: 2s }
    notifications:
      loadBalancer:
        servers: [{ url: "http://notifications:8005" }]
        healthCheck: { path: /ready, interval: 5s, timeout: 2s }
{{- if ne (env "GATEWAY_FULFILLMENT") "off" }}
    fulfillment:
      loadBalancer:
        servers: [{ url: "http://fulfillment:8007" }]
        healthCheck: { path: /ready, interval: 5s, timeout: 2s }
{{- end }}
{{- if ne (env "GATEWAY_MEDIA") "off" }}
    media:
      loadBalancer:
        servers: [{ url: "http://media:8080" }]
        healthCheck: { path: /health, interval: 5s, timeout: 2s }
{{- end }}
    identity:
      loadBalancer:
        servers: [{ url: "http://identity:8006" }]
        healthCheck: { path: /ready, interval: 5s, timeout: 2s }
