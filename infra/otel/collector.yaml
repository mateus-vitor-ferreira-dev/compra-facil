# OpenTelemetry Collector: ponto único de entrada da telemetria. Os serviços e o gateway mandam OTLP
# para cá; o Collector distribui: traces → Tempo, logs → Loki, métricas → Prometheus.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # lag dos consumers (orders, inventory, payments, notifications) lido direto do Redpanda
  kafka_metrics:
    brokers: [redpanda:9092]
    scrapers: [brokers, topics, consumers]
    collection_interval: 10s

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Loki 3 recebe OTLP nativo (atributos viram structured metadata, trace_id incluso)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  # Prometheus 3 recebe OTLP nativo (--web.enable-otlp-receiver)
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, kafka_metrics]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
