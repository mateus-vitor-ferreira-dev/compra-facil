# Infraestrutura do ambiente local: um Postgres com um banco por serviço, Redis,
# Redpanda (Kafka) + Console, Mailpit e os serviços da aplicação.
name: compra-facil

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SERVICE_DATABASES: catalog,orders,inventory,payments,notifications
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-compra-facil}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.3-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v26.2.5
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      # "internal" é usado pelos containers; "external" pelo host (dotnet run / go run)
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${KAFKA_PORT:-19092}
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${KAFKA_PORT:-19092}:19092"
      - "${SCHEMA_REGISTRY_PORT:-18081}:18081"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 15

  redpanda-console:
    image: redpandadata/console:v3.13.0
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      redpanda:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- serviços ----------
  catalog:
    build:
      context: ../../services/catalog
      target: api
      args:
        VERSION: ${VERSION:-dev}
    image: compra-facil/catalog:${VERSION:-dev}
    environment:
      CATALOG_APP_ENV: compose
      CATALOG_DB_DSN: postgres://catalog:${SERVICE_DB_PASSWORD:-compra-facil}@postgres:5432/catalog?sslmode=disable
      CATALOG_CACHE_REDIS_ADDR: redis:6379
    ports:
      - "${CATALOG_HTTP_PORT:-8001}:8001"
      - "${CATALOG_GRPC_PORT:-9001}:9001"
    depends_on:
      postgres:
        condition: service_healthy
      # cache é opcional: o catalog sobe e lê do banco mesmo sem o Redis
      redis:
        condition: service_started
        required: false

  # só roda sob demanda: docker compose run --rm catalog-seed [-reset] [-products N]
  catalog-seed:
    build:
      context: ../../services/catalog
      target: seed
    image: compra-facil/catalog-seed:${VERSION:-dev}
    profiles: [tools]
    environment:
      CATALOG_DB_DSN: postgres://catalog:${SERVICE_DB_PASSWORD:-compra-facil}@postgres:5432/catalog?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redpanda-data:
