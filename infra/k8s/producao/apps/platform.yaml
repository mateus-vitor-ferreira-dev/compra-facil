# A base da produção (#159): namespace, emissores e certificados, o HTTPS do Traefik e os middlewares
# do gateway (cabeçalhos, CORS, rate limit, a checagem do BFF).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/mateus-vitor-ferreira-dev/compra-facil.git
    targetRevision: main
    path: infra/k8s/producao/platform/base
  destination:
    server: https://kubernetes.default.svc
    namespace: compra-facil
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
