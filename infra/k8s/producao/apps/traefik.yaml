# O Traefik que vem com o k3s: HTTP vira HTTPS (#159).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/mateus-vitor-ferreira-dev/compra-facil.git
    targetRevision: main
    path: infra/k8s/producao/platform/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
