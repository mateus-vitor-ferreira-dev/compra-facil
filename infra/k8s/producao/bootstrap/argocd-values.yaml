# Argo CD (chart argo/argo-cd 10.11.6), instalado uma vez à mão (ver ../README.md); daí em diante ele
# se mantém pelo próprio GitOps. Um nó só: sem HA, recursos contidos.
global:
  domain: argocd.comprafacil.example
configs:
  params:
    # o TLS termina no Traefik
    server.insecure: true
  cm:
    # o estado de saúde das Applications entra no status (o app of apps espera os filhos ficarem bem)
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then hs.message = obj.status.health.message end
      end
      return hs
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
server:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
redis:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
