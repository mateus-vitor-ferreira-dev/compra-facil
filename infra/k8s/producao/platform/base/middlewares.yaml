# Os middlewares do gateway, os mesmos do compose (infra/gateway/traefik/dynamic/middlewares.yml):
# cabeçalhos de segurança, CORS para a loja, rate limit da vitrine e do login, por IP e, com o
# segredo do BFF, por comprador (#176), e o 429 em ProblemDetails servido pelo próprio serviço.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    customResponseHeaders:
      Server: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors
spec:
  headers:
    accessControlAllowOriginList:
      - https://comprafacil.example
      - https://www.comprafacil.example
    accessControlAllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    accessControlAllowHeaders: [Content-Type, Authorization, Idempotency-Key, If-Match, X-Request-ID]
    accessControlExposeHeaders: [Location, ETag, X-Request-ID, X-Trace-Id, Retry-After, X-Cache]
    accessControlAllowCredentials: false
    accessControlMaxAge: 600
    addVaryHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: catalog-rate-limit
spec:
  rateLimit: { average: 50, period: 1s, burst: 100 }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: catalog-rate-limit-bff
spec:
  rateLimit:
    average: 50
    period: 1s
    burst: 100
    sourceCriterion: { requestHeaderName: X-Client-IP }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: identity-rate-limit
spec:
  rateLimit: { average: 5, period: 1s, burst: 20 }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: identity-rate-limit-bff
spec:
  rateLimit:
    average: 5
    period: 1s
    burst: 20
    sourceCriterion: { requestHeaderName: X-Client-IP }
---
# o contrato exige o 429 em application/problem+json: o corpo vem do próprio serviço
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: catalog-problem-429
spec:
  errors:
    status: ["429"]
    service: { name: catalog, port: http }
    query: /problems/{status}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: identity-problem-429
spec:
  errors:
    status: ["429"]
    service: { name: identity, port: http }
    query: /problems/{status}
---
# o segredo do BFF não segue para os serviços: entra em todas as rotas, depois da checagem do bff-key
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-bff-key
spec:
  headers:
    customRequestHeaders:
      X-Bff-Key: ""
