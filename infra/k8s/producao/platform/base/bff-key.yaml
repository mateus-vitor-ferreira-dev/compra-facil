# A checagem do segredo do BFF (#176). No compose ela é a própria regra de rota do Traefik; aqui a regra
# ficaria no git, então um Caddy mínimo (a mesma imagem da mídia) confere X-Bff-Key contra o Secret e o
# Traefik pergunta a ele (forwardAuth) antes das rotas do BFF. Chave errada: 403, e o rate limit por
# comprador não vale.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bff-key
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }
    :8080 {
      @valid header X-Bff-Key {$BFF_GATEWAY_KEY}
      respond @valid 204
      respond 403
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-key
  labels: { app.kubernetes.io/name: bff-key }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: bff-key }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bff-key }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: caddy
          image: caddy:2.11.6-alpine
          args: [caddy, run, --config, /etc/caddy/Caddyfile]
          env:
            - name: BFF_GATEWAY_KEY
              valueFrom:
                secretKeyRef: { name: bff-gateway-key, key: key }
            - { name: XDG_DATA_HOME, value: /tmp }
            - { name: XDG_CONFIG_HOME, value: /tmp }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # o binário do Caddy traz a capability de abrir portas baixas: sem ela no conjunto, o kernel
            # recusa executá-lo (a única que a política restricted deixa manter)
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] }
          volumeMounts:
            - { name: config, mountPath: /etc/caddy }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: config
          configMap: { name: bff-key }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bff-key
spec:
  selector: { app.kubernetes.io/name: bff-key }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bff-key
spec:
  forwardAuth:
    address: http://bff-key.compra-facil.svc.cluster.local:8080
