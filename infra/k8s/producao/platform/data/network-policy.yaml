# Os dados só atendem a loja: Postgres, Redpanda e Redis recebem conexão dos pods do namespace
# compra-facil e de mais ninguém (o Traefik, por exemplo, não chega neles). O Postgres também do
# operador do CloudNativePG, que acompanha a instância pela porta de status.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
      ports:
        - { port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redpanda-redis
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [redpanda, redis] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
