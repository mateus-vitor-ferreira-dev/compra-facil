# O backup do Postgres no bucket compra-facil-backups (infra/oci/storage.tf): o WAL contínuo e uma base
# por dia, 30 dias de janela para voltar a qualquer instante (PITR). Restauração: docs/runbooks.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backups
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://compra-facil-backups/
    # o endpoint S3 compatível da Oracle (tofu output s3_endpoint): scripts/deploy/definir-object-storage.sh
    endpointURL: https://objectstorage.example
    s3Credentials:
      accessKeyId: { name: backup-s3, key: ACCESS_KEY_ID }
      secretAccessKey: { name: backup-s3, key: ACCESS_SECRET_KEY }
      region: { name: backup-s3, key: REGION }
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # o boto3 recente manda checksums (CRC32) que o S3 compatível da Oracle recusa; só quando exigido
      - { name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required }
      - { name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required }
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 256Mi }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-diario
spec:
  # segundos primeiro; 6h UTC = 3h em Brasília, a loja parada
  schedule: "0 0 6 * * *"
  # a primeira base já na criação: sem ela o WAL arquivado não restaura nada
  immediate: true
  backupOwnerReference: self
  cluster: { name: postgres }
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
