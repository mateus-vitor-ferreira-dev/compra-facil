# O Kafka da loja: um broker Redpanda com o log num volume. Um broker só, fator de replicação 1 (a VM é
# uma); o que não pode se perder já está no outbox de cada serviço, no Postgres, até o broker confirmar.
# Sem criação automática de tópico: cada serviço cria os seus (o relay do outbox e as DLTs).
# Configuração explícita, em modo de produção: sem ela o rpk parte em modo de desenvolvimento, que pula o
# fsync (perde mensagem confirmada se a VM cair).
apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda
data:
  redpanda.yaml: |
    redpanda:
      data_directory: /var/lib/redpanda/data
      developer_mode: false
      # um broker só: sem seeds, ele mesmo forma o cluster
      empty_seed_starts_cluster: true
      seed_servers: []
      kafka_api:
        - { name: internal, address: 0.0.0.0, port: 9092 }
      advertised_kafka_api:
        - { name: internal, address: redpanda, port: 9092 }
      rpc_server: { address: 0.0.0.0, port: 33145 }
      advertised_rpc_api: { address: redpanda, port: 33145 }
      admin:
        - { address: 0.0.0.0, port: 9644 }
    rpk:
      # divide a VM com o resto: sem prender CPU nem a memória toda
      overprovisioned: true
  # propriedades do cluster, lidas só na primeira partida
  .bootstrap.yaml: |
    auto_create_topics_enabled: false
    default_topic_replications: 1
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels: { app: redpanda }
spec:
  selector: { app: redpanda }
  ports:
    - { name: kafka, port: 9092 }
    - { name: admin, port: 9644 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels: { app: redpanda }
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels: { app: redpanda }
  template:
    metadata:
      labels: { app: redpanda }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      # o rpk reescreve o redpanda.yaml na partida: a cópia vai para um diretório gravável
      initContainers:
        - name: config
          image: redpandadata/redpanda:v26.2.5
          command: [cp, /config/redpanda.yaml, /config/.bootstrap.yaml, /etc/redpanda/]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config-source, mountPath: /config }
            - { name: config, mountPath: /etc/redpanda }
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v26.2.5
          args: [redpanda, start, --smp=1, --memory=1G, --reserve-memory=0M, --default-log-level=warn]
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: admin, containerPort: 9644 }
          readinessProbe:
            httpGet: { path: /v1/status/ready, port: admin }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /v1/status/ready, port: admin }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 250m, memory: 1280Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/redpanda/data }
            - { name: config, mountPath: /etc/redpanda }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config-source, configMap: { name: redpanda } }
        - { name: config, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 10Gi }
