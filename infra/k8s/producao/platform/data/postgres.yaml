# Um Postgres para a loja, um banco e um usuário dono por serviço (database-per-service, como no compose).
# Uma instância só: a VM é uma, e uma réplica no mesmo disco não protege de nada. O que protege é o
# backup contínuo no Object Storage (backup.yaml): WAL arquivado a cada segmento, base diária, PITR.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1
  # "standard": traz pg_trgm e unaccent (a busca do catalog); multi-arquitetura, a VM é ARM
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie
  storage:
    size: 20Gi
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 2Gi }
  postgresql:
    parameters:
      shared_buffers: 512MB
      effective_cache_size: 1536MB
      max_connections: "200"
      # o que demora mais que isso aparece no log (e no Loki, #162)
      log_min_duration_statement: 500ms
    # cada serviço só entra no próprio banco (o usuário e o banco têm o mesmo nome); as regras do operador
    # (replicação, socket local) vêm antes destas e seguem valendo
    pg_hba:
      - host sameuser all all scram-sha-256
      - host all all all reject
  # o banco criado na inicialização; os outros vêm dos Database abaixo
  bootstrap:
    initdb:
      database: catalog
      owner: catalog
      secret: { name: pg-catalog }
  # cada serviço entra com o próprio usuário, a senha vem do Secret (basic-auth) de mesmo nome; trocar
  # a senha no Secret troca no banco
  managed:
    roles:
      - { name: catalog, ensure: present, login: true, passwordSecret: { name: pg-catalog } }
      - { name: orders, ensure: present, login: true, passwordSecret: { name: pg-orders } }
      - { name: inventory, ensure: present, login: true, passwordSecret: { name: pg-inventory } }
      - { name: payments, ensure: present, login: true, passwordSecret: { name: pg-payments } }
      - { name: notifications, ensure: present, login: true, passwordSecret: { name: pg-notifications } }
      - { name: identity, ensure: present, login: true, passwordSecret: { name: pg-identity } }
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backups
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: orders
spec:
  cluster: { name: postgres }
  name: orders
  owner: orders
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: inventory
spec:
  cluster: { name: postgres }
  name: inventory
  owner: inventory
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: payments
spec:
  cluster: { name: postgres }
  name: payments
  owner: payments
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: notifications
spec:
  cluster: { name: postgres }
  name: notifications
  owner: notifications
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: identity
spec:
  cluster: { name: postgres }
  name: identity
  owner: identity
