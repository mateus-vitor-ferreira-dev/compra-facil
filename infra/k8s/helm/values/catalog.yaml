# catalog: o único que escala sozinho (HPA por CPU), como no experimento da #90
image: { repository: compra-facil/catalog }
port: 8001
grpcPort: 9001
env:
  CATALOG_APP_ENV: compose # cluster local, não produção
  CATALOG_AUTH_AUTHORITY: http://identity:8006
  CATALOG_DB_DSN: postgres://catalog:compra-facil@postgres:5432/catalog?sslmode=disable
  CATALOG_CACHE_REDIS_ADDR: redis:6379
  CATALOG_EVENTS_BROKERS: redpanda:9092
resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { cpu: 300m, memory: 192Mi }
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
ingress: { prefix: /catalog }
