image: { repository: compra-facil/inventory }
port: 8003
env:
  ConnectionStrings__Default: Host=postgres;Port=5432;Database=inventory;Username=inventory;Password=compra-facil
  Kafka__BootstrapServers: redpanda:9092
  # tokens do identity (rede interna do cluster, sem TLS)
  Auth__Authority: http://identity:8006
  Auth__RequireHttpsMetadata: "false"
  Inventory__InitialOnHandForNewProducts: "100"
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 384Mi }
ingress: { prefix: /inventory }
