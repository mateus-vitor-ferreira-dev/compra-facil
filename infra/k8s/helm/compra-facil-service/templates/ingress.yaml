{{- if .Values.ingress.enabled }}
# Traefik (ingress padrão do k3s): /<prefixo>/... chega ao serviço sem o prefixo, como no compose.
# O Traefik balanceia por requisição entre as réplicas (o kube-proxy, por conexão).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "svc.name" . }}-strip-prefix
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes: [{{ .Values.ingress.prefix | quote }}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "svc.name" . }}
  labels: {{- include "svc.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "svc.name" . }}-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.prefix }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "svc.name" . }}
                port: { name: http }
{{- end }}
