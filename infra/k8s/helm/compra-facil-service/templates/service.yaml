apiVersion: v1
kind: Service
metadata:
  name: {{ include "svc.name" . }}
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  selector: {{- include "svc.selector" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.port }}, targetPort: http }
    {{- if .Values.grpcPort }}
    # gRPC (HTTP/2): conexão longa, presa a um pod; o orders reconecta a cada nova réplica pelo DNS
    - { name: grpc, port: {{ .Values.grpcPort }}, targetPort: grpc, appProtocol: kubernetes.io/h2c }
    {{- end }}
