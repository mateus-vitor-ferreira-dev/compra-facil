{{- if .Values.route.enabled }}
{{- $svc := include "svc.name" . -}}
{{- $ns := .Release.Namespace -}}
{{- $host := .Values.route.host -}}
{{- $base := .Values.route.middlewares -}}
# Produção: /<prefixo>/... em https://<host> chega ao serviço sem o prefixo, com os middlewares do
# gateway (cabeçalhos de segurança, CORS, rate limit). Os caminhos de "extra" têm middlewares próprios
# e, com o segredo do BFF (cabeçalho X-Bff-Key), o rate limit por comprador. A regra mais longa ganha.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $svc }}-strip-prefix
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes: [{{ .Values.ingress.prefix | quote }}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $svc }}
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`{{ $host }}`) && PathPrefix(`{{ .Values.ingress.prefix }}`)
      kind: Rule
      middlewares:
        {{- range $base }}
        - { name: {{ (splitList "/" .) | last }}, namespace: {{ (splitList "/" .) | first }} }
        {{- end }}
        - { name: {{ $svc }}-strip-prefix, namespace: {{ $ns }} }
      services:
        - { name: {{ $svc }}, port: http }
    {{- range .Values.route.extra }}
    {{- $prefix := .prefix }}
    - match: Host(`{{ $host }}`) && PathPrefix(`{{ $prefix }}`)
      kind: Rule
      middlewares:
        {{- range (concat $base .middlewares) }}
        - { name: {{ (splitList "/" .) | last }}, namespace: {{ (splitList "/" .) | first }} }
        {{- end }}
        - { name: {{ $svc }}-strip-prefix, namespace: {{ $ns }} }
      services:
        - { name: {{ $svc }}, port: http }
    {{- if .bffMiddlewares }}
    - match: Host(`{{ $host }}`) && PathPrefix(`{{ $prefix }}`) && HeaderRegexp(`X-Bff-Key`, `.+`)
      kind: Rule
      # a chave é conferida pelo middleware bff-key (só deixa passar a do BFF; sem ela, 403)
      middlewares:
        - { name: bff-key, namespace: {{ $ns }} }
        {{- range (concat $base .bffMiddlewares) }}
        - { name: {{ (splitList "/" .) | last }}, namespace: {{ (splitList "/" .) | first }} }
        {{- end }}
        - { name: {{ $svc }}-strip-prefix, namespace: {{ $ns }} }
      services:
        - { name: {{ $svc }}, port: http }
    {{- end }}
    {{- end }}
  tls:
    secretName: {{ .Values.route.tlsSecret }}
{{- end }}
