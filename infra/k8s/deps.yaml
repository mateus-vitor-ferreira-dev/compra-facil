# Infraestrutura de apoio do cluster local (k3d): uma instância de cada, sem persistência entre clusters.
# Em produção seriam serviços gerenciados ou operators; aqui o objetivo é o catalog escalar com o HPA.
# O script de criação dos bancos é o mesmo do compose (ConfigMap postgres-init, criado pelo task k8s:up).
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, labels: { app: postgres } }
spec:
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
            - { name: SERVICE_DATABASES, value: "catalog,orders,inventory,payments,notifications,identity" }
            - { name: SERVICE_DB_PASSWORD, value: compra-facil }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-d", "postgres"] }
            periodSeconds: 3
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 0755 }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, labels: { app: redis } }
spec:
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:8.8.3-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redpanda, labels: { app: redpanda } }
spec:
  selector: { matchLabels: { app: redpanda } }
  template:
    metadata: { labels: { app: redpanda } }
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v26.2.5
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --default-log-level=warn
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda:9092
          ports: [{ containerPort: 9092 }, { containerPort: 9644 }]
          readinessProbe:
            httpGet: { path: /v1/status/ready, port: 9644 }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: { name: redpanda }
spec:
  selector: { app: redpanda }
  ports: [{ name: kafka, port: 9092 }, { name: admin, port: 9644 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mailpit, labels: { app: mailpit } }
spec:
  selector: { matchLabels: { app: mailpit } }
  template:
    metadata: { labels: { app: mailpit } }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.6
          ports: [{ containerPort: 1025 }, { containerPort: 8025 }]
---
apiVersion: v1
kind: Service
metadata: { name: mailpit }
spec:
  selector: { app: mailpit }
  ports: [{ name: smtp, port: 1025 }, { name: http, port: 8025 }]
